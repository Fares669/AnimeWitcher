name: iOS Continued Processing Sync GREEN

on:
  push:
    branches:
      - refactor/background-downloader-authority

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/background-downloader-authority
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Apply continued-processing synchronization fix
        shell: bash
        run: echo '' | base64 -d | python3
      - name: Verify focused RED-to-GREEN contracts
        shell: bash
        run: |
          flutter pub get
          flutter test \
            test/core/services/download_continued_processing_start_ack_test.dart \
            test/core/services/ios_continued_processing_start_source_test.dart \
            test/core/services/ios_continued_processing_update_ack_source_test.dart \
            test/core/services/ios_continued_processing_completion_guard_test.dart \
            test/core/services/ios_continued_processing_expiration_test.dart \
            test/core/services/download_native_claim_foreground_test.dart \
            test/core/services/download_presentation_ownership_test.dart
          flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Commit GREEN fix and remove helper
        shell: bash
        run: |
          rm -f .github/workflows/ios-continued-processing-sync-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios/Runner/DownloadContinuedProcessingManager.swift \
            ios/Runner/AppDelegate.swift \
            lib/core/services/download_continued_processing_service.dart \
            lib/core/services/download_service.dart \
            .github/workflows/ios-continued-processing-sync-green.yml
          git commit -m "fix(ios): resynchronize continued download task"
          git push origin HEAD:refactor/background-downloader-authority
