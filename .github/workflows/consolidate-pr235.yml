name: Consolidate PR 235

on:
  push:
    branches:
      - plan/download-manager-reliability
    paths:
      - .github/workflows/consolidate-pr235.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-pr235:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability
          fetch-depth: 0
      - name: Merge agent branch with conflict preservation
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin plan/download-manager-reliability agent/core-download-state-recovery-20260911
          git reset --hard origin/plan/download-manager-reliability
          git merge --no-ff -X ours origin/agent/core-download-state-recovery-20260911 \
            -m "merge(downloads): consolidate PR 235 into reliability branch"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          git checkout -- . ':!pubspec.lock'
      - name: Record known follow-up REDs
        continue-on-error: true
        run: >-
          flutter test
          test/core/services/download_job_state_authority_test.dart
          test/core/services/download_job_state_queue_authority_test.dart
          test/core/services/download_logical_identity_test.dart
          test/core/services/download_logical_identity_start_test.dart
          test/core/services/download_resource_identity_guard_test.dart
          test/core/services/download_resource_identity_test.dart
          test/core/services/download_zero_restart_invariant_test.dart
          --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: Analyze consolidated tree
        continue-on-error: true
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Verify merge ancestry
        run: |
          git merge-base --is-ancestor origin/agent/core-download-state-recovery-20260911 HEAD
          git diff --check HEAD^1 HEAD
      - name: Push consolidated merge
        run: |
          git fetch origin plan/download-manager-reliability
          if ! git merge-base --is-ancestor origin/plan/download-manager-reliability HEAD; then
            git merge --no-edit origin/plan/download-manager-reliability
          fi
          git push origin HEAD:plan/download-manager-reliability
