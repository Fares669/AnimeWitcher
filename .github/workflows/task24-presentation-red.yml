name: Task 24 Record Audit Evidence

on:
  push:
    branches:
      - refactor/background-downloader-authority

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/background-downloader-authority
          fetch-depth: 0
      - name: Record verified Task 24 evidence
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path

          path = Path('docs/superpowers/plans/2026-09-15-background-downloader-authority.md')
          text = path.read_text()

          replacements = [
              (
                  "- [ ] **Step 2: Audit integrity/error transitions**\n\nReview 401/403 signed-URL refresh, incompatible resource fingerprint, 5xx/socket retry ownership, low-disk/no-space, complete-file verification, and stale callbacks after terminal/delete tombstones.",
                  "- [x] **Step 2: Audit integrity/error transitions**\n\nReview 401/403 signed-URL refresh, incompatible resource fingerprint, 5xx/socket retry ownership, low-disk/no-space, complete-file verification, and stale callbacks after terminal/delete tombstones.\n\n**Evidence:** run `35058906039` passed the integrity/error transition audit, including signed-source/resource compatibility, plugin-vs-legacy retry ownership, real ENOSPC/no-space handling, completion verification, stale-terminal/delete callback fencing, and focused analyzer coverage.",
              ),
              (
                  "- [ ] **Step 3: Audit queue/session presentation**\n\nVerify episode-level concurrency, one parent slot regardless of chunk count, progress/speed/ETA monotonicity, continued-processing overlay truthfulness, and no stale active UI after pause/cancel.",
                  "- [x] **Step 3: Audit queue/session presentation**\n\nVerify episode-level concurrency, one parent slot regardless of chunk count, progress/speed/ETA monotonicity, continued-processing overlay truthfulness, and no stale active UI after pause/cancel.\n\n**Evidence:** run `35059394783` passed episode queue/parent-slot authority, plugin telemetry and stale/phantom UI fencing, continued-processing overlay/control truthfulness, pause/cancel presentation coverage, and analyzer.",
              ),
              (
                  "- [ ] **Step 4: Run focused suites, full Flutter CI, native checks, and supported-platform builds**\n\nExpected: zero failures on the final head; no temporary patch workflow/script remains.",
                  "- [x] **Step 4: Run focused suites, full Flutter CI, native checks, and supported-platform builds**\n\nExpected: zero failures on the final head; no temporary patch workflow/script remains.\n\n**Evidence:** final automated gate run `35060817204` on commit `452592e22a7c1061f52a93335256055a431a864b` passed full Flutter generation/analyzer/tests, native Swift typecheck, Android debug APK, iOS release/no-codesign, and Windows release. The preceding gate exposed only a stale source-test anchor after `_resumeDownloadTask` gained `executionToken`; commit `452592e` stabilized that guard without production changes. Task 24 diagnostic workflows are removed immediately after recording this evidence, followed by a clean-head PR CI verification.",
              ),
          ]

          changed = False
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
                  changed = True
              elif new not in text:
                  raise SystemExit(f'Expected Task 24 plan block not found: {old.splitlines()[0]}')

          if changed:
              path.write_text(text)
          PYCODE

          if git diff --quiet -- docs/superpowers/plans/2026-09-15-background-downloader-authority.md; then
            echo "Task 24 evidence already recorded"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/plans/2026-09-15-background-downloader-authority.md
          git commit -m "docs(downloads): record Task 24 automated audit"
          git push origin HEAD:refactor/background-downloader-authority
