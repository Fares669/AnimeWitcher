name: Task 24 Presentation Authority RED

on:
  push:
    branches:
      - refactor/background-downloader-authority

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/background-downloader-authority
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - run: flutter pub get
      - run: flutter test test/core/services/download_plugin_parallel_presentation_authority_test.dart
