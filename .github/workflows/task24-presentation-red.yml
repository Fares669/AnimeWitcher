name: Task 24 Command Transition Audit

on:
  push:
    branches:
      - refactor/background-downloader-authority

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/background-downloader-authority
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Verify Task 24 command and lifecycle matrix
        run: |
          flutter test \
            test/core/services/download_start_outcome_guard_test.dart \
            test/core/services/download_replica_start_journal_guard_test.dart \
            test/core/services/download_lifecycle_checkpoint_guard_test.dart \
            test/core/services/download_repeated_pause_guard_test.dart \
            test/core/services/download_pause_settlement_guard_test.dart \
            test/core/services/download_replica_pause_ordering_test.dart \
            test/core/services/download_repeated_resume_guard_test.dart \
            test/core/services/download_resume_generation_guard_test.dart \
            test/core/services/download_plugin_resume_authority_test.dart \
            test/core/services/download_control_outcome_guard_test.dart \
            test/core/services/download_command_outcome_test.dart \
            test/core/services/download_cancel_checkpoint_guard_test.dart \
            test/core/services/download_cancel_ownership_guard_test.dart \
            test/core/services/download_delete_tombstone_guard_test.dart \
            test/core/services/download_plugin_parallel_cancel_routing_test.dart \
            test/core/services/ios_continued_processing_expiration_test.dart \
            test/core/services/download_network_state_red_test.dart \
            test/core/services/download_plugin_relaunch_single_writer_test.dart \
            test/core/services/download_relaunch_chaos_test.dart \
            test/core/services/download_manager_chaos_matrix_test.dart \
            test/core/services/download_runtime_stability_review_test.dart
      - name: Verify lifecycle authority analyzer
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos \
            lib/core/services/download_service.dart \
            lib/core/services/background_downloader_transport.dart \
            lib/core/services/download_job_store.dart
