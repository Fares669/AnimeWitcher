name: Task 24 Integrity Transition Audit

on:
  push:
    branches:
      - refactor/background-downloader-authority

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/background-downloader-authority
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Verify signed URL, identity, retry, completion, and stale callback matrix
        run: |
          flutter test \
            test/core/services/download_plugin_source_refresh_routing_test.dart \
            test/core/services/download_plugin_source_refresh_test.dart \
            test/core/services/download_source_refresh_capability_test.dart \
            test/core/services/download_source_refresh_checkpoint_guard_test.dart \
            test/core/services/download_source_refresh_integrity_test.dart \
            test/core/services/download_source_refresh_service_wiring_test.dart \
            test/core/services/download_url_refresh_generation_test.dart \
            test/core/services/download_url_refresh_test.dart \
            test/core/services/download_refresh_descriptor_ownership_guard_test.dart \
            test/core/services/download_resource_identity_guard_test.dart \
            test/core/services/download_resource_identity_service_guard_test.dart \
            test/core/services/download_resource_identity_test.dart \
            test/core/services/persistent_parallel_download_range_identity_test.dart \
            test/core/services/download_retry_policy_test.dart \
            test/core/services/download_range_fast_fail_policy_test.dart \
            test/core/services/download_runtime_ownership_test.dart \
            test/core/services/download_parallel_complete_artifact_guard_test.dart \
            test/core/services/download_zero_restart_invariant_test.dart \
            test/core/services/download_durable_byte_contract_guard_test.dart \
            test/core/services/download_durable_byte_provenance_guard_test.dart \
            test/core/services/download_expected_size_authority_test.dart \
            test/core/services/download_callback_generation_test.dart \
            test/core/services/download_delete_tombstone_guard_test.dart \
            test/core/services/download_cancel_checkpoint_guard_test.dart \
            test/core/services/download_canceled_parallel_artifact_gc_guard_test.dart \
            test/core/services/download_job_store_attempt_test.dart \
            test/core/services/download_manager_chaos_matrix_test.dart
      - name: Create bounded filesystem for deterministic ENOSPC
        run: |
          sudo mkdir -p /mnt/animewitcher-dm27
          sudo mount -t tmpfs -o size=8M tmpfs /mnt/animewitcher-dm27
          sudo chmod 777 /mnt/animewitcher-dm27
      - name: Verify real ENOSPC preserves verified parts and resumes
        env:
          DM27_TEST_ROOT: /mnt/animewitcher-dm27
        run: flutter test test/core/services/persistent_parallel_download_storage_headroom_test.dart
      - name: Verify integrity authority analyzer
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos \
            lib/core/services/download_service.dart \
            lib/core/services/download_retry_policy.dart \
            lib/core/services/download_range_transfer.dart \
            lib/core/services/download_resource_identity.dart \
            lib/core/services/download_url_refresh.dart \
            lib/core/services/download_job_store.dart \
            lib/core/services/persistent_parallel_download.dart
      - name: Unmount bounded filesystem
        if: always()
        run: sudo umount /mnt/animewitcher-dm27 || true
