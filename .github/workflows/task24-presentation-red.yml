name: Task 24 Repeated Resume GREEN

on:
  push:
    branches:
      - refactor/background-downloader-authority

permissions:
  contents: write

jobs:
  green:
    if: "${{ github.event.head_commit.message == 'chore(ci): apply repeated resume fix' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/background-downloader-authority
      - name: Make repeated resume idempotent for owned writers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/core/services/download_service.dart')
          text = path.read_text()
          old = "\n".join([
              '  Future<void> _resumeUserPausedUnlocked(String taskId) async {',
              '    await _reconcileTransferOwnership();',
              '    DownloadTask? downloadTask = await _liveNativeTaskFor(taskId: taskId);',
          ])
          new = "\n".join([
              '  Future<void> _resumeUserPausedUnlocked(String taskId) async {',
              '    await _reconcileTransferOwnership();',
              '    final resumePreflightJob = await _jobStore.get(taskId);',
              '    if (resumePreflightJob != null &&',
              '        !downloadJobHasUserPauseIntent(resumePreflightJob.state)) {',
              '      final resumePreflightOwnership = await _runtimeOwnershipFor(taskId);',
              '      if (resumePreflightOwnership == DownloadRuntimeOwnership.owned) {',
              "        diagnosticLog.record('resume.idempotentAttached', {",
              "          'taskId': taskId,",
              "          'state': resumePreflightJob.state.name,",
              '        });',
              '        return;',
              '      }',
              '    }',
              '    DownloadTask? downloadTask = await _liveNativeTaskFor(taskId: taskId);',
          ])
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one resume preflight insertion point, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Verify repeated resume regressions
        run: |
          flutter test \
            test/core/services/download_repeated_resume_guard_test.dart \
            test/core/services/download_resume_generation_guard_test.dart \
            test/core/services/download_plugin_resume_authority_test.dart \
            test/core/services/download_control_outcome_guard_test.dart \
            test/core/services/download_command_outcome_test.dart \
            test/core/services/download_callback_generation_test.dart \
            test/core/services/download_lifecycle_checkpoint_guard_test.dart \
            test/core/services/download_pause_settlement_guard_test.dart \
            test/core/services/download_url_refresh_generation_test.dart
      - name: Verify service analyzer
        run: flutter analyze --no-fatal-warnings --no-fatal-infos lib/core/services/download_service.dart
      - name: Commit verified fix
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/services/download_service.dart
          git commit -m "fix(downloads): make repeated resume idempotent"
          git push origin HEAD:refactor/background-downloader-authority
