name: Record Task 24 Command Audit

on:
  push:
    branches:
      - refactor/background-downloader-authority

permissions:
  contents: write

jobs:
  record:
    if: "${{ github.event.head_commit.message == 'chore(ci): record task 24 command audit' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/background-downloader-authority
      - name: Mark Task 24 Step 1 verified
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/superpowers/plans/2026-09-15-background-downloader-authority.md')
          text = path.read_text()
          old = "\n".join([
              '- [ ] **Step 1: Audit command/state transitions**',
              '',
              'Review start, pause, repeated pause, resume, repeated resume, cancel, delete, app-background/system-expiration, network loss/reconnect, and process relaunch for plugin single, plugin parallel, and legacy fallback.',
          ])
          new = "\n".join([
              '- [x] **Step 1: Audit command/state transitions**',
              '',
              'Review start, pause, repeated pause, resume, repeated resume, cancel, delete, app-background/system-expiration, network loss/reconnect, and process relaunch for plugin single, plugin parallel, and legacy fallback.',
              '',
              '**Evidence:** Task 24 command-transition audit run `35058451065` passed the focused lifecycle matrix and analyzer after RED→GREEN fixes for Transfer update bridging, system-pause settlement, parked failure/start/resume checkpoint ordering, single resume generation reuse, and repeated pause/resume idempotence. Production evidence includes `00205a9`, `fd29c93`, `cbc21d4`, `4984114`, `32b8af3`, `e73fce6`, and `f480a1e`.',
          ])
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one Task 24 Step 1 block, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit audit evidence
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/plans/2026-09-15-background-downloader-authority.md
          git commit -m "docs(downloads): record task 24 command audit"
          git push origin HEAD:refactor/background-downloader-authority
