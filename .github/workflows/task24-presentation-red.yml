name: Task 24 Failed Resume GREEN

on:
  push:
    branches:
      - refactor/background-downloader-authority

permissions:
  contents: write

jobs:
  green:
    if: "${{ github.event.head_commit.message == 'chore(ci): apply failed resume fix' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/background-downloader-authority
      - name: Patch failed resume checkpoint ordering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/core/services/download_service.dart')
          text = path.read_text()
          old = "\n".join([
              "        if (!started) {",
              "          final saved = await _savedProgressFor(downloadTask);",
              "          await _checkpointLogicalJob(",
              "            downloadTask,",
              "            state: DownloadJobState.interrupted,",
              "            durableBytes: saved.partialBytes,",
              "            durableByteProvenance: DownloadDurableByteProvenance.exactDisk,",
              "            expectedBytes: saved.totalSize,",
              "            userPaused: false,",
              "            queueWaiting: false,",
              "          );",
              "          await FileDownloader().database.updateRecord(",
          ])
          new = "\n".join([
              "        if (!started) {",
              "          final saved = await _savedProgressFor(downloadTask);",
              "          final resumeFailureCheckpointed = await _checkpointLogicalJob(",
              "            downloadTask,",
              "            state: DownloadJobState.interrupted,",
              "            durableBytes: saved.partialBytes,",
              "            durableByteProvenance: DownloadDurableByteProvenance.exactDisk,",
              "            expectedBytes: saved.totalSize,",
              "            userPaused: false,",
              "            queueWaiting: false,",
              "          );",
              "          if (!resumeFailureCheckpointed) {",
              "            diagnosticLog.record('resume.failureCheckpointFailed', {",
              "              'taskId': taskId,",
              "            });",
              "            return;",
              "          }",
              "          await FileDownloader().database.updateRecord(",
          ])
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one failed-resume block, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Verify focused resume lifecycle regressions
        run: |
          flutter test \
            test/core/services/download_lifecycle_checkpoint_guard_test.dart \
            test/core/services/download_plugin_resume_authority_test.dart \
            test/core/services/download_command_outcome_test.dart \
            test/core/services/download_callback_generation_test.dart \
            test/core/services/download_pause_settlement_guard_test.dart
      - name: Verify service analyzer
        run: flutter analyze --no-fatal-warnings --no-fatal-infos lib/core/services/download_service.dart
      - name: Commit verified fix
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/services/download_service.dart
          git commit -m "fix(downloads): persist failed resume state first"
          git push origin HEAD:refactor/background-downloader-authority
