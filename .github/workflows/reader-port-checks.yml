name: Reader Port Checks

on:
  push:
    branches:
      - feat/manga-manhwa
    paths:
      - 'lib/features/manga/reader/**'
      - 'test/features/manga/reader/**'
      - '.github/workflows/reader-port-checks.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: reader-port-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup-stale-runs:
    name: Cancel stale reader runs
    runs-on: windows-latest
    steps:
      - name: Cancel obsolete Reader Port Checks runs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $workflow = 'reader-port-checks.yml'
          foreach ($status in @('in_progress', 'queued')) {
            $response = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=$env:GITHUB_REF_NAME&status=$status&per_page=100" | ConvertFrom-Json
            foreach ($run in $response.workflow_runs) {
              if ("$($run.id)" -eq "$env:GITHUB_RUN_ID") {
                continue
              }
              Write-Host "Cancelling stale reader run $($run.id) ($status)"
              gh api --method POST "repos/$env:GITHUB_REPOSITORY/actions/runs/$($run.id)/cancel" | Out-Null
            }
          }

  reader:
    needs: cleanup-stale-runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Reader subsampling parity tests
        run: flutter test test/features/manga/reader/manga_reader_subsampling_paths_test.dart -r expanded
      - name: Reader tests
        run: flutter test test/features/manga/reader --concurrency=1 -r expanded
      - name: Reader analyze
        run: flutter analyze lib/features/manga/reader test/features/manga/reader
