name: mpv Apple Runtime

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mpv-runtime-apple.yml'
      - 'scripts/mpv_runtime/**'
      - 'scripts/prepare_media_kit_ios_headers.sh'
      - 'third_party/mpv/**'
      - 'ios/Podfile'
      - 'macos/Podfile'
      - 'MPV_UPGRADE_PLAN.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mpv-apple-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  MPV_COMMIT: 41f6a645068483470267271e1d09966ca3b9f413
  FFMPEG_COMMIT: d60c1d72c1299e683c1d2f86cb4332b4d88348a5
  BUILDER_COMMIT: b4e3ce98826cd4a28f6121b29f56ea203346e6e3

jobs:
  build-runtime:
    name: Build mpv 0.41 ${{ matrix.platform }} runtime
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, macos]

    steps:
      - name: Checkout AnimeWitcher
        uses: actions/checkout@v6

      - name: Checkout pinned media_kit Darwin builder
        uses: actions/checkout@v6
        with:
          repository: media-kit/libmpv-darwin-build
          ref: ${{ env.BUILDER_COMMIT }}
          path: _build/darwin-builder
          fetch-depth: 1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            sandbox = true
            sandbox-fallback = false

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          use-flakehub: false

      - name: Hash exact upstream source archives
        id: sources
        run: |
          set -euxo pipefail
          curl --fail --location --retry 4 \
            "https://github.com/mpv-player/mpv/archive/${MPV_COMMIT}.tar.gz" \
            --output "$RUNNER_TEMP/mpv.tar.gz"
          curl --fail --location --retry 4 \
            "https://github.com/FFmpeg/FFmpeg/archive/${FFMPEG_COMMIT}.tar.gz" \
            --output "$RUNNER_TEMP/ffmpeg.tar.gz"
          echo "mpv_sha256=$(shasum -a 256 "$RUNNER_TEMP/mpv.tar.gz" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "ffmpeg_sha256=$(shasum -a 256 "$RUNNER_TEMP/ffmpeg.tar.gz" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Prepare pinned Darwin builder
        run: |
          set -euxo pipefail
          python3 scripts/mpv_runtime/prepare_darwin_builder.py \
            --builder _build/darwin-builder \
            --lock third_party/mpv/darwin-runtime.lock.json \
            --mpv-sha256 '${{ steps.sources.outputs.mpv_sha256 }}' \
            --ffmpeg-sha256 '${{ steps.sources.outputs.ffmpeg_sha256 }}'
          grep -F "$MPV_COMMIT" _build/darwin-builder/packages.lock.nix
          grep -F "$FFMPEG_COMMIT" _build/darwin-builder/packages.lock.nix

      - name: Select Xcode
        id: xcode
        run: |
          set -euxo pipefail
          XCODE_PATH="$(realpath /Applications/Xcode_16.1.0.app)"
          "$XCODE_PATH/Contents/Developer/usr/bin/xcodebuild" -version
          echo "path=$XCODE_PATH" >> "$GITHUB_OUTPUT"

      - name: Build exact mpv 0.41 XCFramework set
        working-directory: _build/darwin-builder
        env:
          XCODE_PATH: ${{ steps.xcode.outputs.path }}
          TARGET: mk-out-archive-xcframeworks-${{ matrix.platform }}-universal-video-default
        run: |
          set -euxo pipefail
          BUILD_LOG="$RUNNER_TEMP/mpv-apple-${{ matrix.platform }}-build.log"
          set +e
          nix develop -c make \
            XCODE_PATH="$XCODE_PATH" \
            VERSION=v0.41.0-animewitcher \
            TARGET="$TARGET" 2>&1 | tee "$BUILD_LOG"
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Upload Apple build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mpv-v0.41.0-apple-${{ matrix.platform }}-build-log
          path: ${{ runner.temp }}/mpv-apple-${{ matrix.platform }}-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify mpv artifact exists
        working-directory: _build/darwin-builder
        run: |
          set -euxo pipefail
          runtime_archive="$(find -L result -maxdepth 1 -type f -name 'libmpv-xcframeworks_*.tar.gz' -print -quit)"
          mpv_zip="$(find -L result -maxdepth 1 -type f -name '*_Mpv.zip' -print -quit)"
          test -n "$runtime_archive"
          test -n "$mpv_zip"
          python3 "$GITHUB_WORKSPACE/scripts/mpv_runtime/verify_apple_archive.py" \
            --platform '${{ matrix.platform }}' \
            --archive "$runtime_archive"
          mkdir -p "$RUNNER_TEMP/mpv-apple-${{ matrix.platform }}"
          cp "$runtime_archive" "$RUNNER_TEMP/mpv-apple-${{ matrix.platform }}/"
          cp "$mpv_zip" "$RUNNER_TEMP/mpv-apple-${{ matrix.platform }}/"
          cp "$GITHUB_WORKSPACE/third_party/mpv/v0.41.0/client.h" "$RUNNER_TEMP/mpv-apple-${{ matrix.platform }}/client.h"
          shasum -a 256 "$runtime_archive" | tee "$RUNNER_TEMP/mpv-apple-${{ matrix.platform }}/runtime.tar.gz.sha256"
          shasum -a 256 "$mpv_zip" | tee "$RUNNER_TEMP/mpv-apple-${{ matrix.platform }}/Mpv.zip.sha256"
          printf '%s\n' \
            "mpv=v0.41.0" \
            "mpv_commit=$MPV_COMMIT" \
            "ffmpeg_commit=$FFMPEG_COMMIT" \
            "builder_commit=$BUILDER_COMMIT" \
            "platform=${{ matrix.platform }}" \
            "gpl=false" > "$RUNNER_TEMP/mpv-apple-${{ matrix.platform }}/provenance.txt"

      - name: Upload verified candidate
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: mpv-v0.41.0-apple-${{ matrix.platform }}
          path: ${{ runner.temp }}/mpv-apple-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7

  verify-app-integration:
    name: Verify app with mpv 0.41 ${{ matrix.platform }}
    needs: build-runtime
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, macos]
    steps:
      - name: Checkout AnimeWitcher
        uses: actions/checkout@v6

      - name: Select Latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Resolve Flutter dependencies
        run: |
          if [[ '${{ matrix.platform }}' == macos ]]; then
            flutter config --enable-macos-desktop
          fi
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Prepare pinned runtime and matching headers
        run: |
          bash scripts/mpv_runtime/prepare_apple_runtime.sh '${{ matrix.platform }}'
          bash scripts/prepare_media_kit_ios_headers.sh '${{ matrix.platform }}'
          bash scripts/mpv_runtime/verify_apple_runtime.sh '${{ matrix.platform }}'

      - name: Build unsigned iOS application
        if: matrix.platform == 'ios'
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Build unsigned macOS application
        if: matrix.platform == 'macos'
        run: |
          flutter build macos --release \
            --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Verify extracted runtime after CocoaPods
        run: bash scripts/mpv_runtime/verify_apple_runtime.sh '${{ matrix.platform }}' --require-extracted

      - name: Re-run Anime4K patch regressions
        run: |
          ruby scripts/test_anime4k_media_kit_patch.rb
          ruby scripts/test_anime4k_mpv_pacing_patch.rb

  publish-runtime:
    name: Publish verified Apple runtime candidates
    needs: [build-runtime, verify-app-integration]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/mpv-0.41-upgrade' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified candidates
        uses: actions/download-artifact@v8
        with:
          pattern: mpv-v0.41.0-apple-*
          path: candidates

      - name: Publish immutable prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euxo pipefail
          tag="mpv-v0.41.0-animewitcher-${HEAD_SHA:0:12}"
          mapfile -t assets < <(find candidates -type f -name 'libmpv-xcframeworks_*.tar.gz' | sort)
          test "${#assets[@]}" -eq 2
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$HEAD_SHA" \
              --prerelease \
              --title "mpv v0.41.0 Apple runtime ${HEAD_SHA:0:12}" \
              --notes "Verified AnimeWitcher Apple mpv v0.41.0 runtime candidate. Exact source pins are recorded in third_party/mpv/darwin-runtime.lock.json."
          fi
          gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,url
