name: iOS Preview V2 Device Fix One Shot

on:
  push:
    branches:
      - feat/download-manager-v2
    paths:
      - .github/workflows/ios-preview-v2-device-fix-once.yml

permissions:
  contents: read

jobs:
  ios-preview:
    name: iOS Preview (Unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Select Latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install Dependencies
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Generate dart-defines file
        shell: bash
        run: |
          cat > dart-defines.json << 'JSON_EOF'
          {
            "MAL_CLIENT_ID": "${{ secrets.MAL_CLIENT_ID }}",
            "MAL_CLIENT_SECRET": "${{ secrets.MAL_CLIENT_SECRET }}",
            "ANILIST_CLIENT_ID": "${{ secrets.ANILIST_CLIENT_ID }}",
            "ANIMEWITCHER_FIREBASE_PROJECT_ID": "${{ secrets.ANIMEWITCHER_FIREBASE_PROJECT_ID }}",
            "ANIMEWITCHER_FIREBASE_API_KEY": "${{ secrets.ANIMEWITCHER_FIREBASE_API_KEY }}",
            "ANIMEWITCHER_GOOGLE_SERVER_CLIENT_ID": "${{ secrets.ANIMEWITCHER_GOOGLE_SERVER_CLIENT_ID }}",
            "ANIMEWITCHER_GOOGLE_IOS_CLIENT_ID": "${{ secrets.ANIMEWITCHER_GOOGLE_IOS_CLIENT_ID || '296971789988-0ksnaln8k2epsuejesllrr497jnd5if5.apps.googleusercontent.com' }}"
          }
          JSON_EOF

      - name: Configure Google Sign-In for iOS
        env:
          ANIMEWITCHER_GOOGLE_IOS_CLIENT_ID: ${{ secrets.ANIMEWITCHER_GOOGLE_IOS_CLIENT_ID || '296971789988-0ksnaln8k2epsuejesllrr497jnd5if5.apps.googleusercontent.com' }}
          ANIMEWITCHER_GOOGLE_SERVER_CLIENT_ID: ${{ secrets.ANIMEWITCHER_GOOGLE_SERVER_CLIENT_ID }}
        run: bash scripts/configure_ios_google_sign_in.sh

      - name: Build iOS Preview IPA
        run: |
          flutter build ios --release --no-codesign --dart-define-from-file=dart-defines.json
          rm -rf Payload
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry animewitcher-ios-v2-device-fix-preview.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-download-manager-v2-device-fix
          path: animewitcher-ios-v2-device-fix-preview.ipa
          retention-days: 7
