name: Record Background Downloader Evidence

on:
  push:
    branches:
      - refactor/background-downloader-authority
    paths:
      - '.github/record_background_downloader_evidence.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/background-downloader-authority
          fetch-depth: 0
      - name: Apply guarded plan evidence patch
        run: python3 .github/record_background_downloader_evidence.py
      - name: Remove one-shot patch files
        run: |
          rm .github/record_background_downloader_evidence.py
          rm .github/workflows/record-background-downloader-evidence.yml
      - name: Commit verified evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --exit-code -- . ':(exclude)docs/superpowers/plans/2026-09-15-background-downloader-authority.md' && {
            echo 'Expected plan update plus one-shot file removals';
            exit 1;
          } || true
          git commit -m 'docs(downloads): record verified migration evidence'
          git push origin HEAD:refactor/background-downloader-authority
