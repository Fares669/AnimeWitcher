name: Agent Core Download State Verifier

on:
  push:
    branches: [agent/core-state-recovery-20260911]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-core-state-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dm04-baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Run DM-04 recovery inventory regressions
        run: >-
          flutter test
          test/core/services/download_recovery_inventory_test.dart
          test/core/services/download_durable_only_recovery_test.dart
          test/core/services/download_missing_presentation_recovery_test.dart
          test/core/services/download_startup_reconciliation_matrix_test.dart
          test/core/services/download_manifest_startup_inventory_test.dart
          test/core/services/download_recovery_fault_injection_test.dart
          --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
