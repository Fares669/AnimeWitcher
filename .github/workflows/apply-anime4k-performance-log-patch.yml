name: Apply Anime4K performance log patch

on:
  push:
    branches:
      - feat/anime4k-ios-performance
    paths:
      - scripts/apply_anime4k_performance_log_patch.py
      - .github/workflows/apply-anime4k-performance-log-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/anime4k-ios-performance
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python3 scripts/apply_anime4k_performance_log_patch.py
      - name: Verify patch shape
        run: |
          git diff --check
          test -f lib/features/player/data/anime4k_performance_log.dart
          grep -q 'recordSnapshot' lib/features/player/presentation/player_controller.dart
          grep -q 'showAnime4kPerformanceLogDialog' lib/features/settings/presentation/widgets/anime4k_dialog.dart
      - name: Commit production patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/player/data/anime4k_performance_log.dart \
            lib/features/player/presentation/player_controller.dart \
            lib/features/settings/presentation/widgets/anime4k_dialog.dart \
            test/features/player/anime4k_performance_log_contract_test.dart
          git commit -m 'feat: add in-app Anime4K performance log'
          git push origin HEAD:feat/anime4k-ios-performance
