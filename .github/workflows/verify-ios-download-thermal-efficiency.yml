name: Verify iOS Download Thermal Efficiency

on:
  push:
    branches:
      - fix/ios-background-multipart-throughput

permissions:
  contents: write

concurrency:
  group: verify-ios-download-thermal-efficiency
  cancel-in-progress: true

jobs:
  thermal-regression:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/ios-background-multipart-throughput
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Apply native progress churn fix
        run: python3 .github/scripts/fix-ios-native-progress-churn.py
      - name: Install dependencies
        run: flutter pub get
      - name: Thermal regressions
        run: flutter test test/core/services/download_thermal_efficiency_test.dart
      - name: Diff check
        run: git diff --check
      - name: Commit verified native progress fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ios/Runner/DownloadNativeWaitingQueue.swift
          if ! git diff --cached --quiet; then
            git commit -m 'fix(downloads): coalesce native multipart progress churn'
            git push origin HEAD:fix/ios-background-multipart-throughput
          fi
