name: Full Test Diagnostic

on:
  push:
    branches:
      - refactor/background-downloader-authority

permissions:
  contents: write

concurrency:
  group: full-test-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-stale-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Update stale source-contract assertions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = [
              (
                  Path('test/core/services/download_runtime_stability_review_test.dart'),
                  "'if !DownloadNativeWaitingQueue.acceptsDartOverlayUpdates()'",
                  "'if !forcePresentation && !DownloadNativeWaitingQueue.acceptsDartOverlayUpdates()'",
              ),
              (
                  Path('test/core/services/background_downloader_transfer_update_bridge_test.dart'),
                  "'_nativeUpdatesSubscription = _nativeTransport.updates.listen(_sharedEvents.add);'",
                  "'_nativeUpdatesSubscription = _nativeTransport.updates.listen('",
              ),
          ]

          for path, old, new in replacements:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one stale contract, found {count}')
              path.write_text(text.replace(old, new, 1))
          PY
          dart format \
            test/core/services/download_runtime_stability_review_test.dart \
            test/core/services/background_downloader_transfer_update_bridge_test.dart
          git diff --check

      - name: Verify repaired contracts
        run: |
          flutter test \
            test/core/services/download_runtime_stability_review_test.dart \
            test/core/services/background_downloader_transfer_update_bridge_test.dart \
            --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Commit verified repair and remove diagnostic workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/full-test-diagnostic.yml
          git add \
            test/core/services/download_runtime_stability_review_test.dart \
            test/core/services/background_downloader_transfer_update_bridge_test.dart
          git diff --cached --check
          git commit -m "test(downloads): align source contracts with authoritative handoff"
          git push origin HEAD:refactor/background-downloader-authority
