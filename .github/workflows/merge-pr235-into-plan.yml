name: Merge PR235 Into Download Plan

on:
  push:
    branches:
      - plan/download-manager-reliability
    paths:
      - .github/scripts/merge_pr235_into_plan.py
      - .github/workflows/merge-pr235-into-plan.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: merge-pr235-into-download-plan
  cancel-in-progress: true

jobs:
  consolidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          git reset --hard HEAD
      - name: Apply completed PR235 production changes
        run: |
          python3 .github/scripts/merge_pr235_into_plan.py
          dart format lib/core/services/download_service.dart lib/features/library/presentation/downloads_provider.dart
      - name: Run focused lifecycle and identity regressions
        shell: bash
        run: |
          tests=(
            test/core/services/download_job_state_authority_test.dart
            test/core/services/download_job_state_queue_authority_test.dart
            test/core/services/download_logical_identity_test.dart
            test/core/services/download_job_store_test.dart
            test/core/services/download_recovery_inventory_test.dart
            test/core/services/download_startup_reconciliation_matrix_test.dart
            test/core/services/download_runtime_ownership_test.dart
          )
          existing=()
          for f in "${tests[@]}"; do
            if [[ -f "$f" ]]; then existing+=("$f"); fi
          done
          flutter test "${existing[@]}" --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: Run full Flutter test suite
        run: flutter test --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Verify scoped diff
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' lib/core/services/download_service.dart lib/features/library/presentation/downloads_provider.dart | sort)"
          test "$changed" = "$expected"
      - name: Commit consolidated production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/services/download_service.dart lib/features/library/presentation/downloads_provider.dart
          git commit -m "fix(downloads): consolidate core agent state and identity work"
          git pull --rebase origin plan/download-manager-reliability
          git push origin HEAD:plan/download-manager-reliability
