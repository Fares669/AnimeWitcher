name: DM04 Durable-only Helper Fix

on:
  push:
    branches:
      - plan/download-manager-reliability
    paths:
      - .github/workflows/dm04-durable-helper-fix.yml

permissions:
  contents: write

jobs:
  implement-helper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          git reset --hard HEAD
      - name: Implement durable-only recovery disposition helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/core/services/download_job_state.dart')
          text = path.read_text()
          anchor = '''/// Build one deterministic startup inventory from every source that can carry\n'''
          if anchor not in text:
              raise SystemExit('helper insertion anchor not found')
          if 'enum DownloadDurableOnlyRecoveryDisposition' in text:
              raise SystemExit('helper already exists unexpectedly')
          insert = '''enum DownloadDurableOnlyRecoveryDisposition { recover, orphan }\n\n/// A durable JobStore row is safe to revive only when both execution and\n/// presentation identities survived. A task snapshot alone can restart bytes,\n/// but without AnimeWitcher metadata the episode cannot be projected back into\n/// the user-visible downloads inventory.\nDownloadDurableOnlyRecoveryDisposition planDurableOnlyRecoveryDisposition({\n  required bool hasPresentationMetadata,\n  required bool hasRecoverableTaskDescriptor,\n}) {\n  return hasPresentationMetadata && hasRecoverableTaskDescriptor\n      ? DownloadDurableOnlyRecoveryDisposition.recover\n      : DownloadDurableOnlyRecoveryDisposition.orphan;\n}\n\n'''
          path.write_text(text.replace(anchor, insert + anchor, 1))
          PY
          dart format lib/core/services/download_job_state.dart
      - name: Run focused durable-only recovery tests
        run: flutter test test/core/services/download_durable_only_recovery_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Verify scoped diff
        run: |
          git diff --check
          test "$(git diff --name-only)" = "lib/core/services/download_job_state.dart"
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/services/download_job_state.dart
          git commit -m "fix(downloads): classify durable-only recovery evidence"
          git push origin HEAD:plan/download-manager-reliability
