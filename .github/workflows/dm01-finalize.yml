name: Finalize DM-01 plan status

on:
  push:
    branches:
      - plan/download-manager-reliability

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability
      - name: Mark verified item complete
        run: python3 .github/dm01_finalize.py
      - name: Guard plan update
        run: |
          git diff --check
          grep -F -- '- [x] **DM-01' DOWNLOAD_MANAGER_PLAN.md
      - name: Commit plan status and cleanup verifier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dm01-finalize.yml .github/dm01_finalize.py
          git add DOWNLOAD_MANAGER_PLAN.md
          git diff --cached --check
          git commit -m "docs: mark verified DM-01 complete"
          git push origin HEAD:plan/download-manager-reliability
