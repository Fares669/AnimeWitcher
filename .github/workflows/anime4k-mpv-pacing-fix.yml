name: Anime4K Apple mpv pacing fix

on:
  push:
    branches:
      - feat/anime4k-ios-performance
    paths:
      - .github/workflows/anime4k-mpv-pacing-fix.yml

permissions:
  contents: write

jobs:
  red-green:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/anime4k-ios-performance
          fetch-depth: 0

      - name: RED - expose mpv target-time pacing wait
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/test_anime4k_media_kit_patch.rb')
          source = path.read_text()
          needle = "  assert(patched.include?('completion()'), 'TextureHW must complete frame publication only after Metal/bypass')\n"
          if source.count(needle) != 1:
              raise SystemExit('RED insertion marker changed')
          assertion = needle + "  assert(\n    patched.include?('MPV_RENDER_PARAM_BLOCK_FOR_TARGET_TIME') &&\n      patched.include?('anime4kBlockForTargetTime: CInt = 0'),\n    'mpv render must disable target-time blocking'\n  )\n"
          path.write_text(source.replace(needle, assertion, 1))
          PY

          set +e
          ruby scripts/test_anime4k_media_kit_patch.rb > /tmp/anime4k-pacing-red.log 2>&1
          status=$?
          set -e
          cat /tmp/anime4k-pacing-red.log
          test "$status" -ne 0
          grep -q 'mpv render must disable target-time blocking' /tmp/anime4k-pacing-red.log

      - name: GREEN - disable redundant mpv target-time blocking on Apple
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/anime4k_media_kit_patch.rb')
          source = path.read_text()

          helper_anchor = "def patch_anime4k_media_kit_video(plugin_root:, native_dir:, platform:)\n"
          if source.count(helper_anchor) != 1:
              raise SystemExit('patch helper insertion marker changed')

          helper = r'''def anime4k_disable_mpv_target_wait(source)
  marker = 'AnimeWitcherNonBlockingMPVRender'
  return source if source.include?(marker)

  render_call = "    mpv_render_context_render(renderContext, &params)\n"
  unless source.scan(render_call).length == 1
    raise Anime4KMediaKitPatchError,
          'media_kit TextureHW render pacing marker changed'
  end

  nonblocking_render = <<~'SWIFT'.lines.map { |line| "    #{line}" }.join
    // AnimeWitcherNonBlockingMPVRender
    // media_kit does not report swaps back to mpv, so allowing mpv to block
    // for target time only serializes its worker before Anime4K Metal work.
    var anime4kBlockForTargetTime: CInt = 0
    withUnsafeMutablePointer(to: &anime4kBlockForTargetTime) { pointer in
      params.insert(
        mpv_render_param(
          type: MPV_RENDER_PARAM_BLOCK_FOR_TARGET_TIME,
          data: UnsafeMutableRawPointer(pointer)
        ),
        at: params.count - 1
      )
      mpv_render_context_render(renderContext, &params)
    }
  SWIFT

  source.sub(render_call, nonblocking_render)
end

'''
          source = source.replace(helper_anchor, helper + helper_anchor, 1)

          old_early = '''  if marked == markers.length
    anime4k_sync_support_files(plugin_dir: plugin_dir, native_dir: native_dir)
    return
  end
'''
          new_early = '''  if marked == markers.length
    # Upgrade an already-patched media_kit tree from the older Anime4K patch
    # without requiring a Pods clean. The helper is itself idempotent.
    upgraded_texture = anime4k_disable_mpv_target_wait(sources[:texture])
    File.write(files[:texture], upgraded_texture) if upgraded_texture != sources[:texture]
    anime4k_sync_support_files(plugin_dir: plugin_dir, native_dir: native_dir)
    return
  end
'''
          if source.count(old_early) != 1:
              raise SystemExit('existing-patch upgrade marker changed')
          source = source.replace(old_early, new_early, 1)

          fresh = "  texture = sources[:texture].sub(\n"
          replacement = "  texture = anime4k_disable_mpv_target_wait(sources[:texture]).sub(\n"
          if source.count(fresh) != 1:
              raise SystemExit('fresh texture patch marker changed')
          source = source.replace(fresh, replacement, 1)
          path.write_text(source)
          PY

          ruby scripts/test_anime4k_media_kit_patch.rb
          grep -q 'MPV_RENDER_PARAM_BLOCK_FOR_TARGET_TIME' scripts/anime4k_media_kit_patch.rb
          grep -q 'AnimeWitcherNonBlockingMPVRender' scripts/anime4k_media_kit_patch.rb

      - name: Verify Ruby syntax and patch idempotency contract
        run: |
          ruby -c scripts/anime4k_media_kit_patch.rb
          ruby -c scripts/test_anime4k_media_kit_patch.rb
          ruby scripts/test_anime4k_media_kit_patch.rb

      - name: Commit verified pacing fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/anime4k-mpv-pacing-fix.yml
          git add scripts/anime4k_media_kit_patch.rb scripts/test_anime4k_media_kit_patch.rb
          git diff --cached --check
          git commit -m 'perf: remove redundant mpv pacing wait on Apple'
          git push origin HEAD:feat/anime4k-ios-performance