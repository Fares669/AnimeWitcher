name: Guarded DM-19 implementation

on:
  push:
    branches:
      - plan/download-manager-reliability

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Apply guarded patch
        run: python3 .github/dm19_patch.py

      - name: Format
        run: dart format lib/core/services/download_transport.dart lib/core/services/download_service.dart test/core/services/download_runtime_ownership_test.dart

      - name: Install and generate
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Focused DM-19 tests
        run: |
          flutter test test/core/services/download_runtime_ownership_test.dart
          flutter test test/core/services/persistent_parallel_download_pending_start_lease_test.dart
          flutter test test/core/services/persistent_parallel_download_auto_recovery_test.dart
          flutter test test/core/services/persistent_parallel_download_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Guard and commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dm19-guarded-apply.yml .github/dm19_patch.py
          git add DOWNLOAD_MANAGER_PLAN.md lib/core/services/download_transport.dart lib/core/services/download_service.dart test/core/services/download_runtime_ownership_test.dart
          git diff --cached --check
          git commit -m "fix: use runtime ownership evidence for downloads"
          git push origin HEAD:plan/download-manager-reliability
