name: Anime4K controller fix

on:
  push:
    branches:
      - feat/anime4k-ios-performance
    paths:
      - scripts/apply_anime4k_controller_fix.py

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/anime4k-ios-performance
      - run: python3 scripts/apply_anime4k_controller_fix.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/player/presentation/player_controller.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(player): disable stale Anime4K Metal runtime'
          git push origin HEAD:feat/anime4k-ios-performance
