name: Anime4K mobile implementation

on:
  push:
    branches:
      - feat/anime4k-mobile-gpu

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, '[anime4k-impl]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/anime4k-mobile-gpu
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Apply Anime4K mobile GPU implementation
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          def regex_once(path, pattern, replacement):
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{path}: regex expected one match, found {count}')
              p.write_text(updated)

          regex_once(
              'lib/features/player/data/anime4k.dart',
              r'''/// Whether this device can be offered Anime4K at all\..*?bool anime4kAvailableOn\(\{.*?\n\}\n\n/// Whether the feature is on''',
              '''/// Whether this device can be offered Anime4K at all.\n///\n/// Anime4K needs the native media_kit/libmpv renderer because mpv applies the\n/// GLSL chain in its GPU video-output stage. Android, iOS, macOS, Windows and\n/// Linux are eligible; the adaptive video_view backend is not because it has\n/// no mpv GLSL stage.\nbool anime4kAvailableOn({\n  required bool isNativePlatform,\n  required bool usingAdaptiveBackend,\n}) {\n  return isNativePlatform && !usingAdaptiveBackend;\n}\n\n/// Whether mpv's active video output can execute custom GLSL shaders.\n///\n/// mpv documents custom shaders for gpu, gpu-next and libmpv. Keeping this\n/// check separate lets the player reject a fallback/software/no-shader output\n/// instead of accepting the setting while drawing an unchanged picture.\nbool anime4kGpuRendererSupportsShaders(String currentVo) {\n  final vo = currentVo.trim().toLowerCase();\n  return vo == 'gpu' || vo == 'gpu-next' || vo == 'libmpv';\n}\n\n/// Whether the feature is on''',
          )

          replace_once(
              'lib/features/player/presentation/player_controller.dart',
              '''    if (!anime4kAvailableOn(\n      isDesktopPlatform:\n          Platform.isWindows || Platform.isMacOS || Platform.isLinux,\n      usingAdaptiveBackend: state.useExoPlayer,\n    )) {\n      return;\n    }\n''',
              '''    if (!anime4kAvailableOn(\n      isNativePlatform:\n          Platform.isWindows ||\n          Platform.isMacOS ||\n          Platform.isLinux ||\n          Platform.isAndroid ||\n          Platform.isIOS,\n      usingAdaptiveBackend: state.useExoPlayer,\n    )) {\n      return;\n    }\n''',
          )

          replace_once(
              'lib/features/player/presentation/player_controller.dart',
              '''      if (_isDisposed) return;\n      // An empty string is how mpv is told to run no shaders, so this both\n      // applies a mode and turns one off.\n      await platform.setProperty('glsl-shaders', pipeline.value);\n''',
              '''      if (_isDisposed) return;\n      if (!pipeline.isEmpty) {\n        final currentVo = (await platform.getProperty('current-vo')).trim();\n        final gpuDumbMode = (await platform.getProperty('gpu-dumb-mode'))\n            .trim()\n            .toLowerCase();\n        if (!anime4kGpuRendererSupportsShaders(currentVo) ||\n            gpuDumbMode == 'yes') {\n          await platform.setProperty('glsl-shaders', '');\n          _anime4kApplied = '';\n          if (kDebugMode) {\n            debugPrint(\n              'Anime4K: GPU shader stage unavailable '\n              '(vo="$currentVo", gpu-dumb-mode="$gpuDumbMode")',\n            );\n          }\n          return;\n        }\n      }\n      // An empty string is how mpv is told to run no shaders, so this both\n      // applies a mode and turns one off.\n      await platform.setProperty('glsl-shaders', pipeline.value);\n''',
          )

          replace_once(
              'lib/features/settings/presentation/settings_screen.dart',
              '''          // Desktop only. Offering it on a phone would be offering a\n          // setting that cannot run there — see anime4kAvailableOn.\n          if (Platform.isWindows || Platform.isMacOS || Platform.isLinux)\n''',
              '''          // Native media_kit/libmpv platforms can run Anime4K through\n          // mpv's GPU shader stage. The adaptive backend is rejected at playback.\n          if (Platform.isWindows ||\n              Platform.isMacOS ||\n              Platform.isLinux ||\n              Platform.isAndroid ||\n              Platform.isIOS)\n''',
          )

          replace_once(
              'lib/features/player/presentation/widgets/animewitcher_player_controls.dart',
              '''      anime4kSupported: anime4kAvailableOn(\n        isDesktopPlatform: isDesktop,\n        usingAdaptiveBackend: ref.watch(\n''',
              '''      anime4kSupported: anime4kAvailableOn(\n        isNativePlatform:\n            isDesktop || Platform.isAndroid || Platform.isIOS,\n        usingAdaptiveBackend: ref.watch(\n''',
          )

          replace_once(
              'lib/features/player/presentation/player_screen.dart',
              '''import '../../../../core/providers/device_info_provider.dart';\nimport '../../../../features/settings/presentation/player_settings_provider.dart';\n''',
              '''import '../../../../core/providers/device_info_provider.dart';\nimport '../../../../core/storage/settings_repository.dart';\nimport '../../../../features/settings/presentation/player_settings_provider.dart';\nimport '../data/anime4k.dart';\n''',
          )

          replace_once(
              'lib/features/player/presentation/player_screen.dart',
              '''    _videoController = VideoController(_player);\n''',
              '''    // Anime4K is a GPU render-stage effect. Make the shader-capable mpv\n    // output explicit whenever the feature is enabled so Android cannot fall\n    // back to a direct decoder surface that bypasses GLSL. Read the persisted\n    // setting synchronously: PlayerSettings is async and can still be loading\n    // during a cold-start player launch.\n    final settingsStorage = ref.read(settingsRepositoryProvider);\n    final storedAnime4kMode = Anime4kModeName.fromName(\n      settingsStorage.getPlayerSetting<String>(\n        'player_anime4k_mode',\n        defaultValue: Anime4kMode.off.name,\n      ),\n    );\n    final storedAnime4kEnabled = anime4kEnabledFrom(\n      stored: settingsStorage.getPlayerSetting<bool>('player_anime4k_enabled'),\n      mode: storedAnime4kMode,\n    );\n    final forceAnime4kGpuPath =\n        storedAnime4kEnabled &&\n        (Platform.isWindows ||\n            Platform.isMacOS ||\n            Platform.isLinux ||\n            Platform.isAndroid ||\n            Platform.isIOS);\n    _videoController = VideoController(\n      _player,\n      configuration: VideoControllerConfiguration(\n        vo: forceAnime4kGpuPath\n            ? (Platform.isAndroid ? 'gpu' : 'libmpv')\n            : null,\n        // auto-safe keeps Android hardware decoding where mpv can interop it\n        // safely while still routing the final image through vo=gpu.\n        hwdec: forceAnime4kGpuPath && Platform.isAndroid ? 'auto-safe' : null,\n      ),\n    );\n''',
          )

          replace_once(
              'lib/features/player/presentation/widgets/anime4k_sample_preview.dart',
              '''  Future<void> _applyShaders() async {\n    final player = _player;\n    if (player == null) return;\n    final platform = player.platform;\n    if (platform is! NativePlayer) return;\n    try {\n      final pipeline = await const Anime4kShaderLibrary().pipeline(\n        mode: widget.mode,\n        quality: widget.quality,\n        directory: widget.shaderDirectory,\n      );\n      await platform.setProperty('glsl-shaders', pipeline.value);\n    } catch (_) {\n      // A shader that will not load leaves the sample as it is, which is\n      // still a truthful picture of what that mode is doing here.\n    }\n  }\n''',
              '''  Future<void> _applyShaders() async {\n    final player = _player;\n    if (player == null) return;\n    final platform = player.platform;\n    if (platform is! NativePlayer) {\n      if (mounted) {\n        setState(() => _error = 'Anime4K requires the native mpv player.');\n      }\n      return;\n    }\n    try {\n      final pipeline = await const Anime4kShaderLibrary().pipeline(\n        mode: widget.mode,\n        quality: widget.quality,\n        directory: widget.shaderDirectory,\n      );\n      if (!pipeline.isEmpty) {\n        final currentVo = (await platform.getProperty('current-vo')).trim();\n        final gpuDumbMode = (await platform.getProperty('gpu-dumb-mode'))\n            .trim()\n            .toLowerCase();\n        if (!anime4kGpuRendererSupportsShaders(currentVo) ||\n            gpuDumbMode == 'yes') {\n          throw StateError(\n            'Anime4K GPU shaders are unavailable on this renderer '\n            '(vo=$currentVo, gpu-dumb-mode=$gpuDumbMode).',\n          );\n        }\n      }\n      await platform.setProperty('glsl-shaders', pipeline.value);\n      final applied = (await platform.getProperty('glsl-shaders')).trim();\n      if (pipeline.value.isNotEmpty && applied.isEmpty) {\n        throw StateError('mpv did not accept the Anime4K shader chain.');\n      }\n      if (mounted && _error != null) setState(() => _error = null);\n    } catch (error) {\n      if (mounted) setState(() => _error = '$error');\n    }\n  }\n''',
          )

          replace_once(
              'lib/features/settings/presentation/widgets/anime4k_dialog.dart',
              '''import 'package:file_picker/file_picker.dart';\n''',
              '''import 'dart:io';\n\nimport 'package:file_picker/file_picker.dart';\n''',
          )
          replace_once(
              'lib/features/settings/presentation/widgets/anime4k_dialog.dart',
              '''                    english:\n                        'Each step up roughly doubles the work the GPU does.',\n                    arabic: 'كل درجة أعلى تضاعف تقريبًا الحِمل على كرت الشاشة.',\n''',
              '''                    english: Platform.isAndroid || Platform.isIOS\n                        ? 'On phones, start with S. Each step up roughly doubles '\n                              'GPU work and can increase heat and battery use.'\n                        : 'Each step up roughly doubles the work the GPU does.',\n                    arabic: Platform.isAndroid || Platform.isIOS\n                        ? 'على الهاتف ابدأ بحجم S. كل درجة أعلى تضاعف تقريبًا '\n                              'عمل الـGPU وقد تزيد الحرارة واستهلاك البطارية.'\n                        : 'كل درجة أعلى تضاعف تقريبًا الحِمل على كرت الشاشة.',\n''',
          )

          p = Path('test/features/player/anime4k_mobile_gpu_test.dart')
          text = p.read_text().replace('isDesktopPlatform: false', 'isNativePlatform: true')
          p.write_text(text)

          p = Path('test/features/player/anime4k_test.dart')
          text = p.read_text()
          text = text.replace('isDesktopPlatform: true', 'isNativePlatform: true')
          old_phone = '''    test('not on a phone, whatever is playing', () {\n      // The shaders are a real load on a GPU, and a phone has neither the\n      // thermal room nor a screen big enough to show what the work bought.\n      for (final adaptive in <bool>[true, false]) {\n        expect(\n          anime4kAvailableOn(\n            isDesktopPlatform: false,\n            usingAdaptiveBackend: adaptive,\n          ),\n          isFalse,\n          reason: 'adaptive backend: $adaptive',\n        );\n      }\n    });\n'''
          new_phone = '''    test('native mobile playback is supported', () {\n      expect(\n        anime4kAvailableOn(\n          isNativePlatform: true,\n          usingAdaptiveBackend: false,\n        ),\n        isTrue,\n      );\n    });\n'''
          if old_phone not in text:
              raise SystemExit('anime4k_test.dart: old mobile availability test not found')
          text = text.replace(old_phone, new_phone, 1)
          text = text.replace(
              'anime4kAvailableOn(isDesktopPlatform: true, usingAdaptiveBackend: true)',
              'anime4kAvailableOn(isNativePlatform: true, usingAdaptiveBackend: true)',
          )
          marker = "  group('where it is offered at all', () {\n"
          gpu_tests = '''  group('GPU video-output validation', () {\n    test('accepts mpv outputs that implement custom shaders', () {\n      for (final vo in <String>['gpu', 'gpu-next', 'libmpv', '  GPU  ']) {\n        expect(\n          anime4kGpuRendererSupportsShaders(vo),\n          isTrue,\n          reason: vo,\n        );\n      }\n    });\n\n    test('rejects outputs without the mpv GLSL render stage', () {\n      for (final vo in <String>['', 'null', 'xv', 'mediacodec_embed']) {\n        expect(\n          anime4kGpuRendererSupportsShaders(vo),\n          isFalse,\n          reason: vo,\n        );\n      }\n    });\n  });\n\n'''
          if marker not in text:
              raise SystemExit('anime4k_test.dart: availability marker not found')
          text = text.replace(marker, gpu_tests + marker, 1)
          p.write_text(text)

          # The source-wiring test asserts the exact Android GPU configuration.
          p = Path('test/features/player/anime4k_mobile_gpu_wiring_test.dart')
          text = p.read_text().replace(
              "vo: forceAnime4kGpuPath ? 'gpu' : null",
              "Platform.isAndroid ? 'gpu' : 'libmpv'",
          )
          p.write_text(text)

      - name: Format changed Dart files
        run: |
          dart format \
            lib/features/player/data/anime4k.dart \
            lib/features/player/presentation/player_controller.dart \
            lib/features/player/presentation/player_screen.dart \
            lib/features/player/presentation/widgets/anime4k_sample_preview.dart \
            lib/features/player/presentation/widgets/animewitcher_player_controls.dart \
            lib/features/settings/presentation/settings_screen.dart \
            lib/features/settings/presentation/widgets/anime4k_dialog.dart \
            test/features/player/anime4k_test.dart \
            test/features/player/anime4k_mobile_gpu_test.dart \
            test/features/player/anime4k_mobile_gpu_wiring_test.dart
          git diff --check

      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test
          git commit -m 'feat(player): enable Anime4K on mobile GPU renderers [anime4k-impl]'
          git push origin HEAD:feat/anime4k-mobile-gpu
