name: Agent DM24 Logical Identity Fix

on:
  push:
    branches:
      - agent/core-download-state-recovery-20260911
    paths:
      - .github/scripts/agent_dm24_overlay_identity_patch.py
      - .github/workflows/agent-dm24-identity-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/core-download-state-recovery-20260911
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          git reset --hard HEAD
      - name: Apply DM24 logical identity fixes
        run: |
          python3 .github/scripts/dm24_start_identity_patch.py
          python3 .github/scripts/agent_dm24_overlay_identity_patch.py
          python3 .github/scripts/dm24_ui_identity_patch.py
          dart format lib/core/services/download_service.dart lib/features/library/presentation/downloads_provider.dart
      - name: Run DM24 and DM05 regressions
        run: >-
          flutter test
          test/core/services/download_logical_identity_test.dart
          test/core/services/download_job_logical_identity_test.dart
          test/core/services/download_logical_identity_persistence_test.dart
          test/core/services/download_logical_identity_start_test.dart
          test/core/services/download_overlay_logical_identity_test.dart
          test/features/library/presentation/downloads_logical_identity_test.dart
          test/core/services/download_job_state_authority_test.dart
          test/core/services/download_job_state_queue_authority_test.dart
          test/features/library/presentation/downloads_job_state_authority_test.dart
          test/core/services/download_concurrency_test.dart
          --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Verify scoped diff
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' lib/core/services/download_service.dart lib/features/library/presentation/downloads_provider.dart | sort)"
          test "$changed" = "$expected"
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/services/download_service.dart lib/features/library/presentation/downloads_provider.dart
          git commit -m "fix(downloads): adopt canonical logical episode identity"
          git pull --rebase origin agent/core-download-state-recovery-20260911
          git push origin HEAD:agent/core-download-state-recovery-20260911
