name: Build and Deploy Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  filter:
    name: Check Changed Files
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    outputs:
      should_run: ${{ steps.changes.outputs.src }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Paths Filter
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            src:
              - 'lib/**'
              - 'packages/**'
              - 'assets/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'android/**'
              - 'ios/**'
              - 'macos/**'
              - 'windows/**'
              - 'linux/**'
              - 'web/**'
              - '.github/workflows/preview.yml'

  build-android-arm64:
    name: Build Android ARM64 Preview
    needs: filter
    if: needs.filter.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          rm -f pubspec.lock
          flutter pub get
          flutter gen-l10n

      - name: Build Android ARM64 APK
        run: |
          flutter build apk --release --target-platform=android-arm64 --split-per-abi

      - name: Upload Android ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-android-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 7
