name: DM03 Diagnostic

on:
  push:
    branches: [plan/download-manager-reliability]
    paths: [.github/workflows/dm03-diagnostic.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Locate command callsites and signatures
        run: |
          echo '=== definitions/calls ==='
          grep -RInE "pauseDownload\(|resumeDownload\(|cancelDownload\(|DownloadCommandOutcome" lib test || true
          echo '=== plan DM-03 context ==='
          grep -n -A60 -B8 "DM-03" DOWNLOAD_MANAGER_PLAN.md || true
