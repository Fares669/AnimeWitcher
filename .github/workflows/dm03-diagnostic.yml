name: DM03 Implementation

on:
  push:
    branches:
      - plan/download-manager-reliability
    paths:
      - .github/workflows/dm03-diagnostic.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true
      - name: Apply patch
        run: python3 .github/scripts/dm03_patch.py
      - name: Format
        run: |
          dart format lib/core/services/download_service.dart
          dart format lib/features/library/presentation/downloads_provider.dart
          dart format lib/features/details/presentation/widgets/download_progress_dialog.dart
          dart format test/core/services/download_control_outcome_guard_test.dart
      - name: Generate
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Focused tests
        run: |
          flutter test test/core/services/download_command_outcome_test.dart test/core/services/download_control_outcome_guard_test.dart
          flutter test test/core/services/download_initialization_barrier_guard_test.dart test/core/services/download_pause_settlement_guard_test.dart test/core/services/download_cancel_checkpoint_guard_test.dart test/core/services/download_lifecycle_checkpoint_guard_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Commit
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/core/services/download_service.dart lib/features/library/presentation/downloads_provider.dart lib/features/details/presentation/widgets/download_progress_dialog.dart test/core/services/download_control_outcome_guard_test.dart DOWNLOAD_MANAGER_PLAN.md
          git commit -m 'refactor(downloads): expose typed control outcomes'
          git push
