name: Apply Anime4K benchmark log segments

on:
  push:
    branches:
      - feat/anime4k-ios-performance
    paths:
      - .github/workflows/apply-anime4k-metalfx-setting.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/anime4k-ios-performance
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Add segment regression tests and confirm RED
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('test/features/player/anime4k_performance_log_contract_test.dart')
          text = path.read_text()
          if "import 'dart:convert';" not in text:
              text = text.replace("import 'dart:io';\n", "import 'dart:convert';\nimport 'dart:io';\n")
          marker = """    test('physical-device diagnosis logs raw color state and samples manual Metal', () {\n"""
          addition = r'''    test('configuration changes create ordered benchmark segments in one file', () async {
      final root = await Directory.systemTemp.createTemp('anime4k-segment-test-');
      addTearDown(() => root.delete(recursive: true));
      var now = DateTime.utc(2026, 9, 13, 7, 0);
      final log = Anime4kPerformanceLog(
        documentsDirectory: () async => root,
        deviceInfo: () async => <String, Object?>{
          'deviceModel': 'iPhone13,4',
          'isPhysicalDevice': true,
        },
        now: () => now,
      );

      Future<void> configuration({required bool enabled, required bool metalFx}) {
        return log.recordConfiguration(
          enabled: enabled,
          mode: Anime4kMode.a,
          requestedQuality: Anime4kQuality.s,
          ecoEnabled: false,
          metalFxExperiment: metalFx,
        );
      }

      const snapshotA = Anime4kPerformanceSnapshot(
        backend: Anime4kBackend.metal,
        requestedMode: Anime4kMode.a,
        requestedQuality: Anime4kQuality.s,
        effectiveQuality: Anime4kQuality.s,
        inputWidth: 1920,
        inputHeight: 1080,
        processingWidth: 1920,
        processingHeight: 1080,
        averageFrameTimeMs: 25.5,
        p95FrameTimeMs: 34.0,
        processedFrames: 120,
        skippedDuplicateFrames: 0,
        droppedOrLateFrames: 0,
        thermalLevel: Anime4kThermalLevel.fair,
        lowPowerMode: false,
      );
      const snapshotB = Anime4kPerformanceSnapshot(
        backend: Anime4kBackend.metal,
        requestedMode: Anime4kMode.a,
        requestedQuality: Anime4kQuality.s,
        effectiveQuality: Anime4kQuality.s,
        inputWidth: 1920,
        inputHeight: 1080,
        processingWidth: 1920,
        processingHeight: 1080,
        averageFrameTimeMs: 18.0,
        p95FrameTimeMs: 23.0,
        processedFrames: 120,
        skippedDuplicateFrames: 0,
        droppedOrLateFrames: 0,
        thermalLevel: Anime4kThermalLevel.nominal,
        lowPowerMode: false,
      );

      await configuration(enabled: true, metalFx: false);
      await configuration(enabled: true, metalFx: false); // identical = no-op
      await log.recordRoute(
        backend: Anime4kBackend.metal,
        mode: Anime4kMode.a,
        requestedQuality: Anime4kQuality.s,
        ecoEnabled: false,
        metalFxExperiment: false,
        reason: 'metal-ready',
      );
      await log.recordSnapshot(snapshotA, metalFxExperiment: false);

      now = now.add(const Duration(seconds: 3));
      await configuration(enabled: true, metalFx: true);
      await log.recordRoute(
        backend: Anime4kBackend.metal,
        mode: Anime4kMode.a,
        requestedQuality: Anime4kQuality.s,
        ecoEnabled: false,
        metalFxExperiment: true,
        reason: 'metal-ready',
      );
      await log.recordSnapshot(snapshotB, metalFxExperiment: true);

      now = now.add(const Duration(seconds: 2));
      await configuration(enabled: false, metalFx: true);

      final file = await log.latestLogFile();
      expect(file, isNotNull);
      final events = (await file!.readAsLines())
          .map((line) => jsonDecode(line) as Map<String, dynamic>)
          .toList();
      final types = events.map((event) => event['type']).toList();
      expect(
        types,
        <Object?>[
          'session',
          'segmentStart',
          'route',
          'snapshot',
          'segmentEnd',
          'segmentStart',
          'route',
          'snapshot',
          'segmentEnd',
          'segmentStart',
        ],
      );

      final firstStart = events[1];
      final firstRoute = events[2];
      final firstSnapshot = events[3];
      final firstEnd = events[4];
      final secondStart = events[5];
      final secondRoute = events[6];
      final secondSnapshot = events[7];
      final secondEnd = events[8];
      final disabledStart = events[9];

      expect(firstStart['segmentId'], 1);
      expect(firstStart['metalFxExperiment'], isFalse);
      expect(firstRoute['segmentId'], 1);
      expect(firstSnapshot['segmentId'], 1);
      expect(firstEnd['segmentId'], 1);
      expect(firstEnd['durationMs'], 3000);
      expect(
        (firstEnd['latestSnapshot'] as Map<String, dynamic>)['averageFrameTimeMs'],
        25.5,
      );
      expect(secondStart['segmentId'], 2);
      expect(secondStart['metalFxExperiment'], isTrue);
      expect(secondRoute['segmentId'], 2);
      expect(secondSnapshot['segmentId'], 2);
      expect(secondEnd['durationMs'], 2000);
      expect(disabledStart['segmentId'], 3);
      expect(disabledStart['enabled'], isFalse);
    });

    test('player records configuration before route classification', () {
      final source = File(
        'lib/features/player/presentation/player_controller.dart',
      ).readAsStringSync();
      final applyStart = source.indexOf('Future<void> applyAnime4kShaders() async');
      final configuration = source.indexOf('.recordConfiguration(', applyStart);
      final postApply = source.indexOf(
        '_recordAnime4kPostApplyRoute(settings)',
        applyStart,
      );
      expect(applyStart, greaterThanOrEqualTo(0));
      expect(configuration, greaterThan(applyStart));
      expect(postApply, greaterThan(configuration));
    });

'''
          if 'configuration changes create ordered benchmark segments in one file' not in text:
              if marker not in text:
                  raise SystemExit('test insertion marker missing')
              text = text.replace(marker, addition + marker)
          path.write_text(text)
          PY
          dart format test/features/player/anime4k_performance_log_contract_test.dart
          set +e
          flutter test test/features/player/anime4k_performance_log_contract_test.dart > /tmp/anime4k-segment-red.log 2>&1
          status=$?
          set -e
          cat /tmp/anime4k-segment-red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected RED before segment implementation, but tests passed.' >&2
            exit 1
          fi
          grep -Eq 'recordConfiguration|segment' /tmp/anime4k-segment-red.log
      - name: Implement segment-aware logger and controller wiring
        shell: bash
        run: |
          cat > lib/features/player/data/anime4k_performance_log.dart <<'DART'
          import 'dart:convert';
          import 'dart:io';
          import 'dart:typed_data';

          import 'package:device_info_plus/device_info_plus.dart';
          import 'package:flutter/foundation.dart';
          import 'package:flutter_riverpod/flutter_riverpod.dart';
          import 'package:path/path.dart' as p;
          import 'package:path_provider/path_provider.dart';

          import 'anime4k.dart';
          import 'anime4k_performance.dart';

          typedef Anime4kDocumentsDirectoryResolver = Future<Directory> Function();
          typedef Anime4kDeviceInfoResolver = Future<Map<String, Object?>> Function();
          typedef Anime4kClock = DateTime Function();

          /// Device-local JSONL benchmark log for the Apple Anime4K performance work.
          ///
          /// Nothing is uploaded. One `anime4k-*` file is created per service lifetime.
          /// User-visible configuration changes are represented as ordered segments in
          /// that file so physical-device comparisons do not need inferred boundaries.
          class Anime4kPerformanceLog {
            Anime4kPerformanceLog({
              Anime4kDocumentsDirectoryResolver? documentsDirectory,
              Anime4kDeviceInfoResolver? deviceInfo,
              Anime4kClock? now,
            }) : _documentsDirectory =
                     documentsDirectory ?? getApplicationDocumentsDirectory,
                 _deviceInfo = deviceInfo ?? _readDeviceInfo,
                 _now = now ?? DateTime.now;

            final Anime4kDocumentsDirectoryResolver _documentsDirectory;
            final Anime4kDeviceInfoResolver _deviceInfo;
            final Anime4kClock _now;

            Future<File>? _sessionFile;
            Future<void> _writeTail = Future<void>.value();
            _Anime4kLogConfiguration? _activeConfiguration;
            int? _activeSegmentId;
            int _nextSegmentId = 1;
            DateTime? _activeSegmentStartedAt;
            Map<String, Object?>? _latestSnapshotSummary;

            Future<void> recordConfiguration({
              required bool enabled,
              required Anime4kMode mode,
              required Anime4kQuality requestedQuality,
              required bool ecoEnabled,
              required bool metalFxExperiment,
            }) {
              final nextConfiguration = _Anime4kLogConfiguration(
                enabled: enabled,
                mode: mode,
                requestedQuality: requestedQuality,
                ecoEnabled: ecoEnabled,
                metalFxExperiment: metalFxExperiment,
              );
              return _enqueue((file) async {
                if (_activeConfiguration == nextConfiguration) return;

                final now = _now();
                final previous = _activeConfiguration;
                final previousId = _activeSegmentId;
                final previousStartedAt = _activeSegmentStartedAt;
                if (previous != null &&
                    previousId != null &&
                    previousStartedAt != null) {
                  final elapsed = now.difference(previousStartedAt);
                  await _writeEvent(
                    file,
                    <String, Object?>{
                      'type': 'segmentEnd',
                      'segmentId': previousId,
                      ...previous.toJson(),
                      'durationMs': elapsed.isNegative ? 0 : elapsed.inMilliseconds,
                      if (_latestSnapshotSummary != null)
                        'latestSnapshot': _latestSnapshotSummary,
                    },
                    timestamp: now,
                  );
                }

                final nextId = _nextSegmentId++;
                _activeConfiguration = nextConfiguration;
                _activeSegmentId = nextId;
                _activeSegmentStartedAt = now;
                _latestSnapshotSummary = null;
                await _writeEvent(
                  file,
                  <String, Object?>{
                    'type': 'segmentStart',
                    'segmentId': nextId,
                    ...nextConfiguration.toJson(),
                  },
                  timestamp: now,
                );
              });
            }

            Future<void> recordRoute({
              required Anime4kBackend backend,
              required Anime4kMode mode,
              required Anime4kQuality requestedQuality,
              required bool ecoEnabled,
              required bool metalFxExperiment,
              String? colorSignal,
              String? colorTransfer,
              String? colorSystem,
              String? metalState,
              String? playerBackend,
              String? reason,
            }) {
              return _enqueue((file) {
                return _writeEvent(file, <String, Object?>{
                  'type': 'route',
                  'segmentId': _activeSegmentId,
                  'backend': backend.name,
                  'mode': mode.name,
                  'requestedQuality': requestedQuality.name,
                  'ecoEnabled': ecoEnabled,
                  'colorSignal': colorSignal,
                  'colorTransfer': colorTransfer,
                  'colorSystem': colorSystem,
                  'metalState': metalState,
                  'playerBackend': playerBackend,
                  'reason': reason,
                  'metalFxExperiment': metalFxExperiment,
                });
              });
            }

            Future<void> recordSnapshot(
              Anime4kPerformanceSnapshot snapshot, {
              required bool metalFxExperiment,
            }) {
              return _enqueue((file) async {
                final summary = _snapshotSummary(
                  snapshot,
                  metalFxExperiment: metalFxExperiment,
                );
                _latestSnapshotSummary = summary;
                await _writeEvent(file, <String, Object?>{
                  'type': 'snapshot',
                  'segmentId': _activeSegmentId,
                  ...summary,
                });
              });
            }

            /// Returns the newest Anime4K log, including logs from a previous app run.
            Future<File?> latestLogFile() async {
              final root = await _documentsDirectory();
              final directory = Directory(p.join(root.path, 'log'));
              if (!await directory.exists()) return null;

              final files = await directory
                  .list(followLinks: false)
                  .where((entity) {
                    return entity is File &&
                        p.basename(entity.path).startsWith('anime4k-') &&
                        p.extension(entity.path) == '.log';
                  })
                  .cast<File>()
                  .toList();
              if (files.isEmpty) return null;
              files.sort((a, b) => b.path.compareTo(a.path));
              return files.first;
            }

            Future<String?> latestLogPath() async => (await latestLogFile())?.path;

            /// Reads only the tail so a long playback session cannot make the settings
            /// dialog allocate an unbounded string.
            Future<String?> readLatest({int maxBytes = 256 * 1024}) async {
              final file = await latestLogFile();
              if (file == null) return null;
              final length = await file.length();
              final start = length > maxBytes ? length - maxBytes : 0;
              final bytes = await file.openRead(start).fold<BytesBuilder>(
                BytesBuilder(copy: false),
                (builder, data) => builder..add(data),
              );
              final text = utf8.decode(bytes.takeBytes(), allowMalformed: true);
              return start == 0 ? text : '[... earlier Anime4K log omitted ...]\n$text';
            }

            Future<void> _enqueue(Future<void> Function(File file) operation) {
              final next = _runAfter(_writeTail, operation);
              _writeTail = next;
              return next;
            }

            Future<void> _runAfter(
              Future<void> previous,
              Future<void> Function(File file) operation,
            ) async {
              try {
                await previous;
              } catch (_) {
                // A logging failure must never poison the next sample or playback.
              }

              try {
                final file = await _ensureSessionFile();
                await operation(file);
              } catch (error) {
                if (kDebugMode) {
                  debugPrint('Anime4K performance log write skipped: $error');
                }
              }
            }

            Future<void> _writeEvent(
              File file,
              Map<String, Object?> event, {
              DateTime? timestamp,
            }) {
              final entry = <String, Object?>{
                'timestamp': (timestamp ?? _now()).toUtc().toIso8601String(),
                ...event,
              };
              return file.writeAsString(
                '${jsonEncode(entry)}\n',
                mode: FileMode.append,
                flush: true,
              );
            }

            Future<File> _ensureSessionFile() {
              return _sessionFile ??= _createSessionFile();
            }

            Future<File> _createSessionFile() async {
              final root = await _documentsDirectory();
              final directory = Directory(p.join(root.path, 'log'));
              await directory.create(recursive: true);
              final stamp = _now()
                  .toUtc()
                  .toIso8601String()
                  .replaceAll(':', '-')
                  .replaceAll('.', '-');
              final file = File(p.join(directory.path, 'anime4k-$stamp.log'));
              final device = await _deviceInfo();
              await file.writeAsString(
                '${jsonEncode(<String, Object?>{
                  'timestamp': _now().toUtc().toIso8601String(),
                  'type': 'session',
                  ...device,
                })}\n',
                mode: FileMode.append,
                flush: true,
              );
              return file;
            }

            static Map<String, Object?> _snapshotSummary(
              Anime4kPerformanceSnapshot snapshot, {
              required bool metalFxExperiment,
            }) {
              return <String, Object?>{
                'backend': snapshot.backend.name,
                'requestedMode': snapshot.requestedMode.name,
                'requestedQuality': snapshot.requestedQuality.name,
                'effectiveQuality': snapshot.effectiveQuality.name,
                'inputWidth': snapshot.inputWidth,
                'inputHeight': snapshot.inputHeight,
                'processingWidth': snapshot.processingWidth,
                'processingHeight': snapshot.processingHeight,
                'averageFrameTimeMs': snapshot.averageFrameTimeMs,
                'p95FrameTimeMs': snapshot.p95FrameTimeMs,
                'processedFrames': snapshot.processedFrames,
                'skippedDuplicateFrames': snapshot.skippedDuplicateFrames,
                'droppedOrLateFrames': snapshot.droppedOrLateFrames,
                'thermalLevel': snapshot.thermalLevel.name,
                'lowPowerMode': snapshot.lowPowerMode,
                'metalFxExperiment': metalFxExperiment,
              };
            }

            static Future<Map<String, Object?>> _readDeviceInfo() async {
              final info = await DeviceInfoPlugin().deviceInfo;
              final data = info.data;
              final nestedUtsname = data['utsname'];
              String? machine;
              if (nestedUtsname is Map) {
                final value = nestedUtsname['machine'];
                if (value != null) machine = '$value';
              }
              machine ??= _firstText(data, const <String>['machine', 'arch']);

              final physicalValue = data['isPhysicalDevice'];
              final isPhysicalDevice = physicalValue is bool ? physicalValue : true;
              return <String, Object?>{
                'platform': Platform.operatingSystem,
                'osVersion': Platform.operatingSystemVersion,
                'deviceModel': _firstText(
                  data,
                  const <String>[
                    'modelName',
                    'model',
                    'productName',
                    'computerName',
                  ],
                ),
                'machine': machine,
                'isPhysicalDevice': isPhysicalDevice,
              };
            }

            static String? _firstText(Map<String, dynamic> data, List<String> keys) {
              for (final key in keys) {
                final value = data[key];
                if (value == null) continue;
                final text = '$value'.trim();
                if (text.isNotEmpty) return text;
              }
              return null;
            }
          }

          class _Anime4kLogConfiguration {
            const _Anime4kLogConfiguration({
              required this.enabled,
              required this.mode,
              required this.requestedQuality,
              required this.ecoEnabled,
              required this.metalFxExperiment,
            });

            final bool enabled;
            final Anime4kMode mode;
            final Anime4kQuality requestedQuality;
            final bool ecoEnabled;
            final bool metalFxExperiment;

            Map<String, Object?> toJson() => <String, Object?>{
              'enabled': enabled,
              'mode': mode.name,
              'requestedQuality': requestedQuality.name,
              'ecoEnabled': ecoEnabled,
              'metalFxExperiment': metalFxExperiment,
            };

            @override
            bool operator ==(Object other) {
              return other is _Anime4kLogConfiguration &&
                  other.enabled == enabled &&
                  other.mode == mode &&
                  other.requestedQuality == requestedQuality &&
                  other.ecoEnabled == ecoEnabled &&
                  other.metalFxExperiment == metalFxExperiment;
            }

            @override
            int get hashCode => Object.hash(
              enabled,
              mode,
              requestedQuality,
              ecoEnabled,
              metalFxExperiment,
            );
          }

          final anime4kPerformanceLogProvider = Provider<Anime4kPerformanceLog>((ref) {
            return Anime4kPerformanceLog();
          });
          DART

          python3 <<'PY'
          from pathlib import Path

          path = Path('lib/features/player/presentation/player_controller.dart')
          text = path.read_text()
          old = """  @override\n  Future<void> applyAnime4kShaders() async {\n    try {\n"""
          new = """  @override\n  Future<void> applyAnime4kShaders() async {\n    try {\n      final configurationSettings =\n          ref.read(playerSettingsProvider).asData?.value;\n      if (configurationSettings != null) {\n        await _anime4kPerformanceLog.recordConfiguration(\n          enabled: configurationSettings.anime4kEnabled,\n          mode: configurationSettings.anime4kMode,\n          requestedQuality: configurationSettings.anime4kQuality,\n          ecoEnabled: configurationSettings.anime4kEcoEnabled,\n          metalFxExperiment: configurationSettings.anime4kMetalFxEnabled,\n        );\n      }\n\n"""
          if old not in text:
              raise SystemExit('applyAnime4kShaders insertion marker missing')
          if '.recordConfiguration(' not in text:
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          dart format \
            lib/features/player/data/anime4k_performance_log.dart \
            lib/features/player/presentation/player_controller.dart \
            test/features/player/anime4k_performance_log_contract_test.dart
      - name: Run focused GREEN test
        run: flutter test test/features/player/anime4k_performance_log_contract_test.dart
      - name: Commit segment-aware benchmark log
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/player/data/anime4k_performance_log.dart \
            lib/features/player/presentation/player_controller.dart \
            test/features/player/anime4k_performance_log_contract_test.dart
          git diff --cached --check
          git commit -m "fix: segment Anime4K benchmark logs"
          git push origin HEAD:feat/anime4k-ios-performance
