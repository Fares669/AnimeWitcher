name: Apply Anime4K preview video capture

on:
  push:
    branches:
      - feat/anime4k-ios-performance
    paths:
      - .github/workflows/apply-anime4k-metalfx-setting.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/anime4k-ios-performance
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Confirm focused RED
        shell: bash
        run: |
          set +e
          flutter test test/features/player/anime4k_sample_preview_test.dart > /tmp/anime4k-preview-red.log 2>&1
          status=$?
          set -e
          cat /tmp/anime4k-preview-red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected preview regression test to fail before implementation.' >&2
            exit 1
          fi
          grep -Eq "video|window|Expected" /tmp/anime4k-preview-red.log
      - name: Capture processed video instead of external window
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('lib/features/player/presentation/widgets/anime4k_sample_preview.dart')
          text = path.read_text()
          old = "        'window',\n"
          new = "        'video',\n"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one window screenshot target, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          dart format lib/features/player/presentation/widgets/anime4k_sample_preview.dart
      - name: Run focused GREEN
        run: flutter test test/features/player/anime4k_sample_preview_test.dart
      - name: Commit preview fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/player/presentation/widgets/anime4k_sample_preview.dart
          git diff --cached --check
          git commit -m "fix: capture Anime4K preview from processed video"
          git push origin HEAD:feat/anime4k-ios-performance
