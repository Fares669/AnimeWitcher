name: Apply Anime4K MetalFX setting implementation

on:
  push:
    branches:
      - feat/anime4k-ios-performance
    paths:
      - .github/workflows/apply-anime4k-metalfx-setting.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/anime4k-ios-performance
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Apply production changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} matches, found {actual}')
              p.write_text(text.replace(old, new))

          settings = 'lib/features/settings/presentation/player_settings_provider.dart'
          replace(settings,
          """  final bool anime4kEcoEnabled;\n\n  /// Which Anime4K pipeline to run while it is enabled.\n""",
          """  final bool anime4kEcoEnabled;\n\n  /// Apple-only experimental final upscale strategy. Independent from Eco:\n  /// Eco controls adaptive work while MetalFX controls the upscale backend.\n  final bool anime4kMetalFxEnabled;\n\n  /// Which Anime4K pipeline to run while it is enabled.\n""")
          replace(settings,
          """    this.anime4kEnabled = false,\n    this.anime4kEcoEnabled = false,\n    this.anime4kMode = Anime4kMode.off,\n""",
          """    this.anime4kEnabled = false,\n    this.anime4kEcoEnabled = false,\n    this.anime4kMetalFxEnabled = false,\n    this.anime4kMode = Anime4kMode.off,\n""")
          replace(settings,
          """    bool? anime4kEnabled,\n    bool? anime4kEcoEnabled,\n    Anime4kMode? anime4kMode,\n""",
          """    bool? anime4kEnabled,\n    bool? anime4kEcoEnabled,\n    bool? anime4kMetalFxEnabled,\n    Anime4kMode? anime4kMode,\n""")
          replace(settings,
          """      anime4kEnabled: anime4kEnabled ?? this.anime4kEnabled,\n      anime4kEcoEnabled: anime4kEcoEnabled ?? this.anime4kEcoEnabled,\n      anime4kMode: anime4kMode ?? this.anime4kMode,\n""",
          """      anime4kEnabled: anime4kEnabled ?? this.anime4kEnabled,\n      anime4kEcoEnabled: anime4kEcoEnabled ?? this.anime4kEcoEnabled,\n      anime4kMetalFxEnabled:\n          anime4kMetalFxEnabled ?? this.anime4kMetalFxEnabled,\n      anime4kMode: anime4kMode ?? this.anime4kMode,\n""")
          replace(settings,
          """    final anime4kEcoEnabled =\n        storage.getPlayerSetting<bool>(\n          'player_anime4k_eco_enabled',\n          defaultValue: false,\n        ) ??\n        false;\n    final anime4kQuality = Anime4kQualitySuffix.fromName(\n""",
          """    final anime4kEcoEnabled =\n        storage.getPlayerSetting<bool>(\n          'player_anime4k_eco_enabled',\n          defaultValue: false,\n        ) ??\n        false;\n    final anime4kMetalFxEnabled =\n        storage.getPlayerSetting<bool>(\n          'player_anime4k_metalfx_enabled',\n          defaultValue: false,\n        ) ??\n        false;\n    final anime4kQuality = Anime4kQualitySuffix.fromName(\n""")
          replace(settings,
          """      anime4kEnabled: anime4kEnabled,\n      anime4kEcoEnabled: anime4kEcoEnabled,\n      anime4kMode: anime4kMode,\n""",
          """      anime4kEnabled: anime4kEnabled,\n      anime4kEcoEnabled: anime4kEcoEnabled,\n      anime4kMetalFxEnabled: anime4kMetalFxEnabled,\n      anime4kMode: anime4kMode,\n""")
          replace(settings,
          """  Future<void> setAnime4kEcoEnabled(bool val) async {\n    await _repository.setPlayerSetting('player_anime4k_eco_enabled', val);\n    state = AsyncData(state.requireValue.copyWith(anime4kEcoEnabled: val));\n  }\n\n  Future<void> setAnime4kMode(Anime4kMode val) async {\n""",
          """  Future<void> setAnime4kEcoEnabled(bool val) async {\n    await _repository.setPlayerSetting('player_anime4k_eco_enabled', val);\n    state = AsyncData(state.requireValue.copyWith(anime4kEcoEnabled: val));\n  }\n\n  Future<void> setAnime4kMetalFxEnabled(bool val) async {\n    await _repository.setPlayerSetting('player_anime4k_metalfx_enabled', val);\n    state = AsyncData(state.requireValue.copyWith(anime4kMetalFxEnabled: val));\n  }\n\n  Future<void> setAnime4kMode(Anime4kMode val) async {\n""")

          dialog = 'lib/features/settings/presentation/widgets/anime4k_dialog.dart'
          replace(dialog,
          """                  onChanged: (on) async {\n                    await ref\n                        .read(playerSettingsProvider.notifier)\n                        .setAnime4kEcoEnabled(on);\n                    await _reapply();\n                  },\n                ),\n                if (settings.anime4kEcoEnabled && diagnostics != null) ...[\n""",
          """                  onChanged: (on) async {\n                    await ref\n                        .read(playerSettingsProvider.notifier)\n                        .setAnime4kEcoEnabled(on);\n                    await _reapply();\n                  },\n                ),\n                SwitchListTile(\n                  value: settings.anime4kMetalFxEnabled,\n                  contentPadding: EdgeInsets.zero,\n                  title: Text(\n                    appText(\n                      context,\n                      english: 'MetalFX (experimental)',\n                      arabic: 'MetalFX (تجريبي)',\n                    ),\n                    style: theme.textTheme.titleSmall,\n                  ),\n                  subtitle: Text(\n                    appText(\n                      context,\n                      english:\n                          'Uses Anime4K restore/denoise with Apple MetalFX '\n                          'for the final upscale. This is independent from Eco.',\n                      arabic:\n                          'يستخدم استعادة/تنقية Anime4K مع Apple MetalFX '\n                          'للتكبير النهائي. هذا الخيار مستقل عن الوضع الاقتصادي.',\n                    ),\n                  ),\n                  onChanged: (on) async {\n                    await ref\n                        .read(playerSettingsProvider.notifier)\n                        .setAnime4kMetalFxEnabled(on);\n                    await _reapply();\n                  },\n                ),\n                if (settings.anime4kEcoEnabled && diagnostics != null) ...[\n""")

          base = Path('lib/features/player/presentation/player_controller_base.dart')
          base_text = base.read_text()
          pattern = re.compile(
              r"final useMetalFxExperiment\s*=\s*"
              r"const bool\.fromEnvironment\('ANIME4K_METALFX_EXPERIMENT'\)\s*&&\s*"
              r"\(settings\?\.anime4kEcoEnabled\s*\?\?\s*false\);"
          )
          base_text, count = pattern.subn(
              "final useMetalFxExperiment =\n          settings?.anime4kMetalFxEnabled ?? false;",
              base_text,
          )
          if count < 1 or 'ANIME4K_METALFX_EXPERIMENT' in base_text:
              raise SystemExit(
                  f'{base}: semantic MetalFX replacement count={count}, residual define='
                  f"{'ANIME4K_METALFX_EXPERIMENT' in base_text}"
              )
          base.write_text(base_text)

          controller = 'lib/features/player/presentation/player_controller.dart'
          replace(controller,
          """    return previous.anime4kEnabled != next.anime4kEnabled ||\n        previous.anime4kEcoEnabled != next.anime4kEcoEnabled ||\n        previous.anime4kMode != next.anime4kMode ||\n""",
          """    return previous.anime4kEnabled != next.anime4kEnabled ||\n        previous.anime4kEcoEnabled != next.anime4kEcoEnabled ||\n        previous.anime4kMetalFxEnabled != next.anime4kMetalFxEnabled ||\n        previous.anime4kMode != next.anime4kMode ||\n""")
          replace(controller,
          """  bool get _anime4kMetalFxExperimentEnabled {\n    final settings = ref.read(playerSettingsProvider).asData?.value;\n    return const bool.fromEnvironment('ANIME4K_METALFX_EXPERIMENT') &&\n        (settings?.anime4kEcoEnabled ?? false);\n  }\n""",
          """  bool get _anime4kMetalFxExperimentEnabled {\n    final settings = ref.read(playerSettingsProvider).asData?.value;\n    return settings?.anime4kMetalFxEnabled ?? false;\n  }\n""")

          preview = '.github/workflows/ios-preview-once.yml'
          replace(preview,
          '            "ANIME4K_METALFX_EXPERIMENT": "true",\n',
          '')
          PY
          dart format \
            lib/features/settings/presentation/player_settings_provider.dart \
            lib/features/settings/presentation/widgets/anime4k_dialog.dart \
            lib/features/player/presentation/player_controller_base.dart \
            lib/features/player/presentation/player_controller.dart
      - name: Run focused GREEN tests
        run: |
          flutter pub get
          flutter test \
            test/features/settings/presentation/anime4k_eco_settings_test.dart \
            test/features/player/anime4k_metalfx_experiment_contract_test.dart
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/settings/presentation/player_settings_provider.dart \
            lib/features/settings/presentation/widgets/anime4k_dialog.dart \
            lib/features/player/presentation/player_controller_base.dart \
            lib/features/player/presentation/player_controller.dart \
            .github/workflows/ios-preview-once.yml
          git diff --cached --check
          git commit -m "feat: expose independent Anime4K MetalFX toggle"
          git push origin HEAD:feat/anime4k-ios-performance
