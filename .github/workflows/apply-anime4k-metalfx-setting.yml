name: Apply Anime4K segmented log controller wiring

on:
  push:
    branches:
      - feat/anime4k-ios-performance
    paths:
      - .github/workflows/apply-anime4k-metalfx-setting.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/anime4k-ios-performance
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Patch controller configuration boundary
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/features/player/presentation/player_controller.dart')
          text = path.read_text()
          if '.recordConfiguration(' not in text:
              pattern = re.compile(
                  r'(Future<void> applyAnime4kShaders\(\) async \{\s*try \{\s*)'
              )
              insertion = """final configurationSettings =
              ref.read(playerSettingsProvider).asData?.value;
            if (configurationSettings != null) {
              await _anime4kPerformanceLog.recordConfiguration(
                enabled: configurationSettings.anime4kEnabled,
                mode: configurationSettings.anime4kMode,
                requestedQuality: configurationSettings.anime4kQuality,
                ecoEnabled: configurationSettings.anime4kEcoEnabled,
                metalFxExperiment: configurationSettings.anime4kMetalFxEnabled,
              );
            }

            """
              text, count = pattern.subn(lambda match: match.group(1) + insertion, text, count=1)
              if count != 1:
                  raise SystemExit(f'applyAnime4kShaders semantic match count={count}')
          path.write_text(text)
          PY
          dart format lib/features/player/presentation/player_controller.dart
      - name: Run focused GREEN test
        run: |
          flutter pub get
          flutter test test/features/player/anime4k_performance_log_contract_test.dart
      - name: Commit controller wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/player/presentation/player_controller.dart
          git diff --cached --check
          git commit -m "fix: attribute Anime4K logs to setting segments"
          git push origin HEAD:feat/anime4k-ios-performance
