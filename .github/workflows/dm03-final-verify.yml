name: DM-03 Final Verify

on:
  push:
    branches:
      - plan/download-manager-reliability
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Focused settings regression
        run: flutter test test/features/settings/presentation/download_concurrency_settings_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: DM-03 focused coverage
        run: |
          flutter test test/core/services/download_command_outcome_test.dart test/core/services/download_control_outcome_guard_test.dart test/core/services/download_start_outcome_guard_test.dart test/core/services/download_initialization_barrier_guard_test.dart test/core/services/download_service_readiness_test.dart test/core/services/download_range_transfer_test.dart test/core/services/download_source_refresh_integrity_test.dart test/core/services/persistent_parallel_download_test.dart test/core/utils/download_resume_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: Full test suite
        run: flutter test --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Diff check
        run: git diff --check
