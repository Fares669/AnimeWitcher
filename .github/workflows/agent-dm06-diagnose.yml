name: Agent DM06 Diagnose
on:
  push:
    branches: [plan/download-manager-reliability]
    paths: [.github/workflows/agent-dm06-diagnose.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Prepare and patch
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          git reset --hard HEAD
          python3 .github/scripts/agent_dm06_resource_integrity_patch.py
          python3 .github/scripts/agent_dm06_probe_method_patch.py
          dart format lib/core/services/download_service.dart lib/core/services/download_resource_identity.dart
      - name: Identity guard
        run: flutter test test/core/services/download_resource_identity_guard_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: Service guard
        if: always()
        run: flutter test test/core/services/download_resource_identity_service_guard_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: Identity behavior
        if: always()
        run: flutter test test/core/services/download_resource_identity_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: Source refresh integrity
        if: always()
        run: flutter test test/core/services/download_source_refresh_integrity_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: Refresh checkpoint
        if: always()
        run: flutter test test/core/services/download_source_refresh_checkpoint_guard_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: Recovery reconciliation
        if: always()
        run: flutter test test/core/services/download_recovery_reconciliation_guard_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: Durable byte contract
        if: always()
        run: flutter test test/core/services/download_durable_byte_contract_guard_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: Durable provenance
        if: always()
        run: flutter test test/core/services/download_durable_byte_provenance_guard_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: DM05 regression
        if: always()
        run: flutter test test/core/services/download_job_single_authority_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: DM24 regression
        if: always()
        run: flutter test test/core/services/download_logical_identity_start_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: Analyze
        if: always()
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
