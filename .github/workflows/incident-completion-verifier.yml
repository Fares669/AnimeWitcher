name: Download exact-size completion verifier

on:
  push:
    branches: [plan/download-manager-reliability]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: incident-completion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-size-completion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Run exact-size completion regressions
        run: >-
          flutter test
          test/core/services/download_zero_restart_invariant_test.dart
          test/core/services/download_parallel_complete_artifact_guard_test.dart
          --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
