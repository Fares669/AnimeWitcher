name: Download Plugin Parallel Acceptance

on:
  push:
    branches:
      - refactor/background-downloader-authority
    paths:
      - '.github/workflows/download-plugin-parallel-acceptance.yml'

permissions:
  contents: read

jobs:
  android-acceptance:
    name: Android plugin-parallel acceptance APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/background-downloader-authority
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Enable plugin parallel only in acceptance workspace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/core/services/download_service.dart')
          text = path.read_text()
          old = 'final service = DownloadService(ref);'
          new = 'final service = DownloadService(ref, pluginParallelAccepted: true);'
          if text.count(old) != 1:
              raise SystemExit(f'expected one provider constructor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          policy = Path('lib/core/services/download_transport_policy.dart').read_text()
          if 'TargetPlatform.windows => false' not in policy:
              raise SystemExit('production platform gate is no longer fail-closed')
          PY
          git diff --check
          git diff -- lib/core/services/download_service.dart
      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Generate dart-defines file
        shell: bash
        run: |
          cat > dart-defines.json << 'JSON_EOF'
          {
            "MAL_CLIENT_ID": "${{ secrets.MAL_CLIENT_ID }}",
            "MAL_CLIENT_SECRET": "${{ secrets.MAL_CLIENT_SECRET }}",
            "ANILIST_CLIENT_ID": "${{ secrets.ANILIST_CLIENT_ID }}",
            "ANIMEWITCHER_FIREBASE_PROJECT_ID": "${{ secrets.ANIMEWITCHER_FIREBASE_PROJECT_ID }}",
            "ANIMEWITCHER_FIREBASE_API_KEY": "${{ secrets.ANIMEWITCHER_FIREBASE_API_KEY }}",
            "ANIMEWITCHER_GOOGLE_SERVER_CLIENT_ID": "${{ secrets.ANIMEWITCHER_GOOGLE_SERVER_CLIENT_ID }}",
            "ANIMEWITCHER_GOOGLE_IOS_CLIENT_ID": "${{ secrets.ANIMEWITCHER_GOOGLE_IOS_CLIENT_ID || '296971789988-0ksnaln8k2epsuejesllrr497jnd5if5.apps.googleusercontent.com' }}"
          }
          JSON_EOF
      - name: Build acceptance APK
        run: flutter build apk --debug --dart-define-from-file=dart-defines.json
      - name: Write acceptance manifest
        run: |
          cat > plugin-parallel-acceptance.txt <<EOF
          source_head=${GITHUB_SHA}
          platform=android
          plugin_parallel_forced_in_runner=true
          production_gate_modified=false
          EOF
      - name: Upload acceptance APK
        uses: actions/upload-artifact@v4
        with:
          name: plugin-parallel-acceptance-android-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            plugin-parallel-acceptance.txt
          retention-days: 7

  ios-acceptance:
    name: iOS plugin-parallel acceptance IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/background-downloader-authority
      - name: Select Latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Enable plugin parallel only in acceptance workspace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/core/services/download_service.dart')
          text = path.read_text()
          old = 'final service = DownloadService(ref);'
          new = 'final service = DownloadService(ref, pluginParallelAccepted: true);'
          if text.count(old) != 1:
              raise SystemExit(f'expected one provider constructor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          policy = Path('lib/core/services/download_transport_policy.dart').read_text()
          if 'TargetPlatform.windows => false' not in policy:
              raise SystemExit('production platform gate is no longer fail-closed')
          PY
          git diff --check
          git diff -- lib/core/services/download_service.dart
      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Prepare media_kit iOS Headers
        run: bash scripts/prepare_media_kit_ios_headers.sh
      - name: Generate dart-defines file
        shell: bash
        run: |
          cat > dart-defines.json << 'JSON_EOF'
          {
            "MAL_CLIENT_ID": "${{ secrets.MAL_CLIENT_ID }}",
            "MAL_CLIENT_SECRET": "${{ secrets.MAL_CLIENT_SECRET }}",
            "ANILIST_CLIENT_ID": "${{ secrets.ANILIST_CLIENT_ID }}",
            "ANIMEWITCHER_FIREBASE_PROJECT_ID": "${{ secrets.ANIMEWITCHER_FIREBASE_PROJECT_ID }}",
            "ANIMEWITCHER_FIREBASE_API_KEY": "${{ secrets.ANIMEWITCHER_FIREBASE_API_KEY }}",
            "ANIMEWITCHER_GOOGLE_SERVER_CLIENT_ID": "${{ secrets.ANIMEWITCHER_GOOGLE_SERVER_CLIENT_ID }}",
            "ANIMEWITCHER_GOOGLE_IOS_CLIENT_ID": "${{ secrets.ANIMEWITCHER_GOOGLE_IOS_CLIENT_ID || '296971789988-0ksnaln8k2epsuejesllrr497jnd5if5.apps.googleusercontent.com' }}"
          }
          JSON_EOF
      - name: Configure Google Sign-In for iOS
        env:
          ANIMEWITCHER_GOOGLE_IOS_CLIENT_ID: ${{ secrets.ANIMEWITCHER_GOOGLE_IOS_CLIENT_ID || '296971789988-0ksnaln8k2epsuejesllrr497jnd5if5.apps.googleusercontent.com' }}
          ANIMEWITCHER_GOOGLE_SERVER_CLIENT_ID: ${{ secrets.ANIMEWITCHER_GOOGLE_SERVER_CLIENT_ID }}
        run: bash scripts/configure_ios_google_sign_in.sh
      - name: Build acceptance IPA
        run: |
          flutter build ios --release --no-codesign --dart-define-from-file=dart-defines.json
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r animewitcher-plugin-parallel-acceptance-ios-unsigned.ipa Payload
      - name: Write acceptance manifest
        run: |
          cat > plugin-parallel-acceptance.txt <<EOF
          source_head=${GITHUB_SHA}
          platform=ios
          plugin_parallel_forced_in_runner=true
          production_gate_modified=false
          EOF
      - name: Upload acceptance IPA
        uses: actions/upload-artifact@v4
        with:
          name: plugin-parallel-acceptance-ios-ipa
          path: |
            animewitcher-plugin-parallel-acceptance-ios-unsigned.ipa
            plugin-parallel-acceptance.txt
          retention-days: 7
