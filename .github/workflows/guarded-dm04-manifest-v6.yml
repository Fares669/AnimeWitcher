name: Guarded DM-04 manifest v6 recovery

on:
  push:
    branches:
      - plan/download-manager-reliability

permissions:
  contents: write

jobs:
  tdd-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability
          fetch-depth: 0

      - name: Guard against repeat execution
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -Fq '[dm04-manifest-v6]'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.guard.outputs.skip != 'true'
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies and generate sources
        if: steps.guard.outputs.skip != 'true'
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Add RED manifest descriptor test
        if: steps.guard.outputs.skip != 'true'
        run: |
          python3 .github/scripts/dm04_manifest_red.py
          dart format test/core/services/persistent_parallel_download_test.dart

      - name: Prove RED before implementation
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set +e
          flutter test test/core/services/persistent_parallel_download_test.dart --plain-name 'multipart manifest persists a reconstructable parent descriptor' --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key > /tmp/dm04-red.log 2>&1
          code=$?
          set -e
          cat /tmp/dm04-red.log
          test "$code" -ne 0
          grep -Eq "Expected: <6>|schemaVersion|parentTask" /tmp/dm04-red.log

      - name: Implement manifest v6 descriptor and safe discovery
        if: steps.guard.outputs.skip != 'true'
        run: |
          python3 .github/scripts/dm04_manifest_impl.py
          dart format lib/core/services/persistent_parallel_download.dart test/core/services/persistent_parallel_download_test.dart

      - name: Focused manifest tests
        if: steps.guard.outputs.skip != 'true'
        run: flutter test test/core/services/persistent_parallel_download_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Recovery inventory regressions
        if: steps.guard.outputs.skip != 'true'
        run: flutter test test/core/services/download_recovery_inventory_test.dart test/core/services/download_job_store_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Full test suite
        if: steps.guard.outputs.skip != 'true'
        run: flutter test --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Analyze
        if: steps.guard.outputs.skip != 'true'
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Verify and commit
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          git rm .github/workflows/guarded-dm04-manifest-v6.yml .github/scripts/dm04_manifest_red.py .github/scripts/dm04_manifest_impl.py
          git add lib/core/services/persistent_parallel_download.dart test/core/services/persistent_parallel_download_test.dart
          git diff --cached --check
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/scripts/dm04_manifest_impl.py' '.github/scripts/dm04_manifest_red.py' '.github/workflows/guarded-dm04-manifest-v6.yml' 'lib/core/services/persistent_parallel_download.dart' 'test/core/services/persistent_parallel_download_test.dart' | sort)"
          printf 'Staged files:\n%s\n' "$changed"
          test "$changed" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(downloads): persist recoverable multipart parent manifests [dm04-manifest-v6]'
          git push origin HEAD:plan/download-manager-reliability
