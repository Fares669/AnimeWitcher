name: Guarded DM-04 manifest v6 recovery

on:
  push:
    branches:
      - plan/download-manager-reliability

permissions:
  contents: write

jobs:
  tdd-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability
          fetch-depth: 0

      - name: Guard against repeat execution
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -Fq '[dm04-manifest-v6]'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.guard.outputs.skip != 'true'
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies and generate sources
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Add RED manifest descriptor test
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          PATCH_SCRIPT_B64: 
        run: |
          printf '%s' "$PATCH_SCRIPT_B64" | base64 --decode | python3
          dart format test/core/services/persistent_parallel_download_test.dart

      - name: Prove RED before implementation
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set +e
          flutter test test/core/services/persistent_parallel_download_test.dart --plain-name 'multipart manifest persists a reconstructable parent descriptor' --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key > /tmp/dm04-red.log 2>&1
          code=$?
          set -e
          cat /tmp/dm04-red.log
          test "$code" -ne 0
          grep -Eq "Expected: <6>|schemaVersion|parentTask" /tmp/dm04-red.log

      - name: Implement manifest v6 descriptor and safe discovery
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          PATCH_SCRIPT_B64: ['schemaVersion'] = 5
          ..remove('parentTask');
    await manifest.writeAsString(jsonEncode(legacy), flush: true);
    expect(
      await readParallelManifestRecoveryEvidence(
        manifest,
        trustedRoot: directory,
      ),
      isNull,
      reason: 'v5 manifests may resume a known parent but cannot invent one',
    );
  });

  test('manifest descriptor cannot escape or mismatch its app-owned target', () async {
    expect(await coordinator.start(parent, 100), isTrue);
    final manifest = File('${await parent.filePath()}.parts/manifest.json');
    final foreign = File('${directory.path}/foreign.parts/manifest.json');
    await foreign.parent.create(recursive: true);
    await foreign.writeAsString(await manifest.readAsString(), flush: true);

    expect(
      await readParallelManifestRecoveryEvidence(
        foreign,
        trustedRoot: directory,
      ),
      isNull,
    );

    final outside = await Directory.systemTemp.createTemp('parallel-outside-');
    try {
      final outsideManifest =
          File('${outside.path}/video.mp4.parts/manifest.json');
      await outsideManifest.parent.create(recursive: true);
      await outsideManifest.writeAsString(
        await manifest.readAsString(),
        flush: true,
      );
      expect(
        await readParallelManifestRecoveryEvidence(
          outsideManifest,
          trustedRoot: directory,
        ),
        isNull,
      );
    } finally {
      await outside.delete(recursive: true);
    }
  });

"""
if marker not in tests:
    raise SystemExit('extra test insertion marker not found')
tests = tests.replace(marker, extra + marker, 1)
test_path.write_text(tests)
