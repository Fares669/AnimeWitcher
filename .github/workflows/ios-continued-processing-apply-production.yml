name: iOS Continued Processing Apply Production

on:
  push:
    branches:
      - refactor/background-downloader-authority

permissions:
  contents: write

concurrency:
  group: ios-continued-processing-apply-production
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/background-downloader-authority
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Apply proven continued-processing patch
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64
          import re
          import subprocess
          from pathlib import Path

          helper = Path('.github/workflows/ios-continued-processing-sync-green.yml').read_text()
          match = re.search(
              r"run: echo '([^']+)' \\| base64 -d \\| python3",
              helper,
          )
          if match is None:
              raise SystemExit('continued-processing patch payload not found')
          patch = Path('/tmp/apply-continued-processing.py')
          patch.write_bytes(base64.b64decode(match.group(1)))
          subprocess.run(['python3', str(patch)], check=True)
          PYCODE

      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Format and sanity-check production changes
        run: |
          dart format \
            lib/core/services/download_continued_processing_service.dart \
            lib/core/services/download_service.dart
          git diff --check

      - name: Verify focused continued-processing contracts
        run: |
          flutter test \
            test/core/services/download_continued_processing_start_ack_test.dart \
            test/core/services/ios_continued_processing_start_source_test.dart \
            test/core/services/ios_continued_processing_update_ack_source_test.dart \
            test/core/services/ios_continued_processing_completion_guard_test.dart \
            test/core/services/ios_continued_processing_expiration_test.dart \
            test/core/services/download_native_claim_foreground_test.dart \
            test/core/services/download_presentation_ownership_test.dart

      - name: Analyze generated project
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Commit production fix and remove temporary workflows
        shell: bash
        run: |
          rm -f \
            .github/workflows/ios-continued-processing-sync-green.yml \
            .github/workflows/ios-continued-processing-finalize.yml \
            .github/workflows/ios-continued-processing-apply-production.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ios/Runner/DownloadContinuedProcessingManager.swift \
            ios/Runner/AppDelegate.swift \
            lib/core/services/download_continued_processing_service.dart \
            lib/core/services/download_service.dart \
            .github/workflows/ios-continued-processing-sync-green.yml \
            .github/workflows/ios-continued-processing-finalize.yml \
            .github/workflows/ios-continued-processing-apply-production.yml
          git diff --cached --exit-code && {
            echo 'Expected production/source cleanup changes were not produced.' >&2
            exit 1
          }
          git commit -m "fix(ios): finalize continued-processing handoff"
          git push origin HEAD:refactor/background-downloader-authority
