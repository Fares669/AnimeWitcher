name: Verify DM-31 generation-owned refresh descriptors

on:
  push:
    branches:
      - plan/download-manager-reliability
    paths:
      - .github/workflows/dm31-generation-owned-refresh.yml
      - .github/scripts/dm31_apply_patch.py
      - .github/scripts/dm31_patch.py
      - .github/scripts/dm31_patch_v2.py
      - .github/scripts/dm31_owner_scope_fix.py
      - .github/scripts/dm11_foundation_patch.py
      - .github/scripts/dm11_verifier_patch.py
      - test/core/services/download_refresh_descriptor_ownership_guard_test.dart
      - test/core/services/download_start_outcome_guard_test.dart
      - test/core/services/download_url_refresh_generation_test.dart
      - test/core/services/download_url_refresh_test.dart
      - test/core/services/download_replica_transaction_test.dart

permissions:
  contents: write

concurrency:
  group: dm31-generation-owned-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - run: flutter pub get
      - name: Generate sources
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Apply DM-31 production patch
        run: |
          python3 .github/scripts/dm31_apply_patch.py
          python3 .github/scripts/dm31_owner_scope_fix.py
          dart format lib/core/services/download_url_refresh.dart lib/features/details/presentation/download_launcher.dart lib/core/services/download_service.dart
          git diff --check
      - name: Verify DM-31 focused behavior
        run: |
          flutter test test/core/services/download_refresh_descriptor_ownership_guard_test.dart test/core/services/download_start_outcome_guard_test.dart test/core/services/download_url_refresh_generation_test.dart test/core/services/download_url_refresh_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
          git diff --check
      - name: Verify full analyzer across DM-11 cycle foundation
        shell: bash
        run: |
          set -euo pipefail
          backup="$(mktemp)"
          cp lib/core/services/download_job_store.dart "$backup"
          restore_job_store() {
            cp "$backup" lib/core/services/download_job_store.dart
            rm -f "$backup"
          }
          trap restore_job_store EXIT
          python3 .github/scripts/dm11_verifier_patch.py
          dart format lib/core/services/download_job_store.dart
          flutter analyze --no-fatal-warnings --no-fatal-infos
          git diff --check
      - name: Mark verified DM-31 complete in plan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('DOWNLOAD_MANAGER_PLAN.md')
          text = path.read_text()
          old = '- [ ] **DM-31 — Make URL-refresh descriptor ownership transactional and generation-aware**'
          new = '- [x] **DM-31 — Make URL-refresh descriptor ownership transactional and generation-aware**'
          if new in text:
              raise SystemExit(0)
          if old not in text:
              raise SystemExit('DM-31 checklist marker not found')
          text = text.replace(old, new, 1)
          marker = '  - **Dependencies:** DM-21, DM-24, DM-11.\n'
          notes = (
              marker
              + '  - **Implementation notes (2026-09-12):** Refresh descriptors are owned by logical task generation inside DownloadService start/cancel boundaries. Obsolete callers cannot remove a newer generation descriptor, and descriptor persistence failure is surfaced through the typed start outcome instead of being silently detached from job creation.\n'
              + '  - **Verification passed:** generation/owner descriptor guards, typed start outcome coverage, URL refresh behavior, DM-11 replica-transaction compatibility, full analyzer, and the dedicated `Verify DM-31 generation-owned refresh descriptors` workflow.\n'
          )
          if marker not in text:
              raise SystemExit('DM-31 dependency marker not found')
          text = text.replace(marker, notes, 1)
          path.write_text(text)
          PY
          git diff --check
      - name: Commit verified DM-31 production changes
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/core/services/download_url_refresh.dart lib/features/details/presentation/download_launcher.dart lib/core/services/download_service.dart DOWNLOAD_MANAGER_PLAN.md; then
            echo 'DM-31 production patch and plan marker already present.'
            echo 'needs_push=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'needs_push=true' >> "$GITHUB_OUTPUT"
          git config user.name 'openai-download-agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/core/services/download_url_refresh.dart lib/features/details/presentation/download_launcher.dart lib/core/services/download_service.dart DOWNLOAD_MANAGER_PLAN.md
          git commit -m 'chore(downloads): finalize DM-31 verification'
          echo 'Workspace changes left by source generation/analyzer before rebase:'
          git status --short
          git stash push --include-untracked -m 'dm31-ci-generated-before-rebase' || true
          git pull --rebase origin plan/download-manager-reliability
      - name: Reverify and push
        if: steps.commit.outputs.needs_push == 'true'
        shell: bash
        run: |
          set -euo pipefail
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          flutter test test/core/services/download_refresh_descriptor_ownership_guard_test.dart test/core/services/download_start_outcome_guard_test.dart test/core/services/download_url_refresh_generation_test.dart test/core/services/download_url_refresh_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
          backup="$(mktemp)"
          cp lib/core/services/download_job_store.dart "$backup"
          restore_job_store() {
            cp "$backup" lib/core/services/download_job_store.dart
            rm -f "$backup"
          }
          trap restore_job_store EXIT
          python3 .github/scripts/dm11_verifier_patch.py
          dart format lib/core/services/download_job_store.dart
          flutter analyze --no-fatal-warnings --no-fatal-infos
          git diff --check
          restore_job_store
          trap - EXIT
          git diff --check
          git push origin HEAD:plan/download-manager-reliability
