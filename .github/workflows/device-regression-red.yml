name: iOS Device Regression RED

on:
  push:
    branches:
      - refactor/background-downloader-authority
    paths:
      - '.github/workflows/device-regression-red.yml'
      - 'test/core/services/download_pause_settlement_guard_test.dart'
      - 'test/core/services/download_plugin_parallel_execution_test.dart'

permissions:
  contents: read

jobs:
  focused-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Run device regression tests
        run: |
          flutter test \
            test/core/services/download_pause_settlement_guard_test.dart \
            test/core/services/download_plugin_parallel_execution_test.dart
