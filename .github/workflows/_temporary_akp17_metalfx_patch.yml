name: Temporary exact AKP-17 MetalFX patch

on:
  push:
    branches:
      - feat/anime4k-ios-performance

permissions:
  contents: write

concurrency:
  group: temporary-akp17-metalfx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/anime4k-ios-performance
          fetch-depth: 0
      - name: Apply exact AKP-17 patch
        run: python3 tool/_temporary_akp17_metalfx_patch.py
      - name: Commit AKP-17 GREEN and remove helpers
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat: add isolated MetalFX Anime4K experiment"
          git push origin HEAD:feat/anime4k-ios-performance
