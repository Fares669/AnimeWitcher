name: Apply Task 24 Plugin Resume

on:
  push:
    branches:
      - refactor/background-downloader-authority

permissions:
  contents: write

jobs:
  green:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/background-downloader-authority
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Apply guarded plugin resume fix
        run: python .github/apply_task24_plugin_resume.py
      - name: Format changed Dart
        run: dart format lib/core/services/download_service.dart
      - name: Run focused lifecycle/source/recovery tests
        run: |
          flutter test \
            test/core/services/download_plugin_resume_authority_test.dart \
            test/core/services/background_downloader_transfer_api_authority_test.dart \
            test/core/services/download_plugin_source_refresh_routing_test.dart \
            test/core/services/download_source_refresh_integrity_test.dart \
            test/core/services/download_zero_restart_invariant_test.dart \
            test/core/services/download_pause_settlement_guard_test.dart \
            test/core/services/download_plugin_relaunch_single_writer_test.dart \
            test/core/services/download_startup_reconciliation_matrix_test.dart \
            test/core/services/download_relaunch_chaos_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Remove one-shot files
        run: |
          rm -f .github/apply_task24_plugin_resume.py
          rm -f .github/workflows/apply-task24-plugin-resume.yml
          rm -f .github/workflows/task24-plugin-resume-red.yml
      - name: Verify diff
        run: |
          git status --short
          git diff --check
          test ! -e .github/apply_task24_plugin_resume.py
          test ! -e .github/workflows/apply-task24-plugin-resume.yml
          test ! -e .github/workflows/task24-plugin-resume-red.yml
      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/core/services/download_service.dart \
                  .github/apply_task24_plugin_resume.py \
                  .github/workflows/apply-task24-plugin-resume.yml \
                  .github/workflows/task24-plugin-resume-red.yml
          git diff --cached --check
          git commit -m 'refactor(downloads): delegate resume lifecycle to Transfer'
          git push origin HEAD:refactor/background-downloader-authority
