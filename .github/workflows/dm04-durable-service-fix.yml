name: DM04 Durable-only Startup Fix

on:
  push:
    branches:
      - plan/download-manager-reliability
    paths:
      - .github/workflows/dm04-durable-service-fix.yml

permissions:
  contents: write

jobs:
  implement-startup-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          git reset --hard HEAD
      - name: Gate JobStore-only recovery on renderable presentation metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/core/services/download_service.dart')
          text = path.read_text()
          old = '''      final metadata = metadataById[job.taskId];
      final task =
          job.restoreTaskSnapshot() ??
          _downloadTaskFromMetadataSnapshot(metadata);
      if (task == null) {
        await _jobStore.checkpoint(
          taskId: job.taskId,
          trackingUrl: job.trackingUrl,
          state: DownloadJobState.orphaned,
          durableBytes: job.durableBytes,
          durableByteProvenance: job.durableByteProvenance,
          expectedBytes: job.expectedBytes,
          userPaused: job.userPaused,
          queueWaiting: false,
          fingerprint: job.fingerprint,
        );
        diagnosticLog.record('recovery.orphanedMissingDescriptor', {
          'taskId': job.taskId,
          'source': 'jobStore',
        });
        continue;
      }
      final progress = job.expectedBytes > 0
          ? (job.durableBytes / job.expectedBytes).clamp(0.0, 1.0).toDouble()
          : downloadMetadataProgress(metadata);
      durableRecords.add(
        TaskRecord(task, TaskStatus.paused, progress, job.expectedBytes),
      );
'''
          new = '''      final metadata = metadataById[job.taskId];
      final task =
          job.restoreTaskSnapshot() ??
          _downloadTaskFromMetadataSnapshot(metadata);
      final disposition = planDurableOnlyRecoveryDisposition(
        hasPresentationMetadata: metadata?['item'] is Map,
        hasRecoverableTaskDescriptor: task != null,
      );
      if (disposition == DownloadDurableOnlyRecoveryDisposition.orphan) {
        await _jobStore.checkpoint(
          taskId: job.taskId,
          trackingUrl: job.trackingUrl,
          state: DownloadJobState.orphaned,
          durableBytes: job.durableBytes,
          durableByteProvenance: job.durableByteProvenance,
          expectedBytes: job.expectedBytes,
          userPaused: job.userPaused,
          queueWaiting: false,
          fingerprint: job.fingerprint,
        );
        diagnosticLog.record(
          metadata?['item'] is! Map
              ? 'recovery.orphanedMissingPresentation'
              : 'recovery.orphanedMissingDescriptor',
          {
            'taskId': job.taskId,
            'source': 'jobStore',
          },
        );
        continue;
      }
      final recoverableTask = task!;
      final progress = job.expectedBytes > 0
          ? (job.durableBytes / job.expectedBytes).clamp(0.0, 1.0).toDouble()
          : downloadMetadataProgress(metadata);
      durableRecords.add(
        TaskRecord(
          recoverableTask,
          TaskStatus.paused,
          progress,
          job.expectedBytes,
        ),
      );
'''
          if old not in text:
              raise SystemExit('durable-only startup block not found or already changed')
          if text.count(old) != 1:
              raise SystemExit(f'expected one startup block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          dart format lib/core/services/download_service.dart
      - name: Run DM-04 recovery regressions
        run: |
          tests=(
            test/core/services/download_durable_only_recovery_test.dart
            test/core/services/download_recovery_inventory_test.dart
            test/core/services/download_recovery_snapshot_test.dart
            test/core/services/download_startup_reconciliation_matrix_test.dart
            test/core/services/download_recovery_fault_injection_test.dart
          )
          selected=()
          for test_file in "${tests[@]}"; do
            if [ -f "$test_file" ]; then
              selected+=("$test_file")
            fi
          done
          test "${#selected[@]}" -ge 4
          flutter test "${selected[@]}" --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Verify scoped diff
        run: |
          git diff --check
          test "$(git diff --name-only)" = "lib/core/services/download_service.dart"
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/services/download_service.dart
          git commit -m "fix(downloads): orphan hidden durable-only jobs"
          git push origin HEAD:plan/download-manager-reliability
