name: Guarded DM-04 durable recovery v2

on:
  push:
    branches: [plan/download-manager-reliability]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guarded-dm04-durable-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check guard marker
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -Fq '[dm04-durable-applied]'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: subosito/flutter-action@v2
        if: steps.guard.outputs.skip != 'true'
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Apply durable recovery patch
        if: steps.guard.outputs.skip != 'true'
        run: python3 .github/scripts/apply_dm04_durable.py
      - name: Format and generate
        if: steps.guard.outputs.skip != 'true'
        run: |
          dart format lib/core/services/download_job_state.dart lib/core/services/download_job_store.dart lib/core/storage/storage_service.dart lib/core/services/download_service.dart test/core/services/download_recovery_inventory_test.dart test/core/services/download_recovery_snapshot_test.dart
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Targeted DM-04 tests
        if: steps.guard.outputs.skip != 'true'
        run: |
          flutter test test/core/services/download_recovery_inventory_test.dart test/core/services/download_recovery_snapshot_test.dart
          flutter test test/core/services/download_recovery_fault_injection_test.dart test/core/services/download_startup_reconciliation_matrix_test.dart
      - name: Analyze
        if: steps.guard.outputs.skip != 'true'
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Verify diff
        if: steps.guard.outputs.skip != 'true'
        run: git diff --check
      - name: Commit and push
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name 'Fares669'
          git config user.email '108722956+Fares669@users.noreply.github.com'
          git add lib/core/services/download_job_state.dart lib/core/services/download_job_store.dart lib/core/storage/storage_service.dart lib/core/services/download_service.dart .github/workflows/dm04-verifier.yml
          if git diff --cached --quiet; then
            echo 'No implementation diff to commit'
            exit 1
          fi
          git commit -m 'fix(downloads): recover durable-only startup state [dm04-durable-applied]'
          git push origin HEAD:plan/download-manager-reliability
