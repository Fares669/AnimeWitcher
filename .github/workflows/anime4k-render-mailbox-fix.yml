name: Anime4K Render Mailbox Fix

on:
  push:
    branches:
      - feat/anime4k-ios-performance
    paths:
      - .github/workflows/anime4k-render-mailbox-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/anime4k-ios-performance
          fetch-depth: 0

      - name: RED - expose overlapping async render scheduling
        shell: bash
        run: |
          python3 scripts/apply_anime4k_mailbox_fix.py red
          set +e
          ruby scripts/test_anime4k_media_kit_patch.rb > /tmp/anime4k-mailbox-red.log 2>&1
          status=$?
          set -e
          cat /tmp/anime4k-mailbox-red.log
          test "$status" -ne 0
          grep -q 'async Anime4K render must gate one publication at a time' /tmp/anime4k-mailbox-red.log

      - name: GREEN - coalesce async render updates
        run: |
          python3 scripts/apply_anime4k_mailbox_fix.py green
          ruby scripts/test_anime4k_media_kit_patch.rb

      - name: Verify native Anime4K contracts
        run: |
          swiftc \
            -framework CoreVideo \
            -framework Metal \
            -framework MetalFX \
            native/anime4k_metal/Anime4KMetalShader.swift \
            native/anime4k_metal/Anime4KMetalTelemetry.swift \
            native/anime4k_metal/Anime4KMetalFXScaler.swift \
            native/anime4k_metal/Anime4KMetalRuntime.swift \
            native/anime4k_metal/Anime4KMediaKitBridge.swift \
            native/anime4k_metal/Anime4KMetalRuntimeTests.swift \
            -o /tmp/anime4k_metal_runtime_tests
          /tmp/anime4k_metal_runtime_tests
          swiftc \
            -framework CoreVideo \
            -framework Metal \
            -framework MetalFX \
            native/anime4k_metal/Anime4KMetalShader.swift \
            native/anime4k_metal/Anime4KMetalTelemetry.swift \
            native/anime4k_metal/Anime4KMetalFXScaler.swift \
            native/anime4k_metal/Anime4KMetalRuntime.swift \
            native/anime4k_metal/Anime4KMediaKitBridge.swift \
            native/anime4k_metal/Anime4KMediaKitBridgeTests.swift \
            -o /tmp/anime4k_media_kit_bridge_tests
          /tmp/anime4k_media_kit_bridge_tests

      - name: Commit verified mailbox fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/anime4k_media_kit_patch.rb scripts/test_anime4k_media_kit_patch.rb
          git diff --cached --check
          git commit -m 'fix: coalesce Anime4K render updates during Metal work'
          git push origin HEAD:feat/anime4k-ios-performance
