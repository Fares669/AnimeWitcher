name: Flutter Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          rm -f pubspec.lock
          flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos 2>&1 | tee analyze_log.txt

      - name: Report Analyze Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = 'No log captured';
            try {
              log = fs.readFileSync('analyze_log.txt', 'utf8');
            } catch (e) {
              log = 'Error reading log: ' + e;
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '### Flutter Analyze Failure Log\n```\n' + log.slice(-3000) + '\n```'
            });

      - name: Test
        run: flutter test --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key 2>&1 | tee test_log.txt

      - name: Report Test Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = 'No log captured';
            try {
              log = fs.readFileSync('test_log.txt', 'utf8');
            } catch (e) {
              log = 'Error reading log: ' + e;
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '### Flutter Test Failure Log\n```\n' + log.slice(-3000) + '\n```'
            });
