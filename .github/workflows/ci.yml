name: Flutter Checks

on:
  pull_request:
    branches: [main, feat/manga-manhwa]
  push:
    branches: [main, fix/download-manager-performance-v2]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    if: >-
      github.event.head_commit.message != 'chore: purge obsolete workflow history'
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        # Existing warnings and infos remain visible in the log, but only
        # analyzer errors block this first enforcement step. Warnings can be
        # reduced safely in dedicated cleanup PRs rather than masking real
        # build/test regressions behind a large baseline migration.
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Focused V2 tests
        # Keep the V2 architecture/reliability gate visible independently from
        # the repository-wide baseline so a known unrelated suite failure can
        # never hide a new download-manager regression.
        run: flutter test test/core/services/download_v2

      - name: Test
        # A mock Firestore client test exercises the configured REST path. This
        # harmless value satisfies its build-time configuration guard; it is
        # never sent to an external service by the test suite.
        run: flutter test --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

  ios-v2-build:
    if: >-
      github.event.head_commit.message != 'chore: purge obsolete workflow history'
    name: Build iOS V2 and retain log
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS without code signing
        shell: bash
        run: |
          set -o pipefail
          flutter build ios --debug --no-codesign \
            --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key \
            2>&1 | tee ios-v2-build.log

      - name: Upload iOS build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-v2-build-log-${{ github.run_attempt }}
          path: ios-v2-build.log
          if-no-files-found: warn
          retention-days: 14

  native-log-typecheck:
    if: >-
      github.event.head_commit.message != 'chore: purge obsolete workflow history'
    name: Typecheck native download logger
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Typecheck the production Foundation logger
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          source = Path('ios/Runner/DownloadNativeWaitingQueue.swift').read_text()
          logger = source[source.index('enum DownloadNativeDiagnosticLog'):source.index('import ObjectiveC')]
          stub = 'enum DownloadNativeWaitingQueue { static func taskId(from task: URLSessionTask) -> String? { nil } }'
          Path('/tmp/download-log.swift').write_text('import Foundation\n' + logger + stub)
          PYCODE
          swiftc -typecheck /tmp/download-log.swift

  cleanup-obsolete-workflows:
    name: Clean obsolete workflow history
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'chore: purge obsolete workflow history'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const keepPaths = new Set([
              '.github/workflows/ci.yml',
              '.github/workflows/preview.yml',
              '.github/workflows/release.yml',
            ]);
            const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
            async function call(operation) {
              for (let attempt = 0; ; attempt++) {
                try { return await operation(); }
                catch (error) {
                  const headers = error.response?.headers || {};
                  const limited = [403, 429].includes(error.status) &&
                    (headers['x-ratelimit-remaining'] === '0' ||
                     headers['retry-after'] ||
                     /rate limit/i.test(error.message));
                  if (!limited || attempt >= 6) throw error;
                  const reset = Number(headers['x-ratelimit-reset'] || 0) * 1000;
                  const wait = headers['x-ratelimit-remaining'] === '0'
                    ? Math.max(60000, reset - Date.now() + 5000)
                    : Math.max(60000, Number(headers['retry-after'] || 60) * 1000);
                  core.info('Rate limit reached; waiting ' + Math.ceil(wait / 1000) + ' seconds.');
                  await pause(wait);
                }
              }
            }
            const workflows = await call(() => github.paginate(
              github.rest.actions.listRepoWorkflows, { owner, repo, per_page: 100 }));
            const kept = workflows.filter(w => keepPaths.has(w.path));
            if (kept.length !== 3 || new Set(kept.map(w => w.path)).size !== 3)
              throw new Error('Expected exactly the three principal workflows; refusing cleanup.');
            const keepIds = new Set(kept.map(w => w.id));
            const old = workflows.filter(w => !keepIds.has(w.id));
            const runs = await call(() => github.paginate(
              github.rest.actions.listWorkflowRunsForRepo, { owner, repo, per_page: 100 }));
            const targets = runs.filter(run => !keepIds.has(run.workflow_id));
            if (targets.some(run => run.id === context.runId))
              throw new Error('Current cleanup run must be preserved.');
            core.info('Keeping: ' + kept.map(w => w.name).join(', '));
            core.info('Cleaning ' + old.length + ' workflows and ' + targets.length + ' runs.');
            for (const workflow of old) {
              if (workflow.state === 'disabled_manually') continue;
              await call(() => github.rest.actions.disableWorkflow({
                owner, repo, workflow_id: workflow.id }));
              await pause(1000);
            }
            let deleted = 0;
            for (const run of targets) {
              if (run.status !== 'completed') {
                const current = await call(() => github.rest.actions.getWorkflowRun({
                  owner, repo, run_id: run.id }));
                if (current.data.status !== 'completed') {
                  await call(() => github.rest.actions.cancelWorkflowRun({
                    owner, repo, run_id: run.id }));
                  let complete = false;
                  for (let i = 0; i < 40; i++) {
                    await pause(3000);
                    const latest = await call(() => github.rest.actions.getWorkflowRun({
                      owner, repo, run_id: run.id }));
                    if (latest.data.status === 'completed') { complete = true; break; }
                  }
                  if (!complete) throw new Error('Run did not finish cancelling: ' + run.id);
                }
              }
              await call(() => github.rest.actions.deleteWorkflowRun({
                owner, repo, run_id: run.id }));
              deleted++;
              if (deleted % 50 === 0) core.info('Deleted ' + deleted + '/' + targets.length);
              await pause(1000);
            }
            const remaining = await call(() => github.paginate(
              github.rest.actions.listWorkflowRunsForRepo, { owner, repo, per_page: 100 }));
            const unexpected = remaining.filter(run => !keepIds.has(run.workflow_id));
            if (unexpected.length) throw new Error('Obsolete runs remain: ' + unexpected.length);
            core.info('Verified: no workflow runs remain outside the three principal workflows.');
            await core.summary.addHeading('Workflow cleanup complete')
              .addRaw('Disabled ' + old.length + ' obsolete workflows and deleted ' + deleted + ' runs.')
              .addList(kept.map(w => w.name + ' (' + w.path + ')'))
              .write();

      - name: Restore original CI configuration
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const path = '.github/workflows/ci.yml';
            const original = await github.rest.repos.getContent({
              owner, repo, path, ref: '1c1045d6c910cd57093c51aa7e6fc232acb9684a' });
            if (original.data.sha !== 'a60a18cf615726409ca9bcfebfc47ba6877a6b0a')
              throw new Error('Original CI does not match the verified baseline.');
            const current = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
            if (current.data.sha === original.data.sha) {
              core.info('CI has already been restored.');
              return;
            }
            const installed = await github.rest.repos.getContent({
              owner, repo, path, ref: context.sha });
            if (current.data.sha !== installed.data.sha)
              throw new Error('CI changed during cleanup; refusing to overwrite concurrent edits.');
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch: 'main', sha: current.data.sha,
              content: original.data.content,
              message: 'chore: restore CI after authorized workflow cleanup' });
            core.info('Restored ci.yml exactly to its original content.');
