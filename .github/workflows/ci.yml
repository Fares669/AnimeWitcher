name: Flutter Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          rm -f pubspec.lock
          flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos > analyze_log.txt 2>&1 || {
            echo "### Flutter Analyze Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat analyze_log.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat analyze_log.txt
            exit 1
          }
          cat analyze_log.txt

      - name: Test
        run: |
          flutter test --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key > test_log.txt 2>&1 || {
            echo "### Flutter Test Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat test_log.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat test_log.txt
            exit 1
          }
          cat test_log.txt
