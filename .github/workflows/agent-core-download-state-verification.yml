name: Agent DM10 Generation And Ack Fencing

# Re-run after aligning startup pause projection guards with JobStore authority.
on:
  push:
    branches: [plan/download-manager-reliability]
    paths: [.github/workflows/agent-core-download-state-verification.yml]

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Prepare
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          git reset --hard HEAD
      - name: Confirm DM-10 RED
        run: |
          set +e
          flutter test \
            test/core/services/download_callback_generation_test.dart \
            --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "DM-10 RED unexpectedly passed before the production fix"
            exit 1
          fi
          echo "DM-10 RED reproduced as expected"
      - name: Apply DM-10 minimal generation and acknowledgement fix
        run: |
          python3 .github/scripts/dm10_generation_ack_patch.py
          dart format \
            lib/core/services/download_job_store.dart \
            lib/core/services/download_service.dart \
            test/core/services/download_callback_generation_test.dart
      - name: Verify DM-10 and adjacent regressions
        run: |
          set -o pipefail
          flutter test \
            test/core/services/download_callback_generation_test.dart \
            test/core/services/download_job_store_test.dart \
            test/core/services/download_pause_settlement_guard_test.dart \
            test/core/services/download_cancel_checkpoint_guard_test.dart \
            test/core/services/download_cancel_ownership_guard_test.dart \
            test/core/services/download_cancel_settlement_test.dart \
            test/core/services/download_runtime_ownership_test.dart \
            test/core/services/download_control_outcome_guard_test.dart \
            test/core/services/download_source_refresh_checkpoint_guard_test.dart \
            test/core/services/download_source_refresh_integrity_test.dart \
            test/core/services/download_resource_identity_service_guard_test.dart \
            test/core/services/download_resource_identity_test.dart \
            test/core/services/download_recovery_reconciliation_guard_test.dart \
            --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key 2>&1 | tee /tmp/dm10-test.log
      - name: Upload DM-10 test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dm10-test-diagnostics
          path: /tmp/dm10-test.log
          if-no-files-found: ignore
          retention-days: 1
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Mark complete and push
        run: |
          python3 .github/scripts/dm10_mark_complete.py
          rm -f .github/workflows/agent-core-download-state-verification.yml
          rm -f .github/scripts/dm10_generation_ack_patch.py
          rm -f .github/scripts/dm10_mark_complete.py
          git add -A
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(downloads): fence control callbacks by generation and ownership"
          git push origin HEAD:plan/download-manager-reliability
