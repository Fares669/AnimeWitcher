name: Fix Task 22 Control Routing
on:
  push:
    branches:
      - refactor/background-downloader-authority
    paths:
      - .github/fix_task22_control_routing.py
permissions:
  contents: write
jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/background-downloader-authority
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - run: flutter pub get
      - name: Apply guarded fix
        run: python .github/fix_task22_control_routing.py
      - name: Format changed Dart
        run: dart format lib/core/services/download_transport_policy.dart lib/core/services/download_service.dart test/core/services/download_plugin_parallel_cancel_routing_test.dart
      - name: Run focused ownership/control tests
        run: |
          flutter test \
            test/core/services/download_plugin_parallel_cancel_routing_test.dart \
            test/core/services/download_cancel_ownership_guard_test.dart \
            test/core/services/download_pause_settlement_guard_test.dart \
            test/core/services/download_runtime_ownership_test.dart \
            test/core/services/download_transport_policy_test.dart \
            test/core/services/download_plugin_parallel_execution_test.dart
      - name: Generate sources
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Remove one-shot files
        run: |
          rm .github/fix_task22_control_routing.py
          rm .github/workflows/fix-task22-control-routing.yml
          rm .github/workflows/task22-red.yml
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/services/download_transport_policy.dart lib/core/services/download_service.dart test/core/services/download_plugin_parallel_cancel_routing_test.dart .github
          git diff --cached --check
          git commit -m "fix(downloads): route parallel controls by executor ownership"
          git push origin HEAD:refactor/background-downloader-authority
