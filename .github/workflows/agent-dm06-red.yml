name: Agent DM16 Historical Progress Recovery

on:
  push:
    branches: [plan/download-manager-reliability]
    paths: [.github/workflows/agent-dm06-red.yml]

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Prepare
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          git reset --hard HEAD
      - name: Confirm DM-16 RED
        run: |
          set +e
          flutter test \
            test/core/services/download_zero_restart_invariant_test.dart \
            test/core/services/download_historical_progress_recovery_test.dart \
            --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "DM-16 RED unexpectedly passed before the production fix"
            exit 1
          fi
          echo "DM-16 RED reproduced as expected"
      - name: Apply DM-16 minimal fix
        run: |
          python3 .github/scripts/agent_dm16_legacy_resume_test_patch.py
          python3 .github/scripts/agent_dm16_progress_evidence_patch.py
          dart format \
            lib/core/utils/download_resume.dart \
            lib/core/services/download_service.dart \
            test/core/utils/download_resume_test.dart
      - name: Verify DM-16 and regressions
        run: |
          flutter test \
            test/core/services/download_zero_restart_invariant_test.dart \
            test/core/services/download_historical_progress_recovery_test.dart \
            test/core/utils/download_resume_test.dart \
            test/core/services/download_recovery_reconciliation_guard_test.dart \
            test/core/services/download_durable_byte_contract_guard_test.dart \
            test/core/services/download_durable_byte_provenance_guard_test.dart \
            test/core/services/download_resource_identity_guard_test.dart \
            test/core/services/download_resource_identity_test.dart \
            test/core/services/download_runtime_ownership_test.dart \
            --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Mark complete and push
        run: |
          python3 .github/scripts/dm16_mark_complete.py
          rm -f .github/workflows/agent-dm06-red.yml
          rm -f .github/scripts/agent_dm16_legacy_resume_test_patch.py
          rm -f .github/scripts/agent_dm16_progress_evidence_patch.py
          rm -f .github/scripts/dm16_mark_complete.py
          git add -A
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(downloads): separate historical progress from recovery evidence"
          git push origin HEAD:plan/download-manager-reliability
