name: mpv Windows Runtime

defaults:
  run:
    shell: bash

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mpv-runtime-windows.yml'
      - 'scripts/mpv_runtime/**'
      - 'third_party/mpv/**'
      - 'MPV_UPGRADE_PLAN.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mpv-windows-runtime-${{ github.ref }}
  # These cross builds are long. A documentation or Android commit must not
  # kill an already-valid Windows build in the middle of compilation.
  cancel-in-progress: false

env:
  MPV_VERSION: v0.41.0
  MPV_COMMIT: 41f6a645068483470267271e1d09966ca3b9f413
  BUILDER_COMMIT: e99c86398bbe72fc97e716d25a4f1cc83f6fae4e
  MESON_VERSION: 1.7.2

jobs:
  build-libmpv:
    name: Build mpv 0.41 Windows ${{ matrix.arch }}
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/shinchiro/archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            bit: x86_64
            target: x86_64
          - arch: arm64
            bit: aarch64
            target: aarch64

    steps:
      - name: Checkout AnimeWitcher
        uses: actions/checkout@v5

      - name: Checkout pinned media_kit Windows builder
        uses: actions/checkout@v5
        with:
          repository: media-kit/libmpv-win32-video-cmake
          ref: ${{ env.BUILDER_COMMIT }}
          path: _build/win-builder
          fetch-depth: 1

      - name: Install pinned Meson required by builder
        run: |
          set -euxo pipefail
          python3 -m pip install --break-system-packages "meson==${MESON_VERSION}"
          test "$(meson --version)" = "$MESON_VERSION"

      - name: Pin mpv source to exact 0.41.0 commit
        working-directory: _build/win-builder
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('packages/mpv-release.cmake')
          text = path.read_text()
          anchor = 'ExternalProject_Add(mpv-release'
          if anchor not in text:
              raise SystemExit('mpv-release.cmake layout changed: ExternalProject anchor missing')
          tail = text[text.index(anchor):]
          commit = '41f6a645068483470267271e1d09966ca3b9f413'
          prefix = (
              '# AnimeWitcher reproducibility pin: exact upstream mpv v0.41.0 commit.\n'
              f'set(LINK "https://github.com/mpv-player/mpv/archive/{commit}.tar.gz")\n\n'
          )
          path.write_text(prefix + tail)
          updated = path.read_text()
          if commit not in updated or 'releases/latest' in updated:
              raise SystemExit('failed to replace moving mpv release source with exact commit')
          PY
          grep -F "$MPV_COMMIT" packages/mpv-release.cmake
          ! grep -F 'releases/latest' packages/mpv-release.cmake

      - name: Configure pinned cross toolchain
        working-directory: _build/win-builder
        env:
          BIT: ${{ matrix.bit }}
          TARGET_CPU: ${{ matrix.target }}
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$PWD"
          cmake \
            -DTARGET_ARCH="${TARGET_CPU}-w64-mingw32" \
            -DCOMPILER_TOOLCHAIN=clang \
            -DCMAKE_INSTALL_PREFIX="$PWD/clang_root" \
            -DMINGW_INSTALL_PREFIX="$PWD/build_${BIT}/${BIT}-w64-mingw32" \
            -DSINGLE_SOURCE_LOCATION="$PWD/src_packages" \
            -DRUSTUP_LOCATION="$PWD/clang_root/install_rustup" \
            -DENABLE_CCACHE=ON \
            -DCLANG_PACKAGES_LTO=ON \
            -G Ninja --fresh \
            -B "build_${BIT}" \
            -S "$PWD"

      - name: Bootstrap pinned LLVM MinGW toolchain
        working-directory: _build/win-builder
        env:
          BIT: ${{ matrix.bit }}
        run: |
          set -euxo pipefail
          # media-kit's mpv workflow normally restores clang_root and the
          # architecture toolchain from private/upstream caches. AnimeWitcher
          # must be reproducible on a clean runner, so build the exact targets
          # used by the builder's own llvm_clang workflow before libmpv.
          ninja -C "build_${BIT}" llvm
          ninja -C "build_${BIT}" rustup
          ninja -C "build_${BIT}" llvm-clang
          test -x "$PWD/clang_root/bin/clang"
          test -x "$PWD/clang_root/bin/${{ matrix.target }}-w64-mingw32-gcc"

      - name: Build exact mpv 0.41 libmpv
        working-directory: _build/win-builder
        env:
          BIT: ${{ matrix.bit }}
        run: |
          set -euxo pipefail
          # This is a clean, pinned ExternalProject build. Do not run the
          # builder-wide `download`/`update` helper targets: they include
          # unrelated packages and force-update partially materialized git
          # trees. Building mpv-release directly lets Ninja fetch only its
          # declared dependency graph and keeps all source revisions immutable.
          ninja -C "build_${BIT}" mpv-release

      - name: Verify and stage libmpv runtime
        env:
          BIT: ${{ matrix.bit }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euxo pipefail
          dll="$(find _build/win-builder/build_${BIT} -type f -iname 'libmpv-2.dll' -print -quit)"
          if [[ -z "$dll" ]]; then
            echo 'Pinned builder completed but libmpv-2.dll was not produced.' >&2
            find "_build/win-builder/build_${BIT}" -maxdepth 6 -type f -iname '*mpv*' -print >&2 || true
            exit 2
          fi

          out="$RUNNER_TEMP/mpv-windows-${ARCH}"
          mkdir -p "$out/include/mpv"
          cp "$dll" "$out/libmpv-2.dll"
          cp third_party/mpv/v0.41.0/client.h "$out/include/mpv/client.h"
          cp third_party/mpv/v0.41.0/render.h "$out/include/mpv/render.h"
          cp third_party/mpv/v0.41.0/render_gl.h "$out/include/mpv/render_gl.h"
          cp third_party/mpv/v0.41.0/stream_cb.h "$out/include/mpv/stream_cb.h"

          python3 - "$GITHUB_WORKSPACE" "$ARCH" "$out/libmpv-2.dll" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, sys.argv[1])
          from scripts.mpv_runtime.verify_windows_runtime import verify_dll
          errors = verify_dll(sys.argv[2], Path(sys.argv[3]))
          if errors:
              raise SystemExit('\n'.join(errors))
          print(f"verified {sys.argv[2]} libmpv: {sys.argv[3]}")
          PY

          sha256sum "$out/libmpv-2.dll" | tee "$out/libmpv-2.dll.sha256"
          printf '%s\n' \
            "mpv=$MPV_VERSION" \
            "mpv_commit=$MPV_COMMIT" \
            "builder_commit=$BUILDER_COMMIT" \
            "meson=$MESON_VERSION" \
            "arch=$ARCH" \
            "gpl=false" > "$out/provenance.txt"

      - name: Collect builder logs
        if: always()
        env:
          BIT: ${{ matrix.bit }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/mpv-windows-${{ matrix.arch }}-logs"
          find "_build/win-builder/build_${BIT}" -type f \( -name '*.log' -o -path '*/ffbuild/config.log' \) \
            -exec cp --parents '{}' "$RUNNER_TEMP/mpv-windows-${{ matrix.arch }}-logs"/ \; 2>/dev/null

      - name: Upload verified runtime
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mpv-v0.41.0-windows-${{ matrix.arch }}
          path: ${{ runner.temp }}/mpv-windows-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mpv-v0.41.0-windows-${{ matrix.arch }}-logs
          path: ${{ runner.temp }}/mpv-windows-${{ matrix.arch }}-logs
          if-no-files-found: warn
          retention-days: 3
