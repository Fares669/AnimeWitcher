name: Fix Task 20 Expected Size
on:
  push:
    branches:
      - refactor/background-downloader-authority
    paths:
      - .github/fix_task20_expected_size.py
permissions:
  contents: write
jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/background-downloader-authority
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Apply guarded fix
        run: python .github/fix_task20_expected_size.py
      - name: Format changed Dart
        run: dart format lib/core/utils/download_resume.dart lib/core/services/download_service.dart test/core/services/download_expected_size_authority_test.dart
      - name: Run focused lifecycle and integrity tests
        run: |
          flutter test \
            test/core/services/download_expected_size_authority_test.dart \
            test/core/services/download_pause_settlement_guard_test.dart \
            test/core/services/download_resource_identity_service_guard_test.dart \
            test/core/services/download_source_refresh_integrity_test.dart \
            test/core/services/download_job_store_test.dart
      - name: Generate sources
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Remove one-shot files
        run: |
          rm .github/fix_task20_expected_size.py
          rm .github/workflows/fix-task20-expected-size.yml
          rm .github/workflows/task20-red.yml
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/utils/download_resume.dart lib/core/services/download_service.dart test/core/services/download_expected_size_authority_test.dart .github
          git diff --cached --check
          git commit -m "fix(downloads): keep logical size stable across pause"
          git push origin HEAD:refactor/background-downloader-authority
