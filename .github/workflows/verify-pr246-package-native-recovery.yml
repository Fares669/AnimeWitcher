name: Verify PR246 package-native recovery

on:
  push:
    branches:
      - refactor/background-downloader-authority
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/background-downloader-authority

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply package-native recovery patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label} not found')
              return text.replace(old, new, 1)

          transport_path = Path('lib/core/services/background_downloader_transport.dart')
          transport = transport_path.read_text()
          pause_anchor = '''  @override
          Future<bool> pause(DownloadTask task) async {
          '''
          restart_method = '''  /// Replaces a stale zero-byte package-owned generation with [task].
          ///
          /// background_downloader remains authoritative for cleanup and child task
          /// recreation: cancel settles the old Transfer and clears its pause/resume
          /// state, then Transfers.start creates the new generation from [task].
          Future<bool> restartFromZero(DownloadTask task) async {
            if (!isBackgroundDownloaderTransportTask(task)) return false;
            try {
              final existing = handleFor(task.taskId);
              final wasFinal = existing?.status.isFinalState ?? false;
              final canceled = existing != null
                  ? await existing.cancel()
                  : await _downloader.cancelTaskWithId(task.taskId);
              if (!canceled && !wasFinal) {
                final ownership = await ownershipFor(task.taskId);
                if (ownership.blocksNewWriter) return false;
              }

              if (canceled && existing != null && !wasFinal) {
                try {
                  await existing.result.timeout(const Duration(seconds: 5));
                } catch (_) {
                  return false;
                }
              }

              final settledOwnership = await ownershipFor(task.taskId);
              if (settledOwnership.blocksNewWriter) return false;

              _detach(task.taskId);
              final replacement = await _downloader.transfers.start(task);
              _attach(replacement);
              return runtimeTaskStatusCanOwnWriter(replacement.status) ||
                  replacement.status == TaskStatus.complete;
            } catch (_) {
              return false;
            }
          }

          '''
          transport = replace_once(
              transport,
              pause_anchor,
              restart_method + pause_anchor,
              'transport pause anchor',
          )
          transport_path.write_text(transport)

          service_path = Path('lib/core/services/download_service.dart')
          service = service_path.read_text()

          service = replace_once(
              service,
              '    final liveIds = await _livePartIds();\n',
              '',
              'reconcile liveIds declaration',
          )
          service = replace_once(
              service,
              '        liveIds.contains(record.taskId) ||\n',
              '',
              'reconcile parent-id shortcut',
          )
          reconcile_anchor = '''        !isLiveNativeDownloadStatus(record.status))
              continue;
            final task = record.task as DownloadTask;
          '''
          reconcile_replacement = '''        !isLiveNativeDownloadStatus(record.status))
              continue;
            final ownership = await _runtimeOwnershipFor(record.taskId);
            if (ownership != DownloadRuntimeOwnership.notOwned) continue;
            final task = record.task as DownloadTask;
          '''
          service = replace_once(
              service,
              reconcile_anchor,
              reconcile_replacement,
              'reconcile ownership anchor',
          )

          guard_pattern = re.compile(
              r'''    if \(!legacySessionExists && hasOpaqueNativeResume && partialBytes <= 0\) \{\n.*?      return \(task: task, refreshed: false, restartRequired: true\);\n    \}\n\n''',
              re.S,
          )
          service, count = guard_pattern.subn(
              '''    final restartPluginFromZero =
                !legacySessionExists && partialBytes <= 0;

          ''',
              service,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'zero-byte source guard matches={count}')

          checkpoint_comment = '''    // Source replacement changes executor/manifest identity. Persist an
          '''
          updated_decl = '''    final updated = legacySessionExists
                ? task
                : task.copyWith(
                    url: refreshed.url,
                    headers: Map<String, String>.from(refreshed.headers),
                  );

          '''
          service = replace_once(
              service,
              checkpoint_comment,
              updated_decl + checkpoint_comment,
              'source checkpoint comment',
          )

          checkpoint_start = service.index(checkpoint_comment)
          tail = service[checkpoint_start:]
          tail = replace_once(
              tail,
              '''    final refreshCheckpointed = await _checkpointLogicalJob(
                task,
          ''',
              '''    final refreshCheckpointed = await _checkpointLogicalJob(
                updated,
          ''',
              'source checkpoint task',
          )
          service = service[:checkpoint_start] + tail

          old_updated = '''    final updated = task.copyWith(
              url: refreshed.url,
              headers: Map<String, String>.from(refreshed.headers),
            );
          '''
          service = replace_once(
              service,
              old_updated,
              '',
              'old source update declaration',
          )

          record_anchor = '''    final record = await FileDownloader().database.recordForId(task.taskId);
          '''
          restart_block = '''    if (restartPluginFromZero) {
              final restarted = await _nativeTransport.restartFromZero(updated);
              diagnosticLog.record('source.refreshPluginRestart', {
                'taskId': task.taskId,
                'accepted': restarted,
                'opaqueNativeResume': hasOpaqueNativeResume,
              });
              if (!restarted) {
                return (task: updated, refreshed: true, restartRequired: true);
              }
              return (task: updated, refreshed: true, restartRequired: false);
            }

          '''
          source_tail_start = service.index('    if (legacySessionExists) {', checkpoint_start)
          record_index = service.index(record_anchor, source_tail_start)
          service = service[:record_index] + restart_block + service[record_index:]
          service_path.write_text(service)

          test_path = Path('test/core/services/download_plugin_parallel_device_log_regression_test.dart')
          test_path.write_text('''import 'dart:io';

          import 'package:flutter_test/flutter_test.dart';

          void main() {
            test(
              'zero-byte signed source replacement delegates stale generation cleanup to Transfers',
              () {
                final service = File('lib/core/services/download_service.dart')
                    .readAsStringSync();
                final transport = File(
                  'lib/core/services/background_downloader_transport.dart',
                ).readAsStringSync();

                expect(service, contains('partialBytes <= 0'));
                expect(service, contains('_nativeTransport.restartFromZero(updated)'));
                expect(service, contains('source.refreshPluginRestart'));
                expect(transport, contains('Future<bool> restartFromZero('));
                expect(transport, contains('await existing.cancel()'));
                expect(transport, contains('await existing.result.timeout('));
                expect(transport, contains('_downloader.transfers.start(task)'));
                expect(
                  service,
                  isNot(contains('BackgroundDownloaderCompat.clearResumeStateForTaskIds(')),
                  reason: 'package pause/resume state must be cleaned by background_downloader itself',
                );
              },
            );

            test('parent reconciliation asks the transport for targeted ownership', () {
              final source = File('lib/core/services/download_service.dart')
                  .readAsStringSync();
              expect(
                source,
                contains('final ownership = await _runtimeOwnershipFor(record.taskId);'),
              );
              expect(
                source,
                contains('ownership != DownloadRuntimeOwnership.notOwned'),
              );
              expect(
                source,
                isNot(contains('liveIds.contains(record.taskId)')),
                reason: 'plugin parallel writers use child ids, not the logical parent id',
              );
            });
          }
          ''')
          PY

          dart format \
            lib/core/services/background_downloader_transport.dart \
            lib/core/services/download_service.dart \
            test/core/services/download_plugin_parallel_device_log_regression_test.dart

      - name: Focused tests
        run: |
          flutter test test/core/services/background_downloader_transport_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
          flutter test test/core/services/download_plugin_parallel_device_log_regression_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
          flutter test test/core/services/download_plugin_source_refresh_routing_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
          flutter test test/core/services/download_plugin_relaunch_single_writer_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - uses: actions/upload-artifact@v4
        with:
          name: pr246-package-native-recovery
          path: |
            pubspec.lock
            lib/core/services/background_downloader_transport.dart
            lib/core/services/download_service.dart
            test/core/services/download_plugin_parallel_device_log_regression_test.dart
          if-no-files-found: error
