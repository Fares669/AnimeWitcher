name: Verify PR246 package-native recovery

on:
  push:
    branches:
      - refactor/background-downloader-authority
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/background-downloader-authority
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply package-native recovery patch
        run: |
          python3 .github/scripts/apply_pr246_package_native_recovery.py
          dart format \
            lib/core/services/background_downloader_transport.dart \
            lib/core/services/download_service.dart

      - name: Focused tests
        run: |
          flutter test test/core/services/background_downloader_transport_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
          flutter test test/core/services/download_plugin_parallel_device_log_regression_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
          flutter test test/core/services/download_plugin_source_refresh_routing_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
          flutter test test/core/services/download_plugin_relaunch_single_writer_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Analyze
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-warnings --no-fatal-infos > analyze.log 2>&1
          code=$?
          cat analyze.log
          echo "ANALYZE_EXIT=$code" >> "$GITHUB_ENV"
          exit 0

      - name: Upload analyzer output
        uses: actions/upload-artifact@v4
        with:
          name: pr246-analyze-log
          path: analyze.log
          if-no-files-found: error

      - name: Fail on analyzer errors
        run: test "$ANALYZE_EXIT" = "0"

      - name: Commit verified production patch
        run: |
          if git diff --quiet -- \
            pubspec.lock \
            lib/core/services/background_downloader_transport.dart \
            lib/core/services/download_service.dart; then
            echo 'No production patch remains to publish.'
            exit 0
          fi
          git config user.name 'Fares669'
          git config user.email '108722956+Fares669@users.noreply.github.com'
          git add \
            pubspec.lock \
            lib/core/services/background_downloader_transport.dart \
            lib/core/services/download_service.dart
          git commit -m 'fix(downloads): recover stale plugin parallel sources'
          git push origin HEAD:refactor/background-downloader-authority

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr246-package-native-recovery
          path: |
            pubspec.lock
            lib/core/services/background_downloader_transport.dart
            lib/core/services/download_service.dart
          if-no-files-found: error
