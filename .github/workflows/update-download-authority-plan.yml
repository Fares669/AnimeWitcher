name: Update Download Authority Plan

on:
  push:
    branches:
      - refactor/background-downloader-authority

permissions:
  contents: write

jobs:
  update-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/background-downloader-authority
      - name: Mark only verified plan steps
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('docs/superpowers/plans/2026-09-15-background-downloader-authority.md')
          text = path.read_text()
          complete_tasks = {1,2,3,4,5,6,8,9,10,11,12,15}
          partial_steps = {
              7: {1,2,4,5},
              13: {1,3,4,5},
              17: {4},
          }
          lines = text.splitlines(keepends=True)
          task = None
          step = None
          out = []
          for line in lines:
              task_match = re.match(r'### Task (\d+):', line)
              if task_match:
                  task = int(task_match.group(1))
                  step = None
              step_match = re.match(r'- \[([ x])\] \*\*Step (\d+):', line)
              if step_match:
                  step = int(step_match.group(2))
                  if task in complete_tasks or step in partial_steps.get(task, set()):
                      line = line.replace('- [ ] **Step ', '- [x] **Step ', 1)
              out.append(line)
          path.write_text(''.join(out))
      - name: Remove this one-shot workflow
        run: git rm .github/workflows/update-download-authority-plan.yml
      - name: Commit verified tracking state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/plans/2026-09-15-background-downloader-authority.md .github/workflows/update-download-authority-plan.yml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "docs(downloads): track verified migration progress"
          git push origin HEAD:refactor/background-downloader-authority
