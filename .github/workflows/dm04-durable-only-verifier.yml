name: DM-04 durable-only verifier

on:
  push:
    branches: [plan/download-manager-reliability]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dm04-durable-only-${{ github.ref }}
  cancel-in-progress: true

jobs:
  durable-only-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Run durable-only recovery tests
        run: >-
          flutter test
          test/core/services/download_durable_only_recovery_test.dart
          --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
