name: DM-29 multipart diagnostic

on:
  push:
    branches:
      - plan/download-manager-reliability

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install and generate
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Reproduce candidate migration
        run: |
          git show 04dc8b7c3035691f2627549cf64c0935f263fd04:.github/dm29_slice3.py > /tmp/dm29_slice3.py
          python3 /tmp/dm29_slice3.py
          dart format lib/core/services/persistent_parallel_download.dart test/core/services/persistent_parallel_download_durable_manifest_guard_test.dart

      - name: Capture failing behavioral test
        id: behavior
        shell: bash
        run: |
          set +e
          flutter test test/core/services/persistent_parallel_download_test.dart > /tmp/dm29-behavior.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat /tmp/dm29-behavior.log
          exit 0

      - name: Persist diagnostic and self-clean
        if: always()
        shell: bash
        run: |
          {
            echo '# DM-29 multipart diagnostic'
            echo
            echo "exit_status=${{ steps.behavior.outputs.status }}"
            echo
            echo '```text'
            tail -160 /tmp/dm29-behavior.log 2>/dev/null || true
            echo '```'
          } > DM29_DIAGNOSTIC.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dm29-diagnose.yml
          git add DM29_DIAGNOSTIC.md
          git diff --cached --check || true
          git commit -m "chore: capture DM-29 multipart diagnostic" || exit 0
          git push origin HEAD:plan/download-manager-reliability
