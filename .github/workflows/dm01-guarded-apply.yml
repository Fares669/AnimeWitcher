name: Guarded DM-01 implementation

on:
  push:
    branches:
      - plan/download-manager-reliability

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Apply guarded patch
        run: python3 .github/dm01_patch.py

      - name: Format
        run: dart format lib/core/services/persistent_parallel_download.dart test/core/services/persistent_parallel_download_pending_start_lease_test.dart

      - name: Install and generate
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Focused DM-01 tests
        run: |
          flutter test test/core/services/persistent_parallel_download_pending_start_lease_test.dart
          flutter test test/core/services/persistent_parallel_download_auto_recovery_test.dart
          flutter test test/core/services/persistent_parallel_download_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Guard diff and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dm01-guarded-apply.yml .github/dm01_patch.py
          git add lib/core/services/persistent_parallel_download.dart test/core/services/persistent_parallel_download_pending_start_lease_test.dart
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          row = subprocess.check_output([
              'git', 'diff', '--cached', '--numstat', 'HEAD', '--',
              'lib/core/services/persistent_parallel_download.dart'
          ], text=True).strip()
          added, deleted, _ = row.split('\t')
          added, deleted = int(added), int(deleted)
          print(f'production diff: +{added}/-{deleted}')
          if added > 220 or deleted > 80:
              raise SystemExit('production diff exceeded guarded size')
          PY
          git commit -m "fix: recover stale multipart pending starts"
          git push origin HEAD:plan/download-manager-reliability
