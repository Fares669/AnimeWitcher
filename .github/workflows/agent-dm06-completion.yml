name: Agent DM06 Resource Identity Completion

on:
  push:
    branches: [plan/download-manager-reliability]
    paths: [.github/workflows/agent-dm06-completion.yml]

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Prepare
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          git reset --hard HEAD
      - name: Confirm RED
        shell: bash
        run: |
          set +e
          flutter test test/core/services/download_resource_identity_guard_test.dart test/core/services/download_resource_identity_service_guard_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
          status=$?
          set -e
          test "$status" -ne 0
      - name: Apply fix
        run: |
          python3 .github/scripts/agent_dm06_resource_integrity_patch.py
          python3 .github/scripts/agent_dm06_probe_method_patch.py
          dart format lib/core/services/download_service.dart lib/core/services/download_resource_identity.dart
      - name: Verify
        run: |
          flutter test test/core/services/download_resource_identity_guard_test.dart test/core/services/download_resource_identity_service_guard_test.dart test/core/services/download_resource_identity_test.dart test/core/services/download_source_refresh_integrity_test.dart test/core/services/download_source_refresh_checkpoint_guard_test.dart test/core/services/download_recovery_reconciliation_guard_test.dart test/core/services/download_durable_byte_contract_guard_test.dart test/core/services/download_durable_byte_provenance_guard_test.dart test/core/services/download_job_single_authority_test.dart test/core/services/download_logical_identity_start_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
          flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Commit
        run: |
          python3 .github/scripts/dm06_mark_complete.py
          rm -f .github/workflows/agent-dm06-completion.yml
          git add -A
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(downloads): verify resource identity before completion"
          git push origin HEAD:plan/download-manager-reliability
