name: Anime4K cleanup retry

on:
  push:
    branches:
      - feat/anime4k-ios-performance
    paths:
      - .github/workflows/anime4k-cleanup-retry.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/anime4k-ios-performance
          fetch-depth: 0
      - name: Apply corrected cleanup migration
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/anime4k-cleanup-once.yml').read_text()
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Commit cleanup"
          if start_marker not in workflow or end_marker not in workflow:
              raise SystemExit('could not locate cleanup migration source')
          script = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in script.splitlines()
          ) + '\n'

          bad_regex = r'''sub(runtime, r"\n        case \.metalFXUnavailable:.*?\n            return \"Anime4K MetalFX spatial scaler failed: \\(detail\)\"", '', expected=1, flags=re.S)'''
          fixed_regex = r'''replace(runtime, '        case .metalFXUnavailable:\n            return "Anime4K MetalFX spatial scaler is unavailable"\n        case .metalFXPipeline(let detail):\n            return "Anime4K MetalFX spatial scaler failed: \\(detail)"\n', '', expected=1)'''
          if bad_regex not in script:
              raise SystemExit('expected broken MetalFX error regex was not found')
          script = script.replace(bad_regex, fixed_regex)

          bad_count = r'''replace(media, '                bypassedRuntimeKeys.remove(key)\n', '', expected=1)'''
          fixed_count = r'''replace(media, '                bypassedRuntimeKeys.remove(key)\n', '', expected=2)'''
          if bad_count not in script:
              raise SystemExit('expected duplicate bypass cleanup was not found')
          script = script.replace(bad_count, fixed_count)

          namespace = {'__name__': '__main__'}
          exec(compile(script, '<anime4k-cleanup>', 'exec'), namespace)

          retry = Path('.github/workflows/anime4k-cleanup-retry.yml')
          if retry.exists():
              retry.unlink()
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: simplify Anime4K Apple runtime'
          git push origin HEAD:feat/anime4k-ios-performance
