name: Temporary targeted Anime4K patch

on:
  push:
    branches:
      - feat/anime4k-mobile-gpu

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/anime4k-mobile-gpu
          fetch-depth: 0
      - name: Apply exact player controller patch
        run: python3 tool/_temporary_anime4k_patch.py
      - name: Commit targeted patch and remove helpers
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(player): validate Anime4K dumb mode after shader load"
          git push origin HEAD:feat/anime4k-mobile-gpu
