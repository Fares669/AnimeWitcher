name: DM24 Logical Identity Verifier

on:
  push:
    branches:
      - plan/download-manager-reliability
    paths:
      - test/core/services/download_logical_identity_test.dart
      - .github/workflows/dm24-logical-identity-verifier.yml
  workflow_dispatch:

jobs:
  logical-identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          git reset --hard HEAD
      - name: Run DM24 logical identity regression
        run: >-
          flutter test
          test/core/services/download_logical_identity_test.dart
          --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
