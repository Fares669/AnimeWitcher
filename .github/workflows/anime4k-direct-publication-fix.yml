name: Anime4K Direct Publication Fix

on:
  push:
    branches:
      - feat/anime4k-ios-performance
    paths:
      - .github/workflows/anime4k-direct-publication-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/anime4k-ios-performance
          fetch-depth: 0

      - name: Apply direct media_kit destination patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          runtime_path = Path('native/anime4k_metal/Anime4KMetalRuntime.swift')
          runtime = runtime_path.read_text()
          old_sig = "    func process(\n        pixelBuffer inputBuffer: CVPixelBuffer,\n        completion: @escaping (CVPixelBuffer) -> Void\n    ) -> Anime4KMetalRuntimeSubmission {"
          new_sig = "    func process(\n        pixelBuffer inputBuffer: CVPixelBuffer,\n        destinationPixelBuffer: CVPixelBuffer? = nil,\n        completion: @escaping (CVPixelBuffer) -> Void\n    ) -> Anime4KMetalRuntimeSubmission {"
          runtime = replace_once(runtime, old_sig, new_sig, 'runtime destination parameter')

          alloc_start = runtime.index("        do {\n            var outputBuffer: CVPixelBuffer?")
          alloc_end = runtime.index("            let inputTextureRef", alloc_start)
          allocation = """        do {
              let outputBuffer: CVPixelBuffer
              if let destinationPixelBuffer {
                  guard CVPixelBufferGetWidth(destinationPixelBuffer) == snapshot.configuration.outputWidth,
                        CVPixelBufferGetHeight(destinationPixelBuffer) == snapshot.configuration.outputHeight else {
                      throw Anime4KMetalRuntimeError.invalidDimensions
                  }
                  outputBuffer = destinationPixelBuffer
              } else {
                  var pooledOutputBuffer: CVPixelBuffer?
                  let outputResult = CVPixelBufferPoolCreatePixelBuffer(
                      kCFAllocatorDefault,
                      snapshot.pool,
                      &pooledOutputBuffer
                  )
                  guard outputResult == kCVReturnSuccess, let pooledOutputBuffer else {
                      throw Anime4KMetalRuntimeError.outputBufferCreation(outputResult)
                  }
                  outputBuffer = pooledOutputBuffer
              }

          """
          runtime = runtime[:alloc_start] + allocation + runtime[alloc_end:]
          runtime_path.write_text(runtime)

          bridge_path = Path('native/anime4k_metal/Anime4KMediaKitBridge.swift')
          bridge = bridge_path.read_text()
          old_resources = "    private let device: MTLDevice?\n    private let copyQueue: MTLCommandQueue?\n    private var textureCache: CVMetalTextureCache?\n"
          bridge = replace_once(bridge, old_resources, "    private let device: MTLDevice?\n", 'bridge copy resources')

          init_start = bridge.index('    private init() {')
          init_end = bridge.index('\n\n    func configure(', init_start)
          bridge = bridge[:init_start] + "    private init() {\n        self.device = MTLCreateSystemDefaultDevice()\n    }" + bridge[init_end:]

          start = bridge.index('        let decisionLock = NSLock()')
          end = bridge.index('    private func releasePublication(for key: UInt) {')
          replacement = """        let decisionLock = NSLock()
              var decisionKnown = false
              var accepted = false
              var completedBeforeDecision = false

              let submission = runtime.process(
                  pixelBuffer: pixelBuffer,
                  destinationPixelBuffer: pixelBuffer
              ) { _ in
                  var shouldPublish = false
                  decisionLock.lock()
                  if decisionKnown {
                      shouldPublish = accepted
                  } else {
                      completedBeforeDecision = true
                  }
                  decisionLock.unlock()

                  if shouldPublish {
                      publicationCompletion()
                  }
              }

              decisionLock.lock()
              decisionKnown = true
              accepted = submission == .submitted
              let publishEarlyCompletion = accepted && completedBeforeDecision
              decisionLock.unlock()

              guard accepted else {
                  releasePublication(for: key)
                  return false
              }

              if publishEarlyCompletion {
                  publicationCompletion()
              }
              return true
          }

          """
          bridge = bridge[:start] + replacement + bridge[end:]
          bridge = bridge.replace(
              "/// `Anime4KMetalRuntime` can release a compute slot as soon as its processed\n/// output is ready, while the bridge may still be blitting that output into\n/// media_kit's destination IOSurface. Keeping a second per-player ledger here\n/// prevents those final publishes from allowing the runtime output pool to grow\n/// without bound when the copy/presentation side is slower than compute.",
              "/// The reservation spans the complete asynchronous Metal publication into\n/// media_kit's destination IOSurface. It keeps per-player frame ownership bounded\n/// while Flutter catches up with the texture registry."
          )
          bridge = bridge.replace(
              "        // The reservation spans runtime compute plus the final bridge blit into\n        // media_kit's owned destination. media_kit's existing three-buffer\n        // manager then owns that destination until Flutter consumes it.",
              "        // The runtime final-writes directly into media_kit's owned destination.\n        // The reservation remains held until that command buffer completes."
          )
          bridge_path.write_text(bridge)
          PY

          grep -q 'destinationPixelBuffer:' native/anime4k_metal/Anime4KMetalRuntime.swift
          grep -q 'destinationPixelBuffer: pixelBuffer' native/anime4k_metal/Anime4KMediaKitBridge.swift
          ! grep -q 'copyProcessedFrame(' native/anime4k_metal/Anime4KMediaKitBridge.swift
          ! grep -q 'copyQueue' native/anime4k_metal/Anime4KMediaKitBridge.swift

      - name: Test native Anime4K runtime
        run: |
          swiftc \
            -framework CoreVideo \
            -framework Metal \
            -framework MetalFX \
            native/anime4k_metal/Anime4KMetalShader.swift \
            native/anime4k_metal/Anime4KMetalTelemetry.swift \
            native/anime4k_metal/Anime4KMetalFXScaler.swift \
            native/anime4k_metal/Anime4KMetalRuntime.swift \
            native/anime4k_metal/Anime4KMediaKitBridge.swift \
            native/anime4k_metal/Anime4KMetalRuntimeTests.swift \
            -o /tmp/anime4k_metal_runtime_tests
          /tmp/anime4k_metal_runtime_tests

      - name: Test media_kit bridge
        run: |
          swiftc \
            -framework CoreVideo \
            -framework Metal \
            -framework MetalFX \
            native/anime4k_metal/Anime4KMetalShader.swift \
            native/anime4k_metal/Anime4KMetalTelemetry.swift \
            native/anime4k_metal/Anime4KMetalFXScaler.swift \
            native/anime4k_metal/Anime4KMetalRuntime.swift \
            native/anime4k_metal/Anime4KMediaKitBridge.swift \
            native/anime4k_metal/Anime4KMediaKitBridgeTests.swift \
            -o /tmp/anime4k_media_kit_bridge_tests
          /tmp/anime4k_media_kit_bridge_tests
          ruby scripts/test_anime4k_media_kit_patch.rb

      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/anime4k_metal/Anime4KMetalRuntime.swift native/anime4k_metal/Anime4KMediaKitBridge.swift
          git diff --cached --check
          git commit -m 'perf: publish Anime4K directly into media_kit surface'
          git push origin HEAD:feat/anime4k-ios-performance
