name: Fix iOS Device Regressions

on:
  push:
    branches:
      - refactor/background-downloader-authority
    paths:
      - '.github/fix_ios_device_regressions.py'
      - '.github/workflows/fix-ios-device-regressions.yml'

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/background-downloader-authority
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Apply guarded fix
        run: python3 .github/fix_ios_device_regressions.py
      - name: Format
        run: dart format lib/core/services/download_service.dart test/core/services/download_pause_settlement_guard_test.dart test/core/services/download_plugin_parallel_execution_test.dart
      - name: Generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Run focused regression suite
        run: |
          flutter test \
            test/core/services/download_pause_settlement_guard_test.dart \
            test/core/services/download_plugin_parallel_execution_test.dart \
            test/core/services/download_runtime_ownership_test.dart \
            test/core/services/download_plugin_parallel_contract_test.dart \
            test/core/services/download_cancel_ownership_guard_test.dart
      - name: Analyze touched production code
        run: flutter analyze --no-fatal-warnings --no-fatal-infos lib/core/services/download_service.dart lib/core/services/background_downloader_transport.dart
      - name: Remove temporary workflows and patch script
        run: |
          rm .github/fix_ios_device_regressions.py
          rm .github/workflows/fix-ios-device-regressions.yml
          rm .github/workflows/device-regression-red.yml
      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(downloads): repair plugin parallel pause resume lifecycle'
          git push origin HEAD:refactor/background-downloader-authority
