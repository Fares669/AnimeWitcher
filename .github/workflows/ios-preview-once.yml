name: iOS Preview One Shot

on:
  workflow_dispatch:
  push:
    branches:
      - feat/anime4k-ios-performance
    paths:
      - .github/workflows/ios-preview-once.yml
      - native/anime4k_metal/**
      - scripts/anime4k_*
      - lib/features/player/presentation/player_controller.dart
      - lib/features/player/presentation/player_controller_base.dart
      - ios/Podfile

permissions:
  contents: read

jobs:
  ios:
    name: iOS Preview (Unsigned IPA)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Select Latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Dependencies
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Prepare media_kit iOS Headers
        run: bash scripts/prepare_media_kit_ios_headers.sh
      - name: Generate dart-defines file
        shell: bash
        run: |
          cat > dart-defines.json << 'JSON_EOF'
          {
            "MAL_CLIENT_ID": "${{ secrets.MAL_CLIENT_ID }}",
            "MAL_CLIENT_SECRET": "${{ secrets.MAL_CLIENT_SECRET }}",
            "ANILIST_CLIENT_ID": "${{ secrets.ANILIST_CLIENT_ID }}",
            "ANIMEWITCHER_FIREBASE_PROJECT_ID": "${{ secrets.ANIMEWITCHER_FIREBASE_PROJECT_ID }}",
            "ANIMEWITCHER_FIREBASE_API_KEY": "${{ secrets.ANIMEWITCHER_FIREBASE_API_KEY }}",
            "ANIME4K_METALFX_EXPERIMENT": "true",
            "ANIMEWITCHER_GOOGLE_SERVER_CLIENT_ID": "${{ secrets.ANIMEWITCHER_GOOGLE_SERVER_CLIENT_ID }}",
            "ANIMEWITCHER_GOOGLE_IOS_CLIENT_ID": "${{ secrets.ANIMEWITCHER_GOOGLE_IOS_CLIENT_ID || '296971789988-0ksnaln8k2epsuejesllrr497jnd5if5.apps.googleusercontent.com' }}"
          }
          JSON_EOF
      - name: Configure Google Sign-In for iOS
        env:
          ANIMEWITCHER_GOOGLE_IOS_CLIENT_ID: ${{ secrets.ANIMEWITCHER_GOOGLE_IOS_CLIENT_ID || '296971789988-0ksnaln8k2epsuejesllrr497jnd5if5.apps.googleusercontent.com' }}
          ANIMEWITCHER_GOOGLE_SERVER_CLIENT_ID: ${{ secrets.ANIMEWITCHER_GOOGLE_SERVER_CLIENT_ID }}
        run: bash scripts/configure_ios_google_sign_in.sh
      - name: Build iOS Preview (No Codesign)
        run: flutter build ios --release --no-codesign --dart-define-from-file=dart-defines.json
      - name: Verify Anime4K Metal FFI symbols
        run: |
          binary="build/ios/iphoneos/Runner.app/Frameworks/media_kit_video.framework/media_kit_video"
          test -f "$binary"
          nm -gU "$binary" > /tmp/anime4k-preview-symbols.txt
          for symbol in \
            animewitcher_anime4k_metal_configure \
            animewitcher_anime4k_metal_status \
            animewitcher_anime4k_metal_telemetry \
            animewitcher_anime4k_metal_set_bypass \
            animewitcher_anime4k_metal_disable; do
            grep -Eq "[[:space:]]_${symbol}$" /tmp/anime4k-preview-symbols.txt || {
              echo "missing retained Anime4K C ABI symbol: $symbol" >&2
              exit 1
            }
          done
      - name: Package IPA
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r animewitcher-ios-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: animewitcher-ios-unsigned.ipa
          retention-days: 7
