name: Inspect adaptive parallel download queue

on:
  push:
    branches: [feat/adaptive-parallel-downloads]
    paths:
      - '.github/workflows/parallel-download-patch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/adaptive-parallel-downloads
          fetch-depth: 0
      - name: Apply staged patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/parallel_patch/part*.b64 | base64 --decode > /tmp/apply_parallel_downloads.py
          python3 -m py_compile /tmp/apply_parallel_downloads.py
          python3 /tmp/apply_parallel_downloads.py
      - name: Inspect reservation and enqueue paths
        shell: bash
        run: |
          set -euo pipefail
          echo '===== reservesDownloadSlot ====='
          grep -n -A45 -B10 'bool reservesDownloadSlot' lib/core/services/download_concurrency.dart || true
          echo '===== startDownload queue decision ====='
          grep -n -A260 -B20 'Future<bool> startDownload' lib/core/services/download_service.dart | tail -n 280
          echo '===== helpers using reservesDownloadSlot ====='
          grep -n -B8 -A12 'reservesDownloadSlot' lib/core/services/download_service.dart lib/core/services/download_concurrency.dart || true
          exit 1
