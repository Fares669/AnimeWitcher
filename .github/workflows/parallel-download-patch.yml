name: Inspect adaptive parallel task construction

on:
  push:
    branches: [feat/adaptive-parallel-downloads]
    paths:
      - '.github/workflows/parallel-download-patch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/adaptive-parallel-downloads
          fetch-depth: 0
      - name: Apply staged patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/parallel_patch/part*.b64 | base64 --decode > /tmp/apply_parallel_downloads.py
          python3 /tmp/apply_parallel_downloads.py
      - name: Inspect parallel task use
        shell: bash
        run: |
          set -euo pipefail
          grep -n -A45 -B20 'ParallelDownloadTask' lib/core/services/download_service.dart || true
          echo '===== adaptive helpers ====='
          grep -n -A90 -B10 'adaptiveDownload' lib/core/services/download_service.dart lib/core/services/download_concurrency.dart || true
          grep -n -A90 -B10 'downloadPart' lib/core/services/download_service.dart lib/core/services/download_concurrency.dart || true
          echo '===== metadata/range probe ====='
          grep -n -A140 -B15 'Future<DownloadMetadata?> getMetadata' lib/core/services/download_service.dart || true
          exit 1
