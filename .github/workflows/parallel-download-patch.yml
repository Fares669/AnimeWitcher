name: Inspect adaptive parallel helpers

on:
  push:
    branches: [feat/adaptive-parallel-downloads]
    paths:
      - '.github/workflows/parallel-download-patch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/adaptive-parallel-downloads
          fetch-depth: 0
      - name: Apply staged patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/parallel_patch/part*.b64 | base64 --decode > /tmp/apply_parallel_downloads.py
          python3 /tmp/apply_parallel_downloads.py
      - name: Inspect staged implementation
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --stat
          echo '===== new parallel tests ====='
          cat test/core/services/download_parallel_test.dart
          echo '===== settings additions ====='
          grep -R -n -E 'parallel|parts|chunks|download.*part' lib/core lib/features/settings lib/features/library | head -n 300 || true
          exit 1
