name: Apply adaptive parallel downloads

on:
  push:
    branches: [feat/adaptive-parallel-downloads]
    paths:
      - '.github/workflows/parallel-download-patch.yml'
      - '.github/parallel_patch/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adaptive-parallel-download-patch
  cancel-in-progress: false

jobs:
  apply-verify-commit:
    name: Apply, verify, and commit
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/adaptive-parallel-downloads
          fetch-depth: 0

      - name: Reassemble and validate patch script
        shell: bash
        run: |
          set -euo pipefail
          cat .github/parallel_patch/part*.b64 | base64 --decode > /tmp/apply_parallel_downloads.py
          python3 -m py_compile /tmp/apply_parallel_downloads.py
          python3 /tmp/apply_parallel_downloads.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies and generate sources
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Format changed Dart files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dart_files < <(git status --porcelain | sed -E 's/^.. //' | grep -E '\.dart$' || true)
          if (( ${#dart_files[@]} )); then
            dart format "${dart_files[@]}"
          fi
          git diff --check

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Remove temporary patch staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/parallel_patch
          rm -f .github/workflows/parallel-download-patch.yml
          git diff --check

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No verified changes to commit.' >&2
            exit 1
          fi
          git commit -m 'feat: add adaptive parallel episode downloads'
          git push origin HEAD:feat/adaptive-parallel-downloads
