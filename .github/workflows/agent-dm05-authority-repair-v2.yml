name: Agent DM05 Authority Repair V2

on:
  push:
    branches:
      - plan/download-manager-reliability
    paths:
      - .github/workflows/agent-dm05-authority-repair-v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Prepare
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          git reset --hard HEAD
      - name: Apply repair
        run: python3 .github/scripts/dm05_single_authority_repair.py
      - name: Format
        run: dart format lib/core/services/download_job_state.dart lib/core/services/download_job_store.dart lib/core/services/download_service.dart test/core/services/download_job_single_authority_test.dart
      - name: Focused tests
        run: |
          flutter test \
            test/core/services/download_job_single_authority_test.dart \
            test/core/services/download_job_state_authority_test.dart \
            test/core/services/download_job_state_queue_authority_test.dart \
            test/core/services/download_job_store_test.dart \
            test/core/services/download_recovery_reconciliation_guard_test.dart \
            test/core/services/download_runtime_ownership_test.dart \
            test/features/library/presentation/downloads_job_state_authority_test.dart \
            --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Mark DM-05 complete and push
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('DOWNLOAD_MANAGER_PLAN.md')
          s = p.read_text()
          marker = '- [ ] **DM-05 — Make `DownloadJobState` the sole logical lifecycle authority**'
          done = marker.replace('[ ]', '[x]')
          if marker in s:
              s = s.replace(marker, done, 1)
              next_marker = '- [ ] **DM-24'
              idx = s.find(next_marker, s.find(done))
              if idx < 0:
                  raise SystemExit('DM-24 marker missing')
              notes = '''  - **Implementation notes (2026-09-11):** JobStore schema v6 makes `DownloadJobState` the only durable lifecycle authority. `userPaused` and `queueWaiting` remain compatibility projections derived from state; schema-v5 side flags migrate once into explicit state. Startup recovery ignores stale metadata/plugin replicas whenever a JobStore row exists and recovery UI status is projected from logical state.\n  - **Confirmed root cause:** `_recoverPersistedDownloads()` recomputed pause intent from stale metadata/in-memory flags after JobState-first planning, and JobStore could serialize contradictory side flags. A stale pause replica could therefore override an authoritative running job after relaunch.\n  - **Verification passed:** contradictory-flag migration/write regression, startup recovery authority regression, existing DM-05 state/queue/provider guards, JobStore/recovery/runtime ownership suites, and analyzer.\n\n'''
              s = s[:idx] + notes + s[idx:]
              p.write_text(s)
          elif done not in s:
              raise SystemExit('DM-05 checklist marker missing')
          PY
          rm -f .github/workflows/agent-dm05-authority-repair.yml
          rm -f .github/workflows/agent-dm05-authority-repair-v2.yml
          git add -A
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(downloads): make JobState sole lifecycle authority"
          git push origin HEAD:plan/download-manager-reliability
