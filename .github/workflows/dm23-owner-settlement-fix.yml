name: DM-23 owner settlement GREEN verifier

on:
  push:
    branches:
      - plan/download-manager-reliability
    paths:
      - .github/workflows/dm23-owner-settlement-fix.yml
      - .github/scripts/dm23_owner_settlement_patch.py
      - test/core/services/download_parallel_owner_settlement_guard_test.dart
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dm23-owner-settlement-${{ github.ref }}
  cancel-in-progress: false

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization and generated sources
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Apply DM-23 production patch
        run: python3 .github/scripts/dm23_owner_settlement_patch.py

      - name: Format DM-23 production slice
        run: dart format lib/core/services/persistent_parallel_download.dart

      - name: Check patch whitespace
        run: git diff --check

      - name: Run DM-23 owner settlement guard
        run: |
          flutter test test/core/services/download_parallel_owner_settlement_guard_test.dart \
            --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Run multipart tail recovery regressions
        run: |
          flutter test test/core/services/persistent_parallel_download_tail_recovery_test.dart \
            --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
          flutter test test/core/services/persistent_parallel_download_auto_recovery_test.dart \
            --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
          flutter test test/core/services/download_cancel_ownership_guard_test.dart \
            --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Analyze production slice
        run: dart analyze lib/core/services/persistent_parallel_download.dart

      - name: Materialize verified DM-23 production fix
        env:
          BRANCH: plan/download-manager-reliability
        run: |
          if git diff --quiet -- lib/core/services/persistent_parallel_download.dart; then
            echo 'DM-23 production slice already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/core/services/persistent_parallel_download.dart
          git commit -m 'fix(downloads): fence multipart owner settlement'
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
