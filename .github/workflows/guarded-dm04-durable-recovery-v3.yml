name: Guarded DM-04 durable recovery v3

on:
  push:
    branches: [plan/download-manager-reliability]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guarded-dm04-durable-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check guard marker
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -Fq '[dm04-durable-applied]'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: subosito/flutter-action@v2
        if: steps.guard.outputs.skip != 'true'
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Narrow ambiguous checkpoint transformation
        if: steps.guard.outputs.skip != 'true'
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/apply_dm04_durable.py')
          s = p.read_text()
          old = '''text = replace_once(\n    text,\n    "    bool? queueWaiting,\\n    DownloadResourceFingerprint? fingerprint,\\n    int? updatedAtMillis,\\n",\n    "    bool? queueWaiting,\\n    Map<String, dynamic>? taskSnapshot,\\n    DownloadResourceFingerprint? fingerprint,\\n    int? updatedAtMillis,\\n",\n    "checkpoint snapshot arg",\n)'''
          new = '''checkpoint_start = text.index("  Future<bool> checkpoint({")\ncheckpoint_end = text.index("  /// Start a new execution generation", checkpoint_start)\ncheckpoint_block = text[checkpoint_start:checkpoint_end]\ncheckpoint_block = replace_once(\n    checkpoint_block,\n    "    bool? queueWaiting,\\n    DownloadResourceFingerprint? fingerprint,\\n    int? updatedAtMillis,\\n",\n    "    bool? queueWaiting,\\n    Map<String, dynamic>? taskSnapshot,\\n    DownloadResourceFingerprint? fingerprint,\\n    int? updatedAtMillis,\\n",\n    "checkpoint snapshot arg",\n)\ntext = text[:checkpoint_start] + checkpoint_block + text[checkpoint_end:]'''
          if old not in s:
              raise SystemExit('ambiguous checkpoint transformation not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Apply durable recovery patch
        if: steps.guard.outputs.skip != 'true'
        run: python3 .github/scripts/apply_dm04_durable.py
      - name: Format and generate
        if: steps.guard.outputs.skip != 'true'
        run: |
          dart format lib/core/services/download_job_state.dart lib/core/services/download_job_store.dart lib/core/storage/storage_service.dart lib/core/services/download_service.dart test/core/services/download_recovery_inventory_test.dart test/core/services/download_recovery_snapshot_test.dart
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Targeted DM-04 tests
        if: steps.guard.outputs.skip != 'true'
        run: |
          flutter test test/core/services/download_recovery_inventory_test.dart test/core/services/download_recovery_snapshot_test.dart
          flutter test test/core/services/download_recovery_fault_injection_test.dart test/core/services/download_startup_reconciliation_matrix_test.dart
      - name: Analyze
        if: steps.guard.outputs.skip != 'true'
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Verify diff
        if: steps.guard.outputs.skip != 'true'
        run: git diff --check
      - name: Commit and push
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name 'Fares669'
          git config user.email '108722956+Fares669@users.noreply.github.com'
          git add lib/core/services/download_job_state.dart lib/core/services/download_job_store.dart lib/core/storage/storage_service.dart lib/core/services/download_service.dart .github/workflows/dm04-verifier.yml
          git commit -m 'fix(downloads): recover durable-only startup state [dm04-durable-applied]'
          git push origin HEAD:plan/download-manager-reliability
