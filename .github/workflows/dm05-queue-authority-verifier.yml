name: DM05 Queue Authority Verifier

on:
  push:
    branches:
      - plan/download-manager-reliability
    paths:
      - test/core/services/download_job_state_queue_authority_test.dart
      - lib/core/services/download_job_state.dart
      - lib/core/services/download_service.dart
      - .github/workflows/dm05-queue-authority-verifier.yml
  workflow_dispatch:

jobs:
  queue-authority:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          git reset --hard HEAD
      - name: Run DM05 queue authority regression
        run: >-
          flutter test
          test/core/services/download_job_state_queue_authority_test.dart
          test/core/services/download_concurrency_test.dart
          --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
