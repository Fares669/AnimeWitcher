name: Guarded exact-size completion fix

on:
  push:
    branches: [plan/download-manager-reliability]

permissions:
  contents: write

concurrency:
  group: guarded-exact-size-completion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability
          fetch-depth: 0

      - name: Guard against repeat execution
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -Fq '[exact-size-completion-fixed]'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.guard.outputs.skip != 'true'
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Apply minimal exact-size completion fix
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          resume_path = Path('lib/core/utils/download_resume.dart')
          resume = resume_path.read_text()
          old = "  if (canNativeResume) return DownloadResumeStrategy.nativeResume;\n  if (shouldResumeFromPartialBytes("
          new = "  if (canNativeResume) return DownloadResumeStrategy.nativeResume;\n  // An exact-size durable file is already a completion candidate. It must\n  // stay on the local recovery path instead of being classified as a\n  // zero-byte restart merely because no progress percentage survived.\n  if (existingPartialBytes > 0 &&\n      expectedBytes > 0 &&\n      existingPartialBytes == expectedBytes) {\n    return DownloadResumeStrategy.partialFile;\n  }\n  if (shouldResumeFromPartialBytes("
          if resume.count(old) != 1:
              raise SystemExit(f'download_resume strategy anchor mismatch: {resume.count(old)}')
          resume_path.write_text(resume.replace(old, new, 1))

          service_path = Path('lib/core/services/download_service.dart')
          service = service_path.read_text()
          old = "    final saved = await _savedProgressFor(task);\n    final refreshResult = await _refreshTaskBeforeResume("
          new = "    final saved = await _savedProgressFor(task);\n    if (saved.totalSize > 0 &&\n        saved.partialBytes == saved.totalSize &&\n        await _resumeUsingPartialFile(task)) {\n      return true;\n    }\n    final refreshResult = await _refreshTaskBeforeResume("
          if service.count(old) != 1:
              raise SystemExit(f'resume exact-size insertion anchor mismatch: {service.count(old)}')
          service = service.replace(old, new, 1)

          start = service.index('  Future<bool> _resumeUsingPartialFile(DownloadTask task) async {')
          end = service.index('\n  Future<ParallelDownloadTask?> _parallelParentForInternalPart(', start)
          replacement = """  Future<bool> _resumeUsingPartialFile(DownloadTask task) async {
            final isParallel = task is ParallelDownloadTask;
            if (isParallel) {
              Set<String> livePartIds;
              try {
                livePartIds = await _livePartIds();
              } catch (_) {
                diagnosticLog.record('completion.localArtifactOwnershipUnknown', {
                  'taskId': task.taskId,
                });
                return false;
              }
              if (livePartIds.any((id) => id.startsWith('${task.taskId}.part.'))) {
                diagnosticLog.record('completion.localArtifactOwnedParts', {
                  'taskId': task.taskId,
                });
                return false;
              }
            }

            String destinationPath;
            try {
              destinationPath = await task.filePath();
            } catch (_) {
              return false;
            }
            if (destinationPath.isEmpty) return false;

            final expectedBytes = (await _savedProgressFor(task)).totalSize;
            if (isParallel) {
              final candidate = await findPartialDownloadFile(
                destinationPath: destinationPath,
              );
              if (candidate == null || expectedBytes <= 0) return false;
              int candidateBytes;
              try {
                candidateBytes = await candidate.length();
              } catch (_) {
                return false;
              }
              if (candidateBytes != expectedBytes) return false;
            }

            final partial = await canonicalizePartialDownloadFile(
              destinationPath: destinationPath,
            );
            if (partial == null) return false;
            final existingBytes = partial.bytes;
            if (expectedBytes > 0 && existingBytes == expectedBytes) {
              final checkpointed = await _checkpointLogicalJob(
                task,
                state: DownloadJobState.completed,
                durableBytes: expectedBytes,
                durableByteProvenance:
                    DownloadDurableByteProvenance.verifiedFinalFile,
                expectedBytes: expectedBytes,
                userPaused: false,
                queueWaiting: false,
              );
              if (!checkpointed) return false;

              await FileDownloader().database.updateRecord(
                TaskRecord(task, TaskStatus.complete, 1, expectedBytes),
              );
              diagnosticLog.record('completion.adoptedExactLocalArtifact', {
                'taskId': task.taskId,
                'bytes': expectedBytes,
                'parallel': isParallel,
              });
              _sharedEvents.add(TaskProgressUpdate(task, 1, expectedBytes));
              _sharedEvents.add(TaskStatusUpdate(task, TaskStatus.complete));
              return true;
            }
            if (task is ParallelDownloadTask) return false;
            if (!shouldResumeFromPartialBytes(
              existingPartialBytes: existingBytes,
              expectedBytes: expectedBytes,
            )) {
              return false;
            }

            return _appendRemainingWithDio(
              task,
              dest: partial.file,
              existingBytes: existingBytes,
              expectedBytes: expectedBytes,
            );
          }
          """
          # YAML strips the workflow indentation; remove the extra Python-source
          # indentation that remains inside this triple-quoted Dart replacement.
          lines = replacement.splitlines()
          replacement = '\n'.join(
              line[10:] if i > 0 and line.startswith('          ') else line
              for i, line in enumerate(lines)
          )
          service_path.write_text(service[:start] + replacement + service[end:])
          PY
          dart format lib/core/utils/download_resume.dart lib/core/services/download_service.dart

      - name: Install dependencies and generate sources
        if: steps.guard.outputs.skip != 'true'
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Focused exact-size completion tests
        if: steps.guard.outputs.skip != 'true'
        run: >-
          flutter test
          test/core/services/download_zero_restart_invariant_test.dart
          test/core/services/download_parallel_complete_artifact_guard_test.dart
          --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Analyze
        if: steps.guard.outputs.skip != 'true'
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Verify and commit
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | sort)" = "lib/core/services/download_service.dart
          lib/core/utils/download_resume.dart"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Fares669@users.noreply.github.com'
          git add lib/core/services/download_service.dart lib/core/utils/download_resume.dart
          git commit -m 'fix(downloads): adopt exact-size local completion [exact-size-completion-fixed]'
          git push origin HEAD:plan/download-manager-reliability
