name: Agent Core Download State Verify

on:
  push:
    branches:
      - agent/core-download-state-recovery-dm04-dm16-20260911
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-core-download-state-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-download-state:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: DM-04 recovery union regression
        run: >-
          flutter test
          test/core/services/download_recovery_inventory_test.dart
          test/core/services/download_durable_only_recovery_test.dart
          test/core/services/download_missing_presentation_recovery_test.dart
          test/core/services/download_manifest_startup_inventory_test.dart
          test/core/services/download_recovery_reconciliation_guard_test.dart
          test/core/services/download_recovery_snapshot_test.dart
          test/core/services/download_runtime_ownership_test.dart
          test/core/services/persistent_parallel_download_durable_manifest_guard_test.dart
          test/core/services/persistent_parallel_download_manifest_discovery_test.dart
          test/core/services/persistent_parallel_download_parent_manifest_snapshot_test.dart
          --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
