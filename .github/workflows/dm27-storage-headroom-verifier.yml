name: DM-27 storage headroom verifier

on:
  push:
    branches:
      - plan/download-manager-reliability
    paths:
      - .github/workflows/dm27-storage-headroom-verifier.yml
      - .github/scripts/apply_dm27.py
      - test/core/services/persistent_parallel_download_storage_headroom_test.dart

permissions:
  contents: write

jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: plan/download-manager-reliability

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create bounded filesystem
        run: |
          sudo mkdir -p /mnt/dm27
          sudo mount -t tmpfs -o size=32m tmpfs /mnt/dm27
          sudo chmod 777 /mnt/dm27

      - name: Prove DM-27 RED before implementation
        run: |
          set +e
          DM27_TEST_ROOT=/mnt/dm27 flutter test test/core/services/persistent_parallel_download_storage_headroom_test.dart
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo 'DM-27 behavioral reproduction unexpectedly passed before the fix'
            exit 1
          fi
          rm -rf /mnt/dm27/* || true

      - name: Normalize DM-27 patch against current HEAD
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/apply_dm27.py')
          s = p.read_text()
          old = """dispose_anchor = '    await _updatesController.close();'
          if 'await _parallelFailures.close();' not in d:
              if dispose_anchor not in d:
                  raise SystemExit('download service dispose anchor drift')
              d = d.replace(dispose_anchor, dispose_anchor + '\\n    await _parallelFailures.close();', 1)
          """
          new = """dispose_anchor = '    _disposed = true;'
          if 'unawaited(_parallelFailures.close());' not in d:
              if dispose_anchor not in d:
                  raise SystemExit('download service dispose anchor drift')
              d = d.replace(dispose_anchor, dispose_anchor + '\\n    unawaited(_parallelFailures.close());', 1)
          """
          if old not in s:
              raise SystemExit('DM-27 dispose patch-shim drift')
          s = s.replace(old, new, 1)
          old_headroom = """        final remaining = session.size - assembledBytes;
                  if (!await _hasAssemblyHeadroom(
                    session,
                    target,
                    remainingBytes: remaining,
                  )) {"""
          new_headroom = """        if (!await _hasAssemblyHeadroom(
                    session,
                    target,
                    remainingBytes: 0,
                  )) {"""
          if old_headroom not in s:
              raise SystemExit('DM-27 recheck accounting shim drift')
          s = s.replace(old_headroom, new_headroom, 1)
          nullable_fixes = {
              '          await output.close();': '          await output!.close();',
              '          await output.writeFrom(bytes);': '          await output!.writeFrom(bytes);',
              '      await output.flush();': '      await output!.flush();',
          }
          for old_call, new_call in nullable_fixes.items():
              if old_call not in s:
                  raise SystemExit(f'DM-27 nullable output shim drift: {old_call}')
              s = s.replace(old_call, new_call, 1)
          p.write_text(s)
          PY

      - name: Apply DM-27 implementation
        run: |
          python3 .github/scripts/apply_dm27.py
          dart format lib/core/services/persistent_parallel_download.dart lib/core/services/download_service.dart test/core/services/persistent_parallel_download_storage_headroom_test.dart
          flutter pub get

      - name: Verify DM-27 behavior and regressions
        env:
          DM27_TEST_ROOT: /mnt/dm27
        run: |
          rm -rf /mnt/dm27/* || true
          flutter test test/core/services/persistent_parallel_download_storage_headroom_test.dart
          flutter test test/core/services/persistent_parallel_download_test.dart
          flutter test test/core/services/persistent_parallel_download_auto_recovery_test.dart
          flutter test test/core/services/persistent_parallel_download_durable_manifest_guard_test.dart
          flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Mark DM-27 verified and commit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('DOWNLOAD_MANAGER_PLAN.md')
          s = p.read_text()
          old = '- [ ] **DM-27 — Add storage-headroom policy for multipart download and assembly**'
          new = '- [x] **DM-27 — Add storage-headroom policy for multipart download and assembly**'
          if old not in s:
              raise SystemExit('DM-27 checklist anchor missing or already complete')
          s = s.replace(old, new, 1)
          dep = '  - **Dependencies:** DM-03, DM-06.\n'
          note = '  - **Implementation notes (2026-09-12):** Multipart assembly preflights destination-volume capacity for the full staging allocation, re-evaluates the reserved safety margin while writing, and safely handles ENOSPC/EDQUOT races. Storage exhaustion emits typed `ParallelAssemblyFailureReason.insufficientStorage`, removes only incomplete staging, pauses the logical parent, and retains every verified Range for zero-redownload assembly retry. DownloadService exposes the typed failure stream for UI projection.\n  - **Verification passed:** Bounded-filesystem behavior was confirmed RED before the fix, then GREEN with verified parts preserved, typed `insufficientStorage`, no premature completion, and successful assembly after space is freed without another Range. Focused multipart regressions and analyzer also passed.\n'
          marker = s.find(new)
          dep_at = s.find(dep, marker)
          if dep_at < 0:
              raise SystemExit('DM-27 dependency anchor drift')
          insert_at = dep_at + len(dep)
          s = s[:insert_at] + note + s[insert_at:]
          p.write_text(s)
          PY
          git config user.name 'openai-download-agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.yaml pubspec.lock lib/core/services/persistent_parallel_download.dart lib/core/services/download_service.dart test/core/services/persistent_parallel_download_storage_headroom_test.dart DOWNLOAD_MANAGER_PLAN.md
          git rm .github/scripts/apply_dm27.py .github/workflows/dm27-storage-headroom-verifier.yml
          git commit -m 'fix(download): preserve multipart parts on storage exhaustion (DM-27)'
          git push origin HEAD:plan/download-manager-reliability
