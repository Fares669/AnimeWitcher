name: Agent DM09 Network Hold GREEN

on:
  push:
    branches: [plan/download-manager-reliability]
    paths:
      - .github/workflows/agent-dm09-network-hold.yml
      - .github/scripts/dm09_patch_repair.py

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Prepare
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          git reset --hard HEAD
      - name: Reproduce DM-09 RED
        run: |
          set +e
          flutter test \
            test/core/services/download_network_state_red_test.dart \
            --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key 2>&1 | tee /tmp/dm09-red.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            echo 'DM-09 unexpectedly GREEN before implementation' >&2
            exit 1
          fi
          if grep -qE 'Undefined name|Compilation failed|Failed to load' /tmp/dm09-red.log; then
            echo 'DM-09 RED must be behavioral, not a compile failure' >&2
            exit 1
          fi
          echo 'DM-09 behavioral RED reproduced as expected'
      - name: Apply DM-09 network hold policy
        run: |
          set -o pipefail
          {
            echo '== repair patch script =='
            python3 .github/scripts/dm09_patch_repair.py
            echo '== apply network hold patch =='
            python3 .github/scripts/dm09_network_hold_patch.py
            echo '== format patched files =='
            dart format \
              lib/core/services/download_retry_policy.dart \
              lib/core/services/download_job_state.dart \
              lib/core/services/download_range_transfer.dart \
              lib/core/services/download_service.dart \
              test/core/services/download_retry_policy_test.dart \
              test/core/services/download_network_state_red_test.dart
            echo '== diff check =='
            git diff --check
          } 2>&1 | tee /tmp/dm09-apply.log
      - name: Verify DM-09 and adjacent regressions
        run: |
          set -o pipefail
          flutter test \
            test/core/services/download_network_state_red_test.dart \
            test/core/services/download_retry_policy_test.dart \
            test/core/services/download_job_state_test.dart \
            test/core/services/download_job_store_test.dart \
            test/core/services/download_command_outcome_test.dart \
            test/core/services/download_range_transfer_test.dart \
            test/core/services/download_range_fast_fail_policy_test.dart \
            test/core/services/download_range_checkpoint_backpressure_test.dart \
            test/core/services/download_parallel_test.dart \
            test/core/services/persistent_parallel_download_auto_recovery_test.dart \
            test/core/services/download_runtime_ownership_test.dart \
            test/core/services/download_callback_generation_test.dart \
            test/core/services/download_recovery_reconciliation_guard_test.dart \
            test/core/services/download_startup_reconciliation_matrix_test.dart \
            test/core/services/download_service_queue_test.dart \
            test/core/services/download_job_state_queue_authority_test.dart \
            --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key 2>&1 | tee /tmp/dm09-test.log
      - name: Upload DM-09 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dm09-test-diagnostics
          path: |
            /tmp/dm09-red.log
            /tmp/dm09-apply.log
            /tmp/dm09-test.log
          if-no-files-found: ignore
          retention-days: 1
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Mark DM-09 complete and push
        run: |
          python3 .github/scripts/dm09_mark_complete.py
          rm -f .github/workflows/agent-dm09-network-hold.yml
          rm -f .github/scripts/dm09_network_hold_patch.py
          rm -f .github/scripts/dm09_patch_repair.py
          rm -f .github/scripts/dm09_mark_complete.py
          git add -A
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(downloads): hold offline transfers until connectivity returns"
          git push origin HEAD:plan/download-manager-reliability
