name: Apply Task 24 Live Callback

on:
  push:
    branches:
      - refactor/background-downloader-authority

permissions:
  contents: write

jobs:
  green:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/background-downloader-authority
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - run: flutter pub get
      - name: Apply guarded live callback fix
        run: python .github/apply_task24_live_callback.py
      - run: dart format lib/core/services/download_service.dart
      - name: Generate sources
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Verify callback and lifecycle authority
        run: |
          flutter test \
            test/core/services/download_plugin_parallel_live_callback_authority_test.dart \
            test/core/services/download_plugin_pause_callback_authority_test.dart \
            test/core/services/download_callback_generation_test.dart \
            test/core/services/download_control_outcome_guard_test.dart \
            test/core/services/download_plugin_relaunch_single_writer_test.dart \
            test/core/services/download_plugin_recovery_contract_test.dart \
            test/core/services/download_relaunch_chaos_test.dart \
            test/core/services/download_runtime_ownership_test.dart \
            test/core/services/download_plugin_parallel_cancel_routing_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Remove temporary files
        run: |
          rm -f .github/apply_task24_live_callback.py
          rm -f .github/workflows/apply-task24-live-callback.yml
          rm -f .github/workflows/task24-live-callback-red.yml
      - name: Verify clean diff
        run: |
          git diff --check
          test ! -e .github/apply_task24_live_callback.py
          test ! -e .github/workflows/apply-task24-live-callback.yml
          test ! -e .github/workflows/task24-live-callback-red.yml
      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/core/services/download_service.dart \
                  test/core/services/download_plugin_parallel_live_callback_authority_test.dart \
                  .github/apply_task24_live_callback.py \
                  .github/workflows/apply-task24-live-callback.yml \
                  .github/workflows/task24-live-callback-red.yml
          git diff --cached --check
          git commit -m 'fix(downloads): trust live plugin parallel callback state'
          git push origin HEAD:refactor/background-downloader-authority
