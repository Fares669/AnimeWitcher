name: Anime4K controller integration

on:
  push:
    branches:
      - feat/anime4k-ios-performance
    paths:
      - scripts/apply_anime4k_controller_integration.py

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/anime4k-ios-performance
      - name: Apply controller integration
        run: python3 scripts/apply_anime4k_controller_integration.py
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/player/presentation/player_controller.dart
          if git diff --cached --quiet; then
            echo 'Controller already integrated.'
            exit 0
          fi
          git commit -m 'feat(player): route Anime4K through Apple Metal'
          git push origin HEAD:feat/anime4k-ios-performance
