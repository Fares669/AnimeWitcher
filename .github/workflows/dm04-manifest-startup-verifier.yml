name: DM04 Manifest Startup Verifier

on:
  push:
    branches: [plan/download-manager-reliability]
    paths:
      - test/core/services/download_manifest_startup_inventory_test.dart
      - lib/core/services/download_service.dart
      - .github/workflows/dm04-manifest-startup-verifier.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dm04-manifest-startup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  startup-manifest-inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Run startup manifest inventory regression
        run: >-
          flutter test
          test/core/services/download_manifest_startup_inventory_test.dart
          --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
