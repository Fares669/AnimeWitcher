name: DM25 Range Checkpoint Writer

on:
  push:
    branches: [plan/download-manager-reliability]
    paths:
      - '.github/workflows/dm25-range-checkpoint-writer.yml'
      - '.github/dm25_range_checkpoint_writer.py'

permissions:
  contents: write

jobs:
  dm25:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Prove pre-fix persistence backpressure regression
        shell: bash
        run: |
          python3 .github/dm25_range_checkpoint_writer.py tests
          set +e
          flutter test test/core/services/download_range_checkpoint_backpressure_test.dart >/tmp/dm25-red.log 2>&1
          code=$?
          cat /tmp/dm25-red.log
          test "$code" -ne 0
      - name: Apply DM-25 implementation
        run: |
          python3 .github/dm25_range_checkpoint_writer.py apply
          dart format lib/core/services/download_range_transfer.dart test/core/services/download_range_checkpoint_backpressure_test.dart
      - name: Run focused regressions
        run: |
          flutter test test/core/services/download_range_checkpoint_backpressure_test.dart
          flutter test test/core/services/download_range_transfer_test.dart
          flutter test test/core/services/download_durable_byte_provenance_guard_test.dart
          flutter test test/core/services/download_lifecycle_checkpoint_guard_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Mark DM-25 complete
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('DOWNLOAD_MANAGER_PLAN.md')
          s = p.read_text()
          anchor = '- [ ] **DM-25 — Remove persistence/database backpressure from the Range receive loop**'
          done = '- [x] **DM-25 — Remove persistence/database backpressure from the Range receive loop**'
          if anchor not in s:
              raise SystemExit('DM-25 unchecked anchor missing')
          s = s.replace(anchor, done, 1)
          dep = '  - **Dependencies:** DM-21, DM-29, DM-20.\n'
          notes = '''  - **Implementation notes (2026-09-11):** Range ingestion now separates durable-file flushing from slower JobStore/plugin observers. After each byte/interval threshold the file is flushed, then the newest exact `(written,total)` checkpoint is submitted to a single-flight coalescing writer without awaiting storage in the network receive loop. While one persistence callback is in flight, older pending progress snapshots are replaced by the newest exact durable byte count.\n  - **Boundary semantics:** completion and every pause/failure/cancel exit synchronously join the checkpoint writer before publishing their terminal/paused boundary. Persistence callback errors are retained and converted into a parked failure at the boundary, so throughput optimization does not make lifecycle boundaries fail open. Reconnects keep using the exact in-memory/disk offset and do not create parallel persistence writers.\n  - **Confirmed root cause:** `_receive()` previously awaited `onState()` immediately after each 512 KiB/250 ms flush. That observer can await Hive/JobStore/plugin database work, so storage latency directly stopped socket consumption even though the exact bytes were already durable on disk.\n  - **Verification passed:** RED test proves a blocked progress observer used to stop file ingestion; GREEN coverage proves the file continues to drain while the first observer is blocked, pending snapshots coalesce, and `stop()` retains ownership until the queued checkpoint joins before `onPaused`. Existing Range recovery, durable-byte provenance and lifecycle checkpoint suites plus generated-source-aware `flutter analyze --no-fatal-warnings --no-fatal-infos` and `git diff --check` pass.\n'''
          idx = s.find(done)
          dep_idx = s.find(dep, idx)
          if dep_idx < 0:
              raise SystemExit('DM-25 dependency anchor missing')
          insert_at = dep_idx + len(dep)
          s = s[:insert_at] + notes + s[insert_at:]
          p.write_text(s)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dm25-range-checkpoint-writer.yml .github/dm25_range_checkpoint_writer.py
          git add DOWNLOAD_MANAGER_PLAN.md lib/core/services/download_range_transfer.dart test/core/services/download_range_checkpoint_backpressure_test.dart
          git diff --cached --check
          git commit -m "perf: decouple Range persistence from ingestion"
          git push origin HEAD:plan/download-manager-reliability
