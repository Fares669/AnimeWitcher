name: Agent DM05 Verify

on:
  push:
    branches:
      - agent/core-download-state-recovery-dm04-dm16-20260911
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-dm05-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dm05-authority:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: DM-05 focused regressions
        run: >-
          flutter test
          test/core/services/download_job_store_test.dart
          test/core/services/download_job_state_authority_test.dart
          test/core/services/download_job_state_queue_authority_test.dart
          test/features/library/presentation/downloads_job_state_authority_test.dart
          test/core/services/download_concurrency_test.dart
          test/core/services/download_startup_reconciliation_matrix_test.dart
          test/core/services/download_runtime_ownership_test.dart
          test/core/services/download_recovery_inventory_test.dart
          test/core/services/download_durable_only_recovery_test.dart
          --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
