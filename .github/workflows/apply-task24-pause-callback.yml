name: Apply Task 24 Pause Callback

on:
  push:
    branches:
      - refactor/background-downloader-authority

permissions:
  contents: write

jobs:
  green:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/background-downloader-authority
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - run: flutter pub get
      - name: Apply guarded pause callback fix
        run: python .github/apply_task24_pause_callback.py
      - name: Format changed Dart
        run: dart format lib/core/services/download_service.dart
      - name: Generate sources
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Verify pause/relaunch/ownership lifecycle
        run: |
          flutter test \
            test/core/services/download_plugin_pause_callback_authority_test.dart \
            test/core/services/download_pause_settlement_guard_test.dart \
            test/core/services/download_expected_size_authority_test.dart \
            test/core/services/background_downloader_transfer_api_authority_test.dart \
            test/core/services/download_plugin_relaunch_single_writer_test.dart \
            test/core/services/download_plugin_recovery_contract_test.dart \
            test/core/services/download_cancel_ownership_guard_test.dart \
            test/core/services/download_plugin_parallel_cancel_routing_test.dart \
            test/core/services/download_relaunch_chaos_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Remove temporary verification files
        run: |
          rm -f .github/apply_task24_pause_callback.py
          rm -f .github/workflows/apply-task24-pause-callback.yml
          rm -f .github/workflows/task24-pause-callback-red.yml
          rm -f .github/workflows/task23-green.yml
      - name: Verify clean diff
        run: |
          git diff --check
          test ! -e .github/apply_task24_pause_callback.py
          test ! -e .github/workflows/apply-task24-pause-callback.yml
          test ! -e .github/workflows/task24-pause-callback-red.yml
          test ! -e .github/workflows/task23-green.yml
      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/core/services/download_service.dart \
                  test/core/services/download_plugin_pause_callback_authority_test.dart \
                  .github/apply_task24_pause_callback.py \
                  .github/workflows/apply-task24-pause-callback.yml \
                  .github/workflows/task24-pause-callback-red.yml \
                  .github/workflows/task23-green.yml
          git diff --cached --check
          git commit -m 'fix(downloads): accept settled plugin pause callback'
          git push origin HEAD:refactor/background-downloader-authority
