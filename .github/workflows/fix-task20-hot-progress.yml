name: Fix Task 20 Hot Progress
on:
  push:
    branches:
      - refactor/background-downloader-authority
    paths:
      - .github/fix_task20_hot_progress.py
permissions:
  contents: write
jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/background-downloader-authority
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - run: flutter pub get
      - name: Apply guarded fix
        run: python .github/fix_task20_hot_progress.py
      - run: dart format lib/core/services/download_service.dart test/core/services/download_expected_size_authority_test.dart
      - name: Focused tests
        run: |
          flutter test \
            test/core/services/download_expected_size_authority_test.dart \
            test/core/services/download_transfer_projection_test.dart \
            test/core/services/download_pause_settlement_guard_test.dart \
            test/core/services/download_resource_identity_service_guard_test.dart \
            test/core/services/download_job_store_test.dart
      - name: Generate sources
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Cleanup one-shot files
        run: |
          rm .github/fix_task20_hot_progress.py
          rm .github/workflows/fix-task20-hot-progress.yml
          rm .github/workflows/task20-hot-progress-red.yml
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/services/download_service.dart test/core/services/download_expected_size_authority_test.dart .github
          git diff --cached --check
          git commit -m "fix(downloads): keep plugin progress total monotonic"
          git push origin HEAD:refactor/background-downloader-authority
