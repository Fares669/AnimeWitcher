name: Verify Consolidated Download Branches

on:
  push:
    branches:
      - plan/download-manager-reliability
    paths:
      - .github/scripts/fix_consolidated_overlay.py
      - .github/workflows/verify-consolidated-download-branches.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-consolidated-download-branches
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Install and generate
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          git reset --hard HEAD
      - name: Repair consolidated overlay authority
        run: |
          python3 .github/scripts/fix_consolidated_overlay.py
          dart format lib/core/services/download_service.dart
      - name: Run focused merged regressions
        run: >-
          flutter test
          test/core/services/download_job_state_authority_test.dart
          test/core/services/download_job_state_queue_authority_test.dart
          test/core/services/download_logical_identity_test.dart
          test/core/services/download_job_store_test.dart
          test/core/services/download_recovery_inventory_test.dart
          test/core/services/download_startup_reconciliation_matrix_test.dart
          test/core/services/download_runtime_ownership_test.dart
          --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Verify diff
        run: |
          git diff --check
          test "$(git diff --name-only)" = "lib/core/services/download_service.dart"
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/services/download_service.dart
          git commit -m "fix(downloads): repair consolidated overlay authority"
          git pull --rebase origin plan/download-manager-reliability
          git push origin HEAD:plan/download-manager-reliability
