name: DM-03 verifier

on:
  push:
    branches: [plan/download-manager-reliability]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dm03-verifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dm03:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Run DM-03 outcome regression
        run: flutter test test/core/services/download_command_outcome_test.dart
