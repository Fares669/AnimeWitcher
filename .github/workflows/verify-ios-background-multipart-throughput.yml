name: Verify iOS Background Multipart Throughput

on:
  push:
    branches:
      - fix/ios-background-multipart-throughput

permissions:
  contents: write

concurrency:
  group: verify-ios-background-multipart-throughput
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/ios-background-multipart-throughput
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Apply background multipart fix
        run: python3 .github/scripts/fix-ios-background-multipart-throughput.py

      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Format and diff check
        run: |
          dart format lib/core/services/download_service.dart \
            lib/core/services/download_continued_processing_service.dart \
            lib/core/services/persistent_parallel_download.dart \
            test/core/services/download_runtime_stability_review_test.dart
          git diff --check

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Background multipart regressions
        run: |
          flutter test test/core/services/download_runtime_stability_review_test.dart
          flutter test test/core/services/persistent_parallel_download_test.dart
          flutter test test/core/services/persistent_parallel_download_auto_recovery_test.dart

      - name: Full Flutter suite
        run: flutter test --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Compile iOS simulator app
        run: flutter build ios --simulator --no-codesign

      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ios/Runner/AppDelegate.swift \
            ios/Runner/DownloadNativeWaitingQueue.swift \
            lib/core/services/download_service.dart \
            lib/core/services/download_continued_processing_service.dart \
            lib/core/services/persistent_parallel_download.dart \
            test/core/services/download_runtime_stability_review_test.dart
          if ! git diff --cached --quiet; then
            git commit -m 'fix(downloads): keep iOS multipart throughput stable in background'
            git push origin HEAD:fix/ios-background-multipart-throughput
          fi
