name: Apply iOS Chunk Bridge Fix

on:
  push:
    branches:
      - refactor/background-downloader-authority

permissions:
  contents: write

concurrency:
  group: apply-ios-chunk-bridge-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Apply production fix
        run: |
          python3 .github/scripts/apply_ios_chunk_bridge_fix.py
          dart format test/core/services/ios_legacy_swizzle_scope_test.dart
          git diff --check
      - name: Verify focused ownership contracts
        run: |
          flutter test \
            test/core/services/ios_legacy_swizzle_scope_test.dart \
            test/core/services/ios_plugin_native_callback_authority_test.dart \
            test/core/services/ios_multipart_ownership_handoff_source_test.dart \
            test/core/services/download_plugin_relaunch_single_writer_test.dart \
            --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: Commit verified production fix and remove helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-ios-chunk-bridge-fix.yml
          git rm .github/workflows/ios-chunk-bridge-red.yml
          git rm .github/scripts/apply_ios_chunk_bridge_fix.py
          git add ios/Runner/DownloadNativeWaitingQueue.swift test/core/services/ios_legacy_swizzle_scope_test.dart
          git diff --cached --check
          git commit -m "fix(ios): keep plugin chunk telemetry out of legacy coordinator"
          git push origin HEAD:refactor/background-downloader-authority
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
