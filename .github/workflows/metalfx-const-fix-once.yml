name: MetalFX Const Fix One Shot

on:
  push:
    branches:
      - feat/anime4k-ios-performance
    paths:
      - .github/workflows/metalfx-const-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    name: Apply MetalFX AOT const fix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Apply exact compile-time environment fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('lib/features/player/presentation/player_controller.dart'),
              Path('lib/features/player/presentation/player_controller_base.dart'),
          ]
          needle = "bool.fromEnvironment('ANIME4K_METALFX_EXPERIMENT') &&"
          replacement = "const bool.fromEnvironment('ANIME4K_METALFX_EXPERIMENT') &&"
          for path in paths:
              text = path.read_text()
              count = text.count(needle)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one non-const lookup, found {count}')
              path.write_text(text.replace(needle, replacement, 1))
          PY
      - name: Verify focused MetalFX contract
        run: |
          flutter pub get
          flutter test test/features/player/anime4k_metalfx_experiment_contract_test.dart
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/player/presentation/player_controller.dart \
                  lib/features/player/presentation/player_controller_base.dart
          git diff --cached --check
          git commit -m "fix: read MetalFX preview flag at compile time"
          git push origin HEAD:${GITHUB_REF_NAME}
