name: DM-03 checkpoint guard maintenance

on:
  push:
    branches:
      - plan/download-manager-reliability

permissions:
  contents: write

jobs:
  verify-and-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability

      - name: Update stale reliability assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          signature_files = [
              Path('test/core/services/download_runtime_stability_review_test.dart'),
              Path('test/core/services/download_source_refresh_integrity_test.dart'),
          ]
          old_signature = 'Future<void> _checkpointLogicalJob('
          new_signature = 'Future<bool> _checkpointLogicalJob('
          for path in signature_files:
              text = path.read_text()
              count = text.count(old_signature)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one stale checkpoint signature, found {count}')
              path.write_text(text.replace(old_signature, new_signature, 1))

          runtime_review = Path('test/core/services/download_runtime_stability_review_test.dart')
          text = runtime_review.read_text()
          old_schema = "kParallelManifestSchemaVersion = 4"
          new_schema = "kParallelManifestSchemaVersion = 5"
          count = text.count(old_schema)
          if count != 1:
              raise SystemExit(f'{runtime_review}: expected exactly one stale schema assertion, found {count}')
          runtime_review.write_text(text.replace(old_schema, new_schema, 1))
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install and generate
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Focused tests
        run: |
          flutter test test/core/services/download_runtime_stability_review_test.dart
          flutter test test/core/services/download_source_refresh_integrity_test.dart
          flutter test test/core/services/download_command_outcome_test.dart
          flutter test test/core/services/persistent_parallel_download_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Guard diff and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dm03-checkpoint-guard-fix.yml
          git add test/core/services/download_runtime_stability_review_test.dart test/core/services/download_source_refresh_integrity_test.dart
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          changed = subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()
          allowed = {
              '.github/workflows/dm03-checkpoint-guard-fix.yml',
              'test/core/services/download_runtime_stability_review_test.dart',
              'test/core/services/download_source_refresh_integrity_test.dart',
          }
          extra = set(changed) - allowed
          if extra:
              raise SystemExit(f'unexpected changed files: {sorted(extra)}')
          PY
          git commit -m "test(downloads): align reliability guards with current contracts"
          git push origin HEAD:plan/download-manager-reliability
