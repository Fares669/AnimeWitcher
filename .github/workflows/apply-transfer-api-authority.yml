name: Apply Transfer API Authority
on:
  push:
    branches:
      - refactor/background-downloader-authority
    paths:
      - .github/apply_transfer_api_authority.py
permissions:
  contents: write
jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/background-downloader-authority
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - run: flutter pub get
      - name: Apply guarded refactor
        run: python .github/apply_transfer_api_authority.py
      - name: Format changed Dart
        run: dart format lib/core/services/background_downloader_transport.dart test/core/services/background_downloader_transfer_api_authority_test.dart
      - name: Run focused transport lifecycle tests
        run: |
          flutter test \
            test/core/services/background_downloader_transfer_api_authority_test.dart \
            test/core/services/background_downloader_transport_test.dart \
            test/core/services/download_plugin_parallel_execution_test.dart \
            test/core/services/download_pause_settlement_guard_test.dart \
            test/core/services/download_runtime_ownership_test.dart \
            test/core/services/download_start_outcome_guard_test.dart \
            test/core/services/download_plugin_parallel_cancel_routing_test.dart
      - name: Generate sources
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Remove one-shot files
        run: |
          rm .github/apply_transfer_api_authority.py
          rm .github/workflows/apply-transfer-api-authority.yml
          rm .github/workflows/transfer-api-authority-red.yml
      - name: Commit verified refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/services/background_downloader_transport.dart test/core/services/background_downloader_transfer_api_authority_test.dart .github
          git diff --cached --check
          git commit -m "refactor(downloads): delegate lifecycle fallback to Transfer API"
          git push origin HEAD:refactor/background-downloader-authority
