name: Apply Anime4K manual telemetry fix

on:
  push:
    branches:
      - feat/anime4k-ios-performance
    paths:
      - .github/workflows/apply-anime4k-manual-telemetry-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/anime4k-ios-performance
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Confirm focused RED
        shell: bash
        run: |
          set +e
          flutter test test/features/player/anime4k_manual_telemetry_sampling_test.dart > /tmp/red.log 2>&1
          status=$?
          cat /tmp/red.log
          if [ "$status" -eq 0 ]; then
            echo "Focused regression unexpectedly passed before production fix" >&2
            exit 1
          fi
          grep -q "Manual Metal/MetalFX benchmark segments need fresh telemetry too" /tmp/red.log || {
            echo "RED failed for an unexpected reason" >&2
            exit 1
          }
      - name: Refine stale manual sampling contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/features/player/anime4k_performance_log_contract_test.dart')
          source = path.read_text()
          old = (
              "      final sampleEnd = controller.indexOf(\n"
              "        'void _publishAnime4kPerformanceSnapshot',\n"
              "        sampleStart,\n"
              "      );\n"
              "      expect(sampleEnd, greaterThan(sampleStart));\n"
              "      final sampleBody = controller.substring(sampleStart, sampleEnd);\n"
              "      expect(sampleBody, isNot(contains('!settings.anime4kEcoEnabled')));\n"
          )
          new = (
              "      final sampleEnd = controller.indexOf(\n"
              "        'void _publishAnime4kPerformanceSnapshot',\n"
              "        sampleStart,\n"
              "      );\n"
              "      expect(sampleEnd, greaterThan(sampleStart));\n"
              "      final sampleBody = controller.substring(sampleStart, sampleEnd);\n"
              "      final publish = sampleBody.indexOf(\n"
              "        '_publishAnime4kPerformanceSnapshot(decision.snapshot);',\n"
              "      );\n"
              "      final ecoOnlyPolicyGuard = sampleBody.indexOf(\n"
              "        'if (!settings.anime4kEcoEnabled) return;',\n"
              "      );\n"
              "      expect(publish, greaterThanOrEqualTo(0));\n"
              "      expect(\n"
              "        ecoOnlyPolicyGuard,\n"
              "        greaterThan(publish),\n"
              "        reason:\n"
              "            'Manual Metal must publish telemetry before Eco-only policy exits.',\n"
              "      );\n"
          )
          if source.count(old) != 1:
              raise SystemExit(f'expected one stale contract, found {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY
      - name: Apply minimal production fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/player/presentation/player_controller.dart')
          source = path.read_text()
          old_timer = (
              "      if (settings.anime4kEcoEnabled) {\n"
              "        _anime4kEcoTimer ??= Timer.periodic(const Duration(seconds: 1), (_) {\n"
              "          unawaited(_sampleAnime4kEco());\n"
              "        });\n"
              "      } else {\n"
              "        _anime4kEcoTimer?.cancel();\n"
              "        _anime4kEcoTimer = null;\n"
              "      }\n"
          )
          new_timer = (
              "      _anime4kEcoTimer ??= Timer.periodic(const Duration(seconds: 1), (_) {\n"
              "        unawaited(_sampleAnime4kEco());\n"
              "      });\n"
          )
          if source.count(old_timer) != 1:
              raise SystemExit(f'expected one timer gate, found {source.count(old_timer)}')
          source = source.replace(old_timer, new_timer)

          old_policy = (
              "      _publishAnime4kPerformanceSnapshot(decision.snapshot);\n\n"
              "      if (decision.plan.effectiveQuality != _anime4kEcoEffectiveQuality) {\n"
          )
          new_policy = (
              "      _publishAnime4kPerformanceSnapshot(decision.snapshot);\n\n"
              "      // Manual Metal and MetalFX benchmark runs still need fresh telemetry,\n"
              "      // but only Eco may adapt quality or native bypass state.\n"
              "      if (!settings.anime4kEcoEnabled) return;\n\n"
              "      if (decision.plan.effectiveQuality != _anime4kEcoEffectiveQuality) {\n"
          )
          if source.count(old_policy) != 1:
              raise SystemExit(f'expected one policy boundary, found {source.count(old_policy)}')
          source = source.replace(old_policy, new_policy)
          path.write_text(source)
          PY
      - name: Run focused GREEN
        run: flutter test test/features/player/anime4k_manual_telemetry_sampling_test.dart test/features/player/anime4k_performance_log_contract_test.dart test/features/player/anime4k_eco_controller_wiring_test.dart
      - name: Commit production fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/player/presentation/player_controller.dart test/features/player/anime4k_performance_log_contract_test.dart
          git commit -m "fix: sample manual Anime4K telemetry periodically"
          git push origin HEAD:feat/anime4k-ios-performance
