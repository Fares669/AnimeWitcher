name: DM20 Reconcile

on:
  push:
    branches: [plan/download-manager-reliability]

permissions:
  contents: write

jobs:
  dm20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Setup
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Add regression tests
        run: |
          python3 .github/dm20_reconcile.py tests
          dart format test/core/services/download_job_store_test.dart test/core/services/download_recovery_reconciliation_guard_test.dart
      - name: Prove RED
        run: |
          set +e
          flutter test test/core/services/download_job_store_test.dart test/core/services/download_recovery_reconciliation_guard_test.dart > /tmp/red.log 2>&1
          status=$?
          cat /tmp/red.log
          test "$status" -ne 0
      - name: Apply implementation
        run: |
          python3 .github/dm20_reconcile.py apply
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/core/services/download_job_store_test.dart')
          text = p.read_text()
          text = text.replace("test('v2 exact disk provenance round trips explicitly'", "test('v3 exact disk provenance round trips explicitly'", 1)
          text = text.replace("expect(json['schemaVersion'], 2);", "expect(json['schemaVersion'], 3);", 1)
          p.write_text(text)
          PY
          dart format lib/core/services/download_job_store.dart lib/core/services/download_service.dart test/core/services/download_job_store_test.dart test/core/services/download_recovery_reconciliation_guard_test.dart
      - name: Test JobStore reconciliation
        run: flutter test test/core/services/download_job_store_test.dart
      - name: Test recovery reconciliation guard
        run: flutter test test/core/services/download_recovery_reconciliation_guard_test.dart
      - name: Test recovery policy
        run: flutter test test/core/services/download_recovery_policy_test.dart
      - name: Test durable provenance guard
        run: flutter test test/core/services/download_durable_byte_provenance_guard_test.dart
      - name: Test durable byte contract guard
        run: flutter test test/core/services/download_durable_byte_contract_guard_test.dart
      - name: Test runtime ownership
        run: flutter test test/core/services/download_runtime_ownership_test.dart
      - name: Test multipart regressions
        run: flutter test test/core/services/persistent_parallel_download_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Complete and push
        run: |
          python3 .github/dm20_reconcile.py complete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dm20-reconcile.yml .github/dm20_reconcile.py
          git add DOWNLOAD_MANAGER_PLAN.md lib/core/services/download_job_store.dart lib/core/services/download_service.dart test/core/services/download_job_store_test.dart test/core/services/download_recovery_reconciliation_guard_test.dart
          git diff --cached --check
          git commit -m "fix: reconcile lost durable download bytes"
          git push origin HEAD:plan/download-manager-reliability
