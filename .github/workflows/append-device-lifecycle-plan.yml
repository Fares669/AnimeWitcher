name: Append Device Lifecycle Plan
on:
  push:
    branches:
      - refactor/background-downloader-authority
    paths:
      - .github/append_device_lifecycle_tasks.py
permissions:
  contents: write
jobs:
  update-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/background-downloader-authority
      - name: Apply guarded plan update
        run: python .github/append_device_lifecycle_tasks.py
      - name: Verify task section inserted once
        run: |
          test "$(grep -c '^### Task 19: Make iOS continued-processing start state truthful$' docs/superpowers/plans/2026-09-15-background-downloader-authority.md)" -eq 1
          test "$(grep -c '^### Task 24: Comprehensive device-derived reliability audit before migration cleanup$' docs/superpowers/plans/2026-09-15-background-downloader-authority.md)" -eq 1
      - name: Remove one-shot files
        run: |
          rm .github/append_device_lifecycle_tasks.py
          rm .github/workflows/append-device-lifecycle-plan.yml
      - name: Commit plan update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/plans/2026-09-15-background-downloader-authority.md .github
          git diff --cached --check
          git commit -m "docs(downloads): add device lifecycle reliability tasks"
          git push origin HEAD:refactor/background-downloader-authority
