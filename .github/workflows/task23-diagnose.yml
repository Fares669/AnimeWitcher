name: Task 23 Diagnose

on:
  push:
    branches:
      - refactor/background-downloader-authority

permissions:
  contents: read

jobs:
  adapter-and-parent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/background-downloader-authority
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - run: flutter pub get
      - run: python .github/apply_task23_relaunch.py
      - run: dart format lib/core/services/background_downloader_transport.dart lib/core/services/download_service.dart
      - run: |
          flutter test \
            test/core/services/background_downloader_transfer_api_authority_test.dart \
            test/core/services/download_plugin_relaunch_single_writer_test.dart \
            test/core/services/download_plugin_recovery_contract_test.dart \
            test/core/services/download_plugin_parallel_execution_test.dart

  pause-and-ownership:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/background-downloader-authority
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - run: flutter pub get
      - run: python .github/apply_task23_relaunch.py
      - run: dart format lib/core/services/background_downloader_transport.dart lib/core/services/download_service.dart
      - run: |
          flutter test \
            test/core/services/download_pause_settlement_guard_test.dart \
            test/core/services/download_runtime_ownership_test.dart \
            test/core/services/download_zero_restart_invariant_test.dart

  recovery-matrix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/background-downloader-authority
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - run: flutter pub get
      - run: python .github/apply_task23_relaunch.py
      - run: dart format lib/core/services/background_downloader_transport.dart lib/core/services/download_service.dart
      - run: |
          flutter test \
            test/core/services/download_startup_reconciliation_matrix_test.dart \
            test/core/services/download_relaunch_chaos_test.dart \
            test/core/services/download_recovery_fault_injection_test.dart \
            test/core/services/download_recovery_inventory_test.dart

  chaos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/background-downloader-authority
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - run: flutter pub get
      - run: python .github/apply_task23_relaunch.py
      - run: dart format lib/core/services/background_downloader_transport.dart lib/core/services/download_service.dart
      - run: flutter test test/core/services/download_manager_chaos_matrix_test.dart
