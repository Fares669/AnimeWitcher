name: iOS Continued Processing Finalize

on:
  push:
    branches:
      - refactor/background-downloader-authority

permissions:
  contents: read

concurrency:
  group: ios-continued-processing-finalize
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/background-downloader-authority
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Apply proven GREEN patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import re
          from pathlib import Path
          helper = Path('.github/workflows/ios-continued-processing-sync-green.yml').read_text()
          match = re.search(r"echo '([A-Za-z0-9+/=]+)'", helper)
          if not match:
              raise SystemExit('Unable to locate encoded GREEN patch payload')
          patch_source = base64.b64decode(match.group(1)).decode('utf-8')
          exec(compile(patch_source, 'ios-continued-processing-sync-green.yml', 'exec'), {'__name__': '__main__'})
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Capture analyzer diagnostics
        id: analyze
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-warnings --no-fatal-infos > analyze.txt 2>&1
          status=$?
          cat analyze.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload analyzer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continued-processing-analyzer
          path: analyze.txt
          retention-days: 1
      - name: Fail on analyzer errors
        run: test "${{ steps.analyze.outputs.status }}" -eq 0
