name: iOS Continued Processing Finalize

on:
  push:
    branches:
      - refactor/background-downloader-authority

permissions:
  contents: write

concurrency:
  group: ios-continued-processing-finalize
  cancel-in-progress: false

jobs:
  contract:
    name: Contract ${{ matrix.test }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        test:
          - test/core/services/download_continued_processing_start_ack_test.dart
          - test/core/services/ios_continued_processing_start_source_test.dart
          - test/core/services/ios_continued_processing_update_ack_source_test.dart
          - test/core/services/ios_continued_processing_completion_guard_test.dart
          - test/core/services/ios_continued_processing_expiration_test.dart
          - test/core/services/download_native_claim_foreground_test.dart
          - test/core/services/download_presentation_ownership_test.dart
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/background-downloader-authority
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Apply proven GREEN patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import re
          from pathlib import Path
          helper = Path('.github/workflows/ios-continued-processing-sync-green.yml').read_text()
          match = re.search(r"echo '([A-Za-z0-9+/=]+)'", helper)
          if not match:
              raise SystemExit('Unable to locate encoded GREEN patch payload')
          patch_source = base64.b64decode(match.group(1)).decode('utf-8')
          exec(compile(patch_source, 'ios-continued-processing-sync-green.yml', 'exec'), {'__name__': '__main__'})
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Run focused contract
        run: flutter test "${{ matrix.test }}"

  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/background-downloader-authority
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Apply proven GREEN patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import re
          from pathlib import Path
          helper = Path('.github/workflows/ios-continued-processing-sync-green.yml').read_text()
          match = re.search(r"echo '([A-Za-z0-9+/=]+)'", helper)
          if not match:
              raise SystemExit('Unable to locate encoded GREEN patch payload')
          patch_source = base64.b64decode(match.group(1)).decode('utf-8')
          exec(compile(patch_source, 'ios-continued-processing-sync-green.yml', 'exec'), {'__name__': '__main__'})
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze patched source
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

  finalize:
    needs: [contract, analyze]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/background-downloader-authority
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Apply verified GREEN patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import re
          from pathlib import Path
          helper = Path('.github/workflows/ios-continued-processing-sync-green.yml').read_text()
          match = re.search(r"echo '([A-Za-z0-9+/=]+)'", helper)
          if not match:
              raise SystemExit('Unable to locate encoded GREEN patch payload')
          patch_source = base64.b64decode(match.group(1)).decode('utf-8')
          exec(compile(patch_source, 'ios-continued-processing-sync-green.yml', 'exec'), {'__name__': '__main__'})
          PY
          dart format \
            lib/core/services/download_continued_processing_service.dart \
            lib/core/services/download_service.dart
      - name: Commit verified source and remove temporary helpers
        shell: bash
        run: |
          rm -f \
            .github/workflows/ios-continued-processing-sync-green.yml \
            .github/workflows/ios-continued-processing-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/ios-continued-processing-sync-green.yml \
            .github/workflows/ios-continued-processing-finalize.yml \
            ios/Runner/DownloadContinuedProcessingManager.swift \
            ios/Runner/AppDelegate.swift \
            lib/core/services/download_continued_processing_service.dart \
            lib/core/services/download_service.dart
          git diff --cached --check
          git commit -m 'fix(ios): finalize continued-processing ownership handoff'
          git push origin HEAD:refactor/background-downloader-authority
