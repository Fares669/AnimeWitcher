name: Task 24 Plugin Resume RED

on:
  push:
    branches:
      - refactor/background-downloader-authority

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/background-downloader-authority
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - run: flutter pub get
      - run: |
          flutter test \
            test/core/services/download_plugin_resume_authority_test.dart \
            test/core/services/background_downloader_transfer_api_authority_test.dart
