name: Build Plugin Parallel Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-parallel-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-acceptance:
    name: iOS plugin-parallel acceptance IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Verify acceptance and ownership contracts
        run: |
          flutter test \
            test/core/services/download_transport_policy_test.dart \
            test/core/services/download_plugin_parallel_acceptance_build_test.dart \
            test/core/services/ios_legacy_swizzle_scope_test.dart \
            test/core/services/ios_plugin_native_callback_authority_test.dart \
            test/core/services/ios_multipart_ownership_handoff_source_test.dart \
            test/core/services/download_plugin_relaunch_single_writer_test.dart \
            --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: Build iOS acceptance release without codesign
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=ANIMEWITCHER_PLUGIN_PARALLEL_ACCEPTANCE=true \
            --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: Package acceptance IPA
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry animewitcher-ios-plugin-parallel-acceptance.ipa Payload
      - name: Upload acceptance IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-plugin-parallel-acceptance-ipa
          path: animewitcher-ios-plugin-parallel-acceptance.ipa
          retention-days: 7
