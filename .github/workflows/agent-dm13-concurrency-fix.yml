name: Agent DM13 Scheduler Fairness GREEN

on:
  push:
    branches: [plan/download-manager-reliability]
    paths:
      - .github/workflows/agent-dm13-concurrency-fix.yml

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Prepare
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          git reset --hard HEAD
      - name: Reproduce DM-13 RED
        run: |
          set +e
          flutter test \
            test/core/services/persistent_parallel_download_hol_red_test.dart \
            --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key 2>&1 | tee /tmp/dm13-red.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            echo 'DM-13 unexpectedly GREEN before implementation' >&2
            exit 1
          fi
          if grep -qE 'Undefined name|Compilation failed|Failed to load' /tmp/dm13-red.log; then
            echo 'DM-13 RED must be behavioral, not a compile failure' >&2
            exit 1
          fi
      - name: Apply DM-13 scheduler fairness fix
        run: |
          python3 .github/scripts/dm13_scheduler_patch.py
          dart format lib/core/services/persistent_parallel_download.dart
          git diff --check
      - name: Verify DM-13 and adjacent concurrency regressions
        run: |
          set -o pipefail
          flutter test \
            test/core/services/persistent_parallel_download_hol_red_test.dart \
            test/core/services/persistent_parallel_download_pending_start_lease_test.dart \
            test/core/services/persistent_parallel_download_test.dart \
            test/core/services/persistent_parallel_download_auto_recovery_test.dart \
            test/core/services/download_concurrency_test.dart \
            test/core/services/download_connection_governor_test.dart \
            --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key 2>&1 | tee /tmp/dm13-test.log
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Mark DM-13 complete and push
        run: |
          python3 .github/scripts/dm13_mark_complete.py
          rm -f .github/workflows/agent-dm13-concurrency-fix.yml
          rm -f .github/scripts/dm13_scheduler_patch.py
          rm -f .github/scripts/dm13_mark_complete.py
          git add -A
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(downloads): remove cross-session scheduler head-of-line blocking"
          git push origin HEAD:plan/download-manager-reliability
      - name: Upload DM-13 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dm13-scheduler-diagnostics-rerun
          path: |
            /tmp/dm13-red.log
            /tmp/dm13-test.log
          if-no-files-found: ignore
          retention-days: 1
