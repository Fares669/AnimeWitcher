name: Agent DM05 Overlay Fix

on:
  push:
    branches:
      - agent/core-download-state-recovery-dm04-dm16-20260911
    paths:
      - .github/workflows/agent-dm05-overlay-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Prepare
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          git reset --hard HEAD
      - name: Apply JobState-first session overlay fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/core/services/download_service.dart')
          text = path.read_text()
          old = """      final leftoverWaiting = _queueWaitingIds.contains(record.task.taskId);
              final liveRunning = live?.status == TaskStatus.running;
              final inSession =
                  _sessionOrder.contains(record.task.taskId) ||
                  occupiesDownloadSlot(
                    status: record.status,
                    queueWaiting: leftoverWaiting,
                  ) ||
                  leftoverWaiting ||
                  liveRunning ||
                  record.status == TaskStatus.enqueued;
          """
          new = """      final job = await _jobStore.get(record.task.taskId);
              // DownloadJobState is authoritative once a durable record exists.
              // Pre-JobStore migration fallback may still consult executor/UI replicas.
              final leftoverWaiting = job != null
                  ? downloadJobQueueWaiting(job.state)
                  : _queueWaitingIds.contains(record.task.taskId);
              final liveRunning = live?.status == TaskStatus.running;
              final occupiesSlot = job != null
                  ? downloadJobOccupiesSlot(job.state)
                  : occupiesDownloadSlot(
                      status: record.status,
                      queueWaiting: leftoverWaiting,
                    );
              final inSession =
                  _sessionOrder.contains(record.task.taskId) ||
                  occupiesSlot ||
                  leftoverWaiting ||
                  (job == null && liveRunning) ||
                  (job == null && record.status == TaskStatus.enqueued);
          """
          if old not in text:
              raise SystemExit('DM05 overlay classification target not found')
          text = text.replace(old, new, 1)
          old = """      final displayStatus = displayDownloadStatus(
                persisted: liveRunning ? TaskStatus.running : record.status,
                queueWaiting: leftoverWaiting && !liveRunning,
              );
          """
          new = """      final displayStatus = job != null
                  ? downloadJobDisplayStatus(job.state)
                  : displayDownloadStatus(
                      persisted: liveRunning ? TaskStatus.running : record.status,
                      queueWaiting: leftoverWaiting && !liveRunning,
                    );
          """
          if old not in text:
              raise SystemExit('DM05 overlay display target not found')
          text = text.replace(old, new, 1)
          old = """    for (final payload in _waitingPayloads.entries) {
              if (seen.contains(payload.key)) continue;
              _rememberSessionTask(payload.key);
              entries.add(
                DownloadOverlayEntry(
                  taskId: payload.key,
                  status: TaskStatus.enqueued,
                  displayName: payload.value['displayName'] as String? ?? '',
                  queueWaiting: true,
          """
          new = """    for (final payload in _waitingPayloads.entries) {
              if (seen.contains(payload.key)) continue;
              final job = await _jobStore.get(payload.key);
              if (job != null && !downloadJobQueueWaiting(job.state)) continue;
              _rememberSessionTask(payload.key);
              entries.add(
                DownloadOverlayEntry(
                  taskId: payload.key,
                  status: job != null
                      ? downloadJobDisplayStatus(job.state)
                      : TaskStatus.enqueued,
                  displayName: payload.value['displayName'] as String? ?? '',
                  queueWaiting: job != null
                      ? downloadJobQueueWaiting(job.state)
                      : true,
          """
          if old not in text:
              raise SystemExit('DM05 waiting overlay target not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          dart format lib/core/services/download_service.dart
      - name: Green regression
        run: >-
          flutter test
          test/core/services/download_job_state_queue_authority_test.dart
          test/core/services/download_job_state_authority_test.dart
          test/features/library/presentation/downloads_job_state_authority_test.dart
          --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Commit fix and remove one-shot workflow
        run: |
          git rm .github/workflows/agent-dm05-overlay-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/services/download_service.dart
          git diff --cached --check
          git commit -m "fix(downloads): make session overlay JobState-first"
          git push origin HEAD:agent/core-download-state-recovery-dm04-dm16-20260911
