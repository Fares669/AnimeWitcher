name: Fix iOS Continued Processing Start

on:
  push:
    branches:
      - refactor/background-downloader-authority
    paths:
      - '.github/fix_ios_continued_processing_start.py'
      - '.github/workflows/fix-ios-continued-processing-start.yml'

permissions:
  contents: write

jobs:
  red-green-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/background-downloader-authority
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Verify RED before fix
        shell: bash
        run: |
          set +e
          flutter test test/core/services/ios_continued_processing_start_source_test.dart
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Expected iOS continued-processing regression test to be RED before patch'
            exit 1
          fi
      - name: Apply guarded native fix
        run: python3 .github/fix_ios_continued_processing_start.py
      - name: Verify GREEN source contract
        run: flutter test test/core/services/ios_continued_processing_start_source_test.dart
      - name: Generate sources
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Prepare media_kit iOS headers
        run: bash scripts/prepare_media_kit_ios_headers.sh
      - name: Build iOS release without signing
        run: flutter build ios --release --no-codesign
      - name: Remove one-shot files
        run: |
          rm .github/fix_ios_continued_processing_start.py
          rm .github/workflows/fix-ios-continued-processing-start.yml
      - name: Commit verified native fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(ios): retry stalled continued processing tasks'
          git push origin HEAD:refactor/background-downloader-authority
