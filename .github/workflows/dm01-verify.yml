name: Verify DM-01 lifecycle

on:
  push:
    branches:
      - plan/download-manager-reliability

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Lease lifecycle tests
        run: flutter test test/core/services/persistent_parallel_download_pending_start_lease_test.dart
      - name: Multipart regression tests
        run: |
          flutter test test/core/services/persistent_parallel_download_auto_recovery_test.dart
          flutter test test/core/services/persistent_parallel_download_test.dart
          flutter test test/core/services/persistent_parallel_download_recovery_snapshot_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Remove verifier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dm01-verify.yml
          git commit -m "chore: remove DM-01 verifier"
          git push origin HEAD:plan/download-manager-reliability
