name: Guarded DM-04 schema migration test fix

on:
  push:
    branches:
      - plan/download-manager-reliability

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability
          fetch-depth: 0

      - name: Guard against repeat execution
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -Fq '[dm04-schema-test-fixed]'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.guard.outputs.skip != 'true'
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Patch schema migration tests
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          OLD_BLOCK_B64: 
          NEW_BLOCK_B64: 
        run: |
          python3 <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path('test/core/services/download_job_store_test.dart')
          text = path.read_text()
          old = base64.b64decode(os.environ['OLD_BLOCK_B64']).decode()
          new = base64.b64decode(os.environ['NEW_BLOCK_B64']).decode()
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one old schema block, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          dart format test/core/services/download_job_store_test.dart

      - name: Install dependencies and generate sources
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Focused schema tests
        if: steps.guard.outputs.skip != 'true'
        run: flutter test test/core/services/download_job_store_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Full test suite
        if: steps.guard.outputs.skip != 'true'
        run: flutter test --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Analyze
        if: steps.guard.outputs.skip != 'true'
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Verify and commit
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          git rm .github/workflows/guarded-dm04-schema-test-fix.yml
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/guarded-dm04-schema-test-fix.yml' 'test/core/services/download_job_store_test.dart' | sort)"
          printf 'Changed files:\n%s\n' "$changed"
          test "$changed" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(downloads): preserve v3 JobStore schema migration [dm04-schema-test-fixed]'
          git push origin HEAD:plan/download-manager-reliability
