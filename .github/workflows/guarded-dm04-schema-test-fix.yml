name: Guarded DM-04 schema migration test fix

on:
  push:
    branches:
      - plan/download-manager-reliability

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: plan/download-manager-reliability
          fetch-depth: 0

      - name: Guard against repeat execution
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -Fq '[dm04-schema-test-fixed]'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.guard.outputs.skip != 'true'
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Patch schema migration tests
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('test/core/services/download_job_store_test.dart')
          text = path.read_text()
          old = '''    test('v3 exact disk provenance round trips explicitly', () {
      final source = _job(
        durableBytes: 456,
        durableByteProvenance: DownloadDurableByteProvenance.exactDisk,
      );

      final json = source.toJson();
      final decoded = DownloadJobRecord.fromJson(json);

      expect(json['schemaVersion'], 3);
      expect(json['durableByteProvenance'], 'exactDisk');
      expect(
        decoded?.durableByteProvenance,
        DownloadDurableByteProvenance.exactDisk,
      );
    });
'''
          new = '''    test('current schema exact disk provenance round trips explicitly', () {
      final source = _job(
        durableBytes: 456,
        durableByteProvenance: DownloadDurableByteProvenance.exactDisk,
      );

      final json = source.toJson();
      final decoded = DownloadJobRecord.fromJson(json);

      expect(json['schemaVersion'], kDownloadJobSchemaVersion);
      expect(json['durableByteProvenance'], 'exactDisk');
      expect(
        decoded?.durableByteProvenance,
        DownloadDurableByteProvenance.exactDisk,
      );
    });

    test('v3 exact disk provenance remains readable after schema upgrade', () {
      final legacy = _job(
        durableBytes: 456,
        durableByteProvenance: DownloadDurableByteProvenance.exactDisk,
      ).toJson()
        ..['schemaVersion'] = 3
        ..remove('taskSnapshot');

      final decoded = DownloadJobRecord.fromJson(legacy);

      expect(decoded, isNotNull);
      expect(
        decoded!.durableByteProvenance,
        DownloadDurableByteProvenance.exactDisk,
      );
    });
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one old schema test block, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          dart format test/core/services/download_job_store_test.dart

      - name: Install dependencies and generate sources
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Focused schema tests
        if: steps.guard.outputs.skip != 'true'
        run: flutter test test/core/services/download_job_store_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Full test suite
        if: steps.guard.outputs.skip != 'true'
        run: flutter test --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Analyze
        if: steps.guard.outputs.skip != 'true'
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Verify and commit
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          git rm .github/workflows/guarded-dm04-schema-test-fix.yml
          git diff --check
          test "$(git diff --name-only | sort)" = "test/core/services/download_job_store_test.dart"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/core/services/download_job_store_test.dart
          git commit -m 'test(downloads): preserve v3 JobStore schema migration [dm04-schema-test-fixed]'
          git push origin HEAD:plan/download-manager-reliability
