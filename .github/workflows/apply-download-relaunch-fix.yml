name: Apply Download Relaunch Fix

on:
  push:
    branches:
      - refactor/background-downloader-authority

permissions:
  contents: write

concurrency:
  group: apply-download-relaunch-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Apply production fixes
        run: |
          python3 .github/scripts/apply_download_relaunch_fix.py
          dart format lib/core/services/download_service.dart test/core/services/ios_plugin_native_callback_authority_test.dart
          git diff --check

      - name: Verify focused relaunch and plugin authority contracts
        run: |
          flutter test \
            test/core/services/download_transport_policy_test.dart \
            test/core/services/download_plugin_parallel_execution_test.dart \
            test/core/services/download_plugin_relaunch_single_writer_test.dart \
            test/core/services/download_plugin_recovery_contract_test.dart \
            test/core/services/download_legacy_migration_policy_test.dart \
            test/core/services/download_runtime_ownership_test.dart \
            test/core/services/ios_plugin_native_callback_authority_test.dart \
            test/core/services/ios_multipart_ownership_handoff_source_test.dart \
            --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key

      - name: Analyze production download sources
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Commit verified production fix and remove helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-download-relaunch-fix.yml
          git rm .github/scripts/apply_download_relaunch_fix.py
          git add lib/core/services/download_service.dart ios/Runner/DownloadNativeWaitingQueue.swift
          git diff --cached --check
          git commit -m "fix(downloads): reconcile plugin relaunch before legacy restore"
          git push origin HEAD:refactor/background-downloader-authority
