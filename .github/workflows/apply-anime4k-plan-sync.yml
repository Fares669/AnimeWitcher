name: Sync Anime4K plan and benchmark contract

on:
  push:
    branches:
      - feat/anime4k-ios-performance
    paths:
      - .github/workflows/apply-anime4k-plan-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/anime4k-ios-performance
          fetch-depth: 0
      - name: Update source-of-truth docs
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          plan = Path('ANIME4K_PERFORMANCE_PLAN.md')
          text = plan.read_text()

          replacements = {
              '- [ ] **AKP-14 — Frame deduplication**': '- [x] **AKP-14 — Frame deduplication**',
              '  - Expose processed/skipped-duplicate counters in the performance snapshot.\n\n- [ ] **AKP-15':
                  '  - Expose processed/skipped-duplicate counters in the performance snapshot.\n'
                  '  - Verification: produced-frame identity/repeat-redraw handling and processed/skipped counters are covered by `anime4k_frame_dedup_test.dart`; the full Flutter suite on run `34745359684` reached this test green, with its only failure isolated to the preview screenshot contract fixed afterward.\n\n- [ ] **AKP-15',
              '- [ ] **AKP-17 — MetalFX Eco experiment**': '- [ ] **AKP-17 — MetalFX experiment**',
              '    - Add benchmark toggle hidden behind experimental/debug capability until proven':
                  '    - Expose a persisted experimental MetalFX toggle directly below Eco, default OFF and independent from Eco; capability-gate the native scaler and do not make MetalFX the default until proven',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'plan replacement count for {old!r}: {count}')
              text = text.replace(old, new, 1)
          plan.write_text(text)

          bench = Path('docs/anime4k_performance_benchmark.md')
          text = bench.read_text()
          replacements = {
              '> **PENDING — physical hardware evidence has not been collected yet.** Do not claim performance completion until every required comparison below has been measured on a Physical Apple device and recorded against the exact commit that was tested.':
                  '> **PENDING — the final controlled physical-hardware matrix is not complete yet.** Supplementary iPhone measurements already exist, but do not claim performance completion until every required comparison below is measured on a physical Apple device and tied to the exact commit that was tested.',
              '## MetalFX hidden experiment': '## MetalFX experiment',
              'MetalFX is an experimental Eco-only benchmark strategy and is not the default. Compare it with the full Anime4K Apple Metal strategy on the same physical device and clip. The experiment must not be promoted based on CI or simulator results alone.':
                  'MetalFX is an experimental persisted setting directly below Eco. It defaults OFF and is independent from Eco, so benchmark it with identical Eco state on both sides. Compare it with the full Anime4K Apple Metal strategy on the same physical device and clip. Native capability gating remains mandatory, and the experiment must not become the default based on CI or simulator results alone.',
              '6. Leave any unmeasured field as **PENDING**. Never replace missing physical-device evidence with simulator, CI-runner, or inferred values.':
                  '6. Configuration changes in the in-app JSONL log create explicit `segmentStart` / `segmentEnd` records with a `segmentId`; compare metrics only within the intended segment instead of inferring boundaries from timestamps.\n7. Leave any unmeasured field as **PENDING**. Never replace missing physical-device evidence with simulator, CI-runner, or inferred values.',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'benchmark replacement count for {old!r}: {count}')
              text = text.replace(old, new, 1)
          bench.write_text(text)
          PY
          git diff --check
          grep -F -- '- [x] **AKP-14 — Frame deduplication**' ANIME4K_PERFORMANCE_PLAN.md
          grep -F -- '- [ ] **AKP-17 — MetalFX experiment**' ANIME4K_PERFORMANCE_PLAN.md
          grep -F 'independent from Eco' docs/anime4k_performance_benchmark.md
          grep -F 'segmentStart' docs/anime4k_performance_benchmark.md
      - name: Commit doc synchronization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ANIME4K_PERFORMANCE_PLAN.md docs/anime4k_performance_benchmark.md
          git diff --cached --check
          git commit -m "docs: align Anime4K plan with runtime experiment"
          git push origin HEAD:feat/anime4k-ios-performance
