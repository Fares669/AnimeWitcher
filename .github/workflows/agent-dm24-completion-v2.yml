name: Agent DM24 Logical Identity Completion V2

on:
  push:
    branches:
      - plan/download-manager-reliability
    paths:
      - .github/workflows/agent-dm24-completion-v2.yml

permissions:
  contents: write

concurrency:
  group: agent-dm24-logical-identity-completion-v2
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Prepare
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          git reset --hard HEAD
      - name: Apply DM-24 invariant repair
        run: |
          python3 .github/scripts/dm24_legacy_adoption_repair.py
          dart format lib/core/services/download_service.dart
      - name: DM-24 focused GREEN regressions
        run: |
          flutter test \
            test/core/services/download_logical_identity_test.dart \
            test/core/services/download_job_logical_identity_test.dart \
            test/core/services/download_logical_identity_persistence_test.dart \
            test/core/services/download_logical_identity_start_test.dart \
            test/core/services/download_overlay_logical_identity_test.dart \
            test/features/library/presentation/downloads_logical_identity_test.dart \
            test/core/services/download_job_single_authority_test.dart \
            test/core/services/download_job_state_authority_test.dart \
            test/core/services/download_job_state_queue_authority_test.dart \
            test/features/library/presentation/downloads_job_state_authority_test.dart \
            --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Mark DM-24 complete and push
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('DOWNLOAD_MANAGER_PLAN.md')
          s = p.read_text()
          marker = '- [ ] **DM-24 — Introduce one canonical logical episode identity separate from execution `taskId`**'
          done = marker.replace('[ ]', '[x]')
          if marker in s:
              s = s.replace(marker, done, 1)
              start = s.find(done)
              dep = s.find('  - **Dependencies:**', start)
              if dep < 0:
                  raise SystemExit('DM-24 dependency line missing')
              end = s.find('\n', dep)
              notes = '''\n  - **Implementation notes (2026-09-11):** Canonical logical episode identity is persisted in JobStore/metadata and projected through queue/overlay paths. Start/adoption now resolves exact logical identity first, migrates legacy JobStore rows whose metadata reconstructs that identity, repairs a missing executor projection from the durable task snapshot, and only then permits URL fallback for evidence that genuinely has no logical identity. Known different logical IDs are fenced from URL/filename collapse.\n  - **Confirmed root cause:** legacy JobStore rows without `logicalId` were invisible to `allForLogicalId()` even when presentation metadata could reconstruct the episode identity. The tracking-URL fallback that followed could therefore miss the correct execution or collide with another logical episode.\n  - **Verification passed:** prior RED reproduction plus GREEN legacy-adoption/different-logical-ID fencing, canonical identity persistence/overlay/provider suites, DM-05 lifecycle-authority regressions, and analyzer.\n'''
              s = s[:end] + notes + s[end:]
              p.write_text(s)
          elif done not in s:
              raise SystemExit('DM-24 checklist marker missing')
          PY
          rm -f .github/workflows/agent-dm24-completion.yml
          rm -f .github/workflows/agent-dm24-completion-v2.yml
          git add -A
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(downloads): complete canonical logical identity adoption"
          git push origin HEAD:plan/download-manager-reliability
