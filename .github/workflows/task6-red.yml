name: Task 11 Android Policy GREEN

on:
  push:
    branches:
      - refactor/background-downloader-authority

permissions:
  contents: read

jobs:
  android-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/background-downloader-authority
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Run Android policy tests
        run: flutter test test/core/services/download_android_transport_policy_test.dart
      - name: Analyze Android policy files
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos \
            lib/core/services/download_transport_policy.dart \
            lib/core/services/background_downloader_transport.dart \
            test/core/services/download_android_transport_policy_test.dart
      - name: Build Android debug APK
        run: flutter build apk --debug
