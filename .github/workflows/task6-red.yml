name: Task 9 Episode Queue Verification

on:
  push:
    branches:
      - refactor/background-downloader-authority

permissions:
  contents: read

jobs:
  episode-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/background-downloader-authority
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Run Task 9 queue suite
        run: |
          flutter test \
            test/core/services/download_plugin_episode_queue_test.dart \
            test/core/services/download_job_state_queue_authority_test.dart \
            test/features/settings/presentation/download_concurrency_settings_test.dart
      - name: Analyze queue files
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos \
            lib/core/services/download_concurrency.dart \
            lib/core/services/download_parallel.dart \
            lib/core/services/download_service.dart \
            test/core/services/download_plugin_episode_queue_test.dart
