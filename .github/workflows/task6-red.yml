name: Task 8 Range Isolation RED

on:
  push:
    branches:
      - refactor/background-downloader-authority

permissions:
  contents: read

jobs:
  range-isolation-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/background-downloader-authority
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Run Task 8 wiring RED
        run: |
          flutter test \
            test/core/services/download_plugin_source_refresh_test.dart \
            test/core/services/download_source_refresh_service_wiring_test.dart
