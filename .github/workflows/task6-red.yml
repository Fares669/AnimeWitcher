name: Task 10 iOS Ownership Recheck

on:
  push:
    branches:
      - refactor/background-downloader-authority

permissions:
  contents: read

jobs:
  ios-ownership:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/background-downloader-authority
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Run iOS ownership contracts
        run: |
          flutter test \
            test/core/services/ios_multipart_ownership_handoff_source_test.dart \
            test/core/services/download_native_claim_lifecycle_source_test.dart
      - name: Build iOS release without signing
        run: flutter build ios --release --no-codesign
