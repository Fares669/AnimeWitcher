name: Task 7 RED

on:
  push:
    branches:
      - refactor/background-downloader-authority

permissions:
  contents: read

jobs:
  contract-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/background-downloader-authority
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run Task 7 RED contract
        run: flutter test test/core/services/download_plugin_parallel_contract_test.dart
