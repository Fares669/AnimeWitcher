name: Task 13 Reliability Matrix

on:
  push:
    branches:
      - refactor/background-downloader-authority

permissions:
  contents: read

jobs:
  reliability-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/background-downloader-authority
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Run Task 13 chaos matrix
        run: flutter test test/core/services/download_manager_chaos_matrix_test.dart
      - name: Analyze download migration files
        run: flutter analyze --no-fatal-warnings --no-fatal-infos lib/core/services test/core/services
