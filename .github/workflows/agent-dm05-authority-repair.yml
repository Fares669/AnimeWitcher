name: Agent DM05 Authority Repair

on:
  push:
    branches:
      - plan/download-manager-reliability
    paths:
      - .github/workflows/agent-dm05-authority-repair.yml

permissions:
  contents: write

concurrency:
  group: agent-dm05-authority-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Prepare
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          git reset --hard HEAD
      - name: Apply DM-05 sole-authority fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          state_path = Path('lib/core/services/download_job_state.dart')
          state = state_path.read_text()
          needle = '''bool downloadJobUserPaused(DownloadJobState state) =>
              state == DownloadJobState.pausedByUser;
          '''
          replacement = '''bool downloadJobUserPaused(DownloadJobState state) =>
              state == DownloadJobState.pausedByUser;

          /// Durable user-pause intent is encoded in logical state only.
          bool downloadJobHasUserPauseIntent(DownloadJobState state) =>
              state == DownloadJobState.pausing ||
              state == DownloadJobState.pausedByUser;

          bool downloadJobIsTerminal(DownloadJobState state) =>
              state == DownloadJobState.completed ||
              state == DownloadJobState.canceled ||
              state == DownloadJobState.orphaned;

          /// One-time migration for pre-v6 side flags. Pause wins over queue.
          DownloadJobState migrateLegacyDownloadJobState({
            required DownloadJobState state,
            required bool userPaused,
            required bool queueWaiting,
          }) {
            if (downloadJobIsTerminal(state)) return state;
            if (userPaused) {
              return state == DownloadJobState.pausing
                  ? DownloadJobState.pausing
                  : DownloadJobState.pausedByUser;
            }
            if (queueWaiting) return DownloadJobState.queued;
            return state;
          }
          '''
          if 'downloadJobHasUserPauseIntent' not in state:
              if state.count(needle) != 1:
                  raise SystemExit(f'state anchor count={state.count(needle)}')
              state = state.replace(needle, replacement, 1)
              state_path.write_text(state)

          store_path = Path('lib/core/services/download_job_store.dart')
          store = store_path.read_text()
          store = store.replace('const int kDownloadJobSchemaVersion = 5;', 'const int kDownloadJobSchemaVersion = 6;', 1)

          if 'var state = _jobStateValue' not in store:
              needle = """    final schemaVersion = _intValue(map['schemaVersion'], fallback: 1);
              final durableByteProvenance = _durableByteProvenanceValue(
          """
              replacement = """    final schemaVersion = _intValue(map['schemaVersion'], fallback: 1);
              var state = _jobStateValue(map['state']);
              if (schemaVersion < 6) {
                state = migrateLegacyDownloadJobState(
                  state: state,
                  userPaused: map['userPaused'] == true,
                  queueWaiting: map['queueWaiting'] == true,
                );
              }
              final durableByteProvenance = _durableByteProvenanceValue(
          """
              if store.count(needle) != 1:
                  raise SystemExit(f'fromJson anchor count={store.count(needle)}')
              store = store.replace(needle, replacement, 1)

          store = store.replace("      state: _jobStateValue(map['state']),", "      state: state,", 1)
          store = store.replace("      userPaused: map['userPaused'] == true,\n      queueWaiting: map['queueWaiting'] == true,", "      userPaused: downloadJobHasUserPauseIntent(state),\n      queueWaiting: downloadJobQueueWaiting(state),", 1)
          store = store.replace("    'userPaused': userPaused,\n    'queueWaiting': queueWaiting,", "    'userPaused': downloadJobHasUserPauseIntent(state),\n    'queueWaiting': downloadJobQueueWaiting(state),", 1)

          durable_needle = '''    final durable = next.copyWith(
              logicalId: incomingLogicalId ?? currentLogicalId,
          '''
          durable_replacement = '''    final durable = next.copyWith(
              logicalId: incomingLogicalId ?? currentLogicalId,
              userPaused: downloadJobHasUserPauseIntent(next.state),
              queueWaiting: downloadJobQueueWaiting(next.state),
          '''
          if 'userPaused: downloadJobHasUserPauseIntent(next.state)' not in store:
              if store.count(durable_needle) != 1:
                  raise SystemExit(f'durable anchor count={store.count(durable_needle)}')
              store = store.replace(durable_needle, durable_replacement, 1)
          store_path.write_text(store)

          service_path = Path('lib/core/services/download_service.dart')
          service = service_path.read_text()

          service, n = re.subn(
              r'''      final paused =\n          job\.userPaused \|\|\n          job\.state == DownloadJobState\.pausing \|\|\n          job\.state == DownloadJobState\.pausedByUser;\n      final terminal =\n          job\.state == DownloadJobState\.completed \|\|\n          job\.state == DownloadJobState\.canceled \|\|\n          job\.state == DownloadJobState\.orphaned;\n      if \(paused\) _userPausedIds\.add\(job\.taskId\);\n      if \(job\.queueWaiting \|\| job\.state == DownloadJobState\.queued\) \{\n        _queueWaitingIds\.add\(job\.taskId\);\n      \}\n      if \(terminal\) _terminalJobIds\.add\(job\.taskId\);''',
              '''      final paused = downloadJobHasUserPauseIntent(job.state);\n      final terminal = downloadJobIsTerminal(job.state);\n      if (paused) _userPausedIds.add(job.taskId);\n      if (downloadJobQueueWaiting(job.state)) {\n        _queueWaitingIds.add(job.taskId);\n      }\n      if (terminal) _terminalJobIds.add(job.taskId);''',
              service,
              count=1,
          )
          if n == 0 and 'final paused = downloadJobHasUserPauseIntent(job.state);' not in service:
              raise SystemExit('restore authoritative intent anchor not found')

          service = service.replace(
              '''      final queueWaiting = oldJob == null
                  ? legacyQueueWaiting
                  : oldJob.queueWaiting || oldJob.state == DownloadJobState.queued;
          ''',
              '''      final queueWaiting = oldJob == null
                  ? legacyQueueWaiting
                  : downloadJobQueueWaiting(oldJob.state);
          ''',
              1,
          )
          user_old = '''      final userPaused =
                  isUserPausedMetadata(metadata) ||
                  _userPausedIds.contains(task.taskId) ||
                  oldJob?.userPaused == true ||
                  oldJob?.state == DownloadJobState.pausedByUser ||
                  oldJob?.state == DownloadJobState.pausing;
          '''
          user_new = '''      final userPaused = oldJob != null
                  ? downloadJobHasUserPauseIntent(oldJob.state)
                  : isUserPausedMetadata(metadata) ||
                        _userPausedIds.contains(task.taskId);
          '''
          if user_old in service:
              service = service.replace(user_old, user_new, 1)
          elif user_new not in service:
              raise SystemExit('recovery user pause anchor not found')

          service = service.replace(
              '        userPaused: userPaused,\n        queueWaiting: recoveryPlan.shouldRequeue,',
              '        userPaused: downloadJobHasUserPauseIntent(recoveryPlan.state),\n        queueWaiting: downloadJobQueueWaiting(recoveryPlan.state),',
              1,
          )

          display_old = '''      final showAsWaiting = _queueWaitingIds.contains(task.taskId);
              final showAsRunning =
                  !userPaused &&
                  ((record.status == TaskStatus.running && stillNative) ||
                      (shouldContinue && !showAsWaiting));
              _publishProgress(
                trackingUrl: trackingUrl,
                taskId: task.taskId,
                progress: progress,
                totalSize: expectedBytes,
                status: showAsWaiting
                    ? TaskStatus.enqueued
                    : ((userPaused && userPauseSettled)
                          ? TaskStatus.paused
                          : (showAsRunning
                                ? TaskStatus.running
                                : (stillNative && wasRunning
                                      ? record.status
                                      : TaskStatus.paused))),
              );
          '''
          display_new = '''      final projectedJob = await _jobStore.get(task.taskId);
              final projectedState = projectedJob?.state ?? recoveryPlan.state;
              _publishProgress(
                trackingUrl: trackingUrl,
                taskId: task.taskId,
                progress: progress,
                totalSize: expectedBytes,
                status: downloadJobDisplayStatus(projectedState),
              );
          '''
          if display_old in service:
              service = service.replace(display_old, display_new, 1)
          elif display_new not in service:
              raise SystemExit('recovery display anchor not found')

          range_old = '''          state: _userPausedIds.contains(task.taskId)
                      ? DownloadJobState.pausedByUser
                      : DownloadJobState.interrupted,
          '''
          range_new = '''          state: downloadJobHasUserPauseIntent(
                    (await _jobStore.get(task.taskId))?.state ??
                        DownloadJobState.interrupted,
                  )
                      ? DownloadJobState.pausedByUser
                      : DownloadJobState.interrupted,
          '''
          if range_old in service:
              service = service.replace(range_old, range_new, 1)
          service_path.write_text(service)

          plan_path = Path('DOWNLOAD_MANAGER_PLAN.md')
          plan = plan_path.read_text()
          marker = '- [ ] **DM-05 — Make `DownloadJobState` the sole logical lifecycle authority**'
          if marker in plan:
              plan = plan.replace(marker, marker.replace('[ ]', '[x]'), 1)
              next_marker = '- [ ] **DM-24'
              idx = plan.find(next_marker, plan.find(marker.replace('[ ]', '[x]')))
              if idx < 0:
                  raise SystemExit('DM-24 marker not found after DM-05')
              notes = '''  - **Implementation notes (2026-09-11):** JobStore schema v6 makes `DownloadJobState` the only durable lifecycle authority. `userPaused` and `queueWaiting` are compatibility projections derived from state; schema-v5 side flags migrate once into explicit state. Startup recovery ignores stale metadata/plugin pause/queue replicas whenever a JobStore row exists, and recovery UI status is projected from logical state.\n  - **Confirmed root cause:** recovery planning was JobState-first, but `_recoverPersistedDownloads()` recomputed pause intent from stale metadata/in-memory flags afterward, allowing a stale replica to contradict an authoritative running job. JobStore also serialized contradictory side flags.\n  - **Verification:** RED regression for contradictory flags/startup recovery plus focused DM-05, JobStore, recovery, runtime-ownership and analyzer checks.\n\n'''
              plan = plan[:idx] + notes + plan[idx:]
              plan_path.write_text(plan)
          PY
      - name: Format
        run: dart format lib/core/services/download_job_state.dart lib/core/services/download_job_store.dart lib/core/services/download_service.dart test/core/services/download_job_single_authority_test.dart
      - name: DM-05 focused GREEN regressions
        run: |
          flutter test \
            test/core/services/download_job_single_authority_test.dart \
            test/core/services/download_job_state_authority_test.dart \
            test/core/services/download_job_state_queue_authority_test.dart \
            test/core/services/download_job_store_test.dart \
            test/core/services/download_recovery_reconciliation_guard_test.dart \
            test/core/services/download_runtime_ownership_test.dart \
            test/features/library/presentation/downloads_job_state_authority_test.dart \
            --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Commit DM-05
        run: |
          rm -f .github/workflows/agent-dm05-authority-repair.yml
          rm -f .github/workflows/agent-dm05-overlay-fix.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(downloads): make JobState sole lifecycle authority"
          git push origin HEAD:plan/download-manager-reliability
