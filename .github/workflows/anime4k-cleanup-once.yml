name: Anime4K cleanup one shot

on:
  push:
    branches:
      - feat/anime4k-ios-performance
    paths:
      - .github/workflows/anime4k-cleanup-once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/anime4k-ios-performance
          fetch-depth: 0
      - name: Apply approved Anime4K cleanup
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace(path, old, new, expected=None):
              text = read(path)
              count = text.count(old)
              if expected is not None and count != expected:
                  raise SystemExit(f'{path}: expected {expected} copies of {old!r}, found {count}')
              if expected is None and count == 0:
                  raise SystemExit(f'{path}: missing expected text {old!r}')
              write(path, text.replace(old, new))

          def sub(path, pattern, repl, *, expected=None, flags=0):
              text = read(path)
              updated, count = re.subn(pattern, repl, text, flags=flags)
              if expected is not None and count != expected:
                  raise SystemExit(f'{path}: expected {expected} regex replacements, found {count}: {pattern}')
              if expected is None and count == 0:
                  raise SystemExit(f'{path}: regex did not match: {pattern}')
              write(path, updated)

          # 1) The sample asset is a ByteData view. Copy only the view, not the
          # entire backing buffer (which can contain prefix/suffix bytes).
          replace(
              'lib/features/player/presentation/widgets/anime4k_sample_preview.dart',
              'await file.writeAsBytes(bytes.buffer.asUint8List(), flush: true);',
              'await file.writeAsBytes(\n'
              '      bytes.buffer.asUint8List(bytes.offsetInBytes, bytes.lengthInBytes),\n'
              '      flush: true,\n'
              '    );',
              expected=1,
          )

          # 2) Remove persisted Eco/Auto and MetalFX settings. Manual Anime4K
          # mode/quality remain deterministic and unchanged.
          settings = 'lib/features/settings/presentation/player_settings_provider.dart'
          sub(
              settings,
              r"\n  /// Apple-only adaptive mode\..*?\n  final bool anime4kMetalFxEnabled;\n",
              '',
              expected=1,
              flags=re.S,
          )
          replace(settings, '    this.anime4kEcoEnabled = false,\n', '', expected=1)
          replace(settings, '    this.anime4kMetalFxEnabled = false,\n', '', expected=1)
          replace(settings, '    bool? anime4kEcoEnabled,\n', '', expected=1)
          replace(settings, '    bool? anime4kMetalFxEnabled,\n', '', expected=1)
          replace(settings, '      anime4kEcoEnabled: anime4kEcoEnabled ?? this.anime4kEcoEnabled,\n', '', expected=1)
          sub(
              settings,
              r"      anime4kMetalFxEnabled:\n          anime4kMetalFxEnabled \?\? this\.anime4kMetalFxEnabled,\n",
              '',
              expected=1,
          )
          sub(
              settings,
              r"\n    final anime4kEcoEnabled =\n.*?\n    final anime4kQuality =",
              '\n    final anime4kQuality =',
              expected=1,
              flags=re.S,
          )
          replace(settings, '      anime4kEcoEnabled: anime4kEcoEnabled,\n', '', expected=1)
          replace(settings, '      anime4kMetalFxEnabled: anime4kMetalFxEnabled,\n', '', expected=1)
          sub(
              settings,
              r"\n  Future<void> setAnime4kEcoEnabled\(bool val\) async \{.*?\n  Future<void> setAnime4kMode",
              '\n  Future<void> setAnime4kMode',
              expected=1,
              flags=re.S,
          )

          # 3) Remove Eco/MetalFX/performance-log UI and diagnostics while
          # keeping the normal mode/quality/folder/sample preview controls.
          dialog = 'lib/features/settings/presentation/widgets/anime4k_dialog.dart'
          replace(dialog, "import '../../../player/data/anime4k_performance_log.dart';\n", '', expected=1)
          sub(
              dialog,
              r"\nFuture<void> showAnime4kPerformanceLogDialog\(.*?\nclass _Anime4kDialog",
              '\nclass _Anime4kDialog',
              expected=1,
              flags=re.S,
          )
          replace(dialog, '    final diagnostics = ref.watch(anime4kDiagnosticsProvider);\n', '', expected=1)
          sub(
              dialog,
              r"\n              if \(settings\.anime4kEnabled &&\n                  \(Platform\.isIOS \|\| Platform\.isMacOS\)\) \.\.\.\[.*?\n              if \(settings\.anime4kEnabled\) \.\.\.\[",
              '\n              if (settings.anime4kEnabled) ...[',
              expected=1,
              flags=re.S,
          )
          sub(
              dialog,
              r"\n        TextButton\.icon\(\n          onPressed: \(\) => showAnime4kPerformanceLogDialog\(context, ref\),.*?\n        \),",
              '',
              expected=1,
              flags=re.S,
          )
          text = read(dialog)
          if 'Clipboard' not in text:
              text = text.replace("import 'package:flutter/services.dart';\n", '')
          if 'Platform.' not in text:
              text = text.replace("import 'dart:io';\n\n", '')
          write(dialog, text)

          # 4) Keep the Apple wrapper only for SDR safety + exact mpv fallback.
          # The adaptive governor, timers, bypass state and file logging are gone.
          controller = '''import 'dart:async';
          import 'dart:io';

          import 'package:flutter/foundation.dart';
          import 'package:flutter_riverpod/flutter_riverpod.dart';
          import 'package:media_kit/media_kit.dart';

          import '../../settings/presentation/player_settings_provider.dart';
          import '../data/anime4k.dart';
          import '../data/anime4k_color_signal.dart';
          import '../data/anime4k_metal_bridge.dart';
          import '../data/anime4k_metal_ffi.dart';
          import '../data/anime4k_shader_library.dart';
          import 'player_controller_base.dart' as base;

          export 'player_controller_base.dart'
              hide PlayerController, playerControllerProvider;

          /// Apple-specific safety wrapper around the established player.
          ///
          /// The native Anime4K path remains SDR-only until HDR output is
          /// validated end-to-end. HDR or ambiguous color metadata therefore
          /// restores the exact resolved mpv GLSL pipeline before native Metal
          /// can process a frame.
          class PlayerController extends base.PlayerController {
            Anime4kMetalBridge? _anime4kMetalBridge;

            bool get _isApplePlatform => Platform.isIOS || Platform.isMacOS;

            @override
            base.PlayerState build() {
              final initial = super.build();
              ref.listen(playerSettingsProvider, (previous, next) {
                final before = previous?.asData?.value;
                final after = next.asData?.value;
                if (!_anime4kSettingsChanged(before, after)) return;
                unawaited(applyAnime4kShaders());
              });
              return initial;
            }

            bool _anime4kSettingsChanged(PlayerSettings? previous, PlayerSettings? next) {
              if (identical(previous, next)) return false;
              if (previous == null || next == null) return previous != next;
              return previous.anime4kEnabled != next.anime4kEnabled ||
                  previous.anime4kMode != next.anime4kMode ||
                  previous.anime4kQuality != next.anime4kQuality ||
                  previous.anime4kShaderDirectory != next.anime4kShaderDirectory;
            }

            Anime4kMetalBridge? _metalBridge() {
              final existing = _anime4kMetalBridge;
              if (existing != null) return existing;
              if (!_isApplePlatform) return null;
              final bindings = Anime4kMetalFfiBindings.tryCreate();
              if (bindings == null) return null;
              final bridge = Anime4kMetalBridge(bindings: bindings);
              _anime4kMetalBridge = bridge;
              return bridge;
            }

            Future<Anime4kColorSignal> _readAnime4kColorSignal(
              NativePlayer platform,
            ) async {
              String? gamma;
              String? colorSystem;

              for (var attempt = 0; attempt < 5; attempt++) {
                try {
                  gamma = (await platform.getProperty('video-params/gamma')).trim();
                } catch (_) {
                  gamma = null;
                }
                try {
                  colorSystem = (await platform.getProperty('video-params/colormatrix'))
                      .trim();
                } catch (_) {
                  colorSystem = null;
                }

                final signal = classifyAnime4kColorSignal(
                  transfer: gamma,
                  colorSystem: colorSystem,
                );
                if (signal != Anime4kColorSignal.unknown) return signal;
                if (attempt < 4) {
                  await Future<void>.delayed(const Duration(milliseconds: 60));
                  if (isDisposed) return Anime4kColorSignal.unknown;
                }
              }
              return Anime4kColorSignal.unknown;
            }

            @override
            Future<void> applyAnime4kShaders() async {
              try {
                if (_isApplePlatform && !currentState.useExoPlayer) {
                  final settings = ref.read(playerSettingsProvider).asData?.value;
                  final platform = player.platform;
                  if (settings != null &&
                      settings.anime4kEnabled &&
                      settings.anime4kMode != Anime4kMode.off &&
                      platform is NativePlayer) {
                    final colorSignal = await _readAnime4kColorSignal(platform);
                    if (isDisposed) return;
                    if (colorSignal != Anime4kColorSignal.sdr) {
                      await _applyResolvedMpvFallback(platform: platform);
                      return;
                    }
                  }
                }

                await super.applyAnime4kShaders();
              } catch (error) {
                // Anime4K is optional and settings can become available before
                // playback initialization. Never turn a reapply into a player
                // failure; the established mpv path remains authoritative.
                if (kDebugMode) {
                  debugPrint('Anime4K setup skipped: $error');
                }
              }
            }

            Future<void> _applyResolvedMpvFallback({NativePlayer? platform}) async {
              final nativePlatform =
                  platform ??
                  (player.platform is NativePlayer ? player.platform as NativePlayer : null);
              if (nativePlatform == null) return;
              final settings =
                  ref.read(playerSettingsProvider).asData?.value ??
                  const PlayerSettings();
              final pipeline = await ref
                  .read(anime4kShaderLibraryProvider)
                  .pipeline(
                    mode: settings.anime4kEnabled
                        ? settings.anime4kMode
                        : Anime4kMode.off,
                    quality: settings.anime4kQuality,
                    directory: settings.anime4kShaderDirectory,
                  );

              final metalBridge = _metalBridge();
              if (metalBridge != null) {
                try {
                  final handle = await nativePlatform.handle;
                  if (handle > 0) metalBridge.disable(handle: handle);
                } catch (_) {
                  // The native backend is optional; continue with mpv fallback.
                }
              }

              if (pipeline.isEmpty) {
                await nativePlatform.setProperty('glsl-shaders', '');
                return;
              }

              String currentVo = '';
              try {
                currentVo = (await nativePlatform.getProperty('current-vo')).trim();
              } catch (_) {
                currentVo = '';
              }
              if (!anime4kGpuRendererSupportsShaders(currentVo)) {
                await nativePlatform.setProperty('glsl-shaders', '');
                return;
              }

              await nativePlatform.setProperty('glsl-shaders', pipeline.value);
              final applied = (await nativePlatform.getProperty('glsl-shaders')).trim();
              if (pipeline.value.isNotEmpty && applied.isEmpty) return;

              final gpuDumbMode = (await nativePlatform.getProperty('gpu-dumb-mode'))
                  .trim()
                  .toLowerCase();
              if (gpuDumbMode == 'yes') {
                await nativePlatform.setProperty('glsl-shaders', '');
              }
            }
          }

          final playerControllerProvider =
              NotifierProvider.autoDispose<PlayerController, base.PlayerState>(
                PlayerController.new,
              );
          '''
          # Strip the YAML indentation intentionally embedded above.
          controller = '\n'.join(line[10:] if line.startswith('          ') else line for line in controller.splitlines()) + '\n'
          write('lib/features/player/presentation/player_controller.dart', controller)

          # 5) Retire the adaptive policy itself but preserve backend routing,
          # native status, thermal telemetry vocabulary and dimension logic.
          performance = '''/// Renderer/backend currently responsible for Anime4K processing.
          enum Anime4kBackend { mpvGlsl, metal }

          /// Native Apple Metal availability/result used to decide whether mpv must own
          /// the Anime4K pipeline instead. HDR stays explicit so the Apple safety gate
          /// can fail closed without allowing both backends to process one frame.
          enum Anime4kNativeMetalState { unavailable, ready, failed, unsupportedHdr }

          class Anime4kBackendRoute {
            const Anime4kBackendRoute({
              required this.backend,
              required this.enableMetal,
              required this.enableMpvShaders,
            });

            final Anime4kBackend backend;
            final bool enableMetal;
            final bool enableMpvShaders;
          }

          Anime4kBackendRoute resolveAnime4kBackendRoute({
            required bool isApplePlatform,
            required bool anime4kEnabled,
            required bool hasResolvedPipeline,
            required Anime4kNativeMetalState metalState,
          }) {
            if (!anime4kEnabled || !hasResolvedPipeline) {
              return const Anime4kBackendRoute(
                backend: Anime4kBackend.mpvGlsl,
                enableMetal: false,
                enableMpvShaders: false,
              );
            }

            if (isApplePlatform && metalState == Anime4kNativeMetalState.ready) {
              return const Anime4kBackendRoute(
                backend: Anime4kBackend.metal,
                enableMetal: true,
                enableMpvShaders: false,
              );
            }

            return const Anime4kBackendRoute(
              backend: Anime4kBackend.mpvGlsl,
              enableMetal: false,
              enableMpvShaders: true,
            );
          }

          /// Platform-neutral thermal state exposed by optional native telemetry.
          enum Anime4kThermalLevel { nominal, fair, serious, critical }

          class Anime4kProcessingDimensions {
            const Anime4kProcessingDimensions({
              required this.width,
              required this.height,
            });

            final int width;
            final int height;

            double get aspectRatio => width / height;
          }

          Anime4kProcessingDimensions resolveAnime4kProcessingDimensions({
            required int sourceWidth,
            required int sourceHeight,
            required int drawableWidth,
            required int drawableHeight,
            Anime4kProcessingDimensions? previous,
          }) {
            if (sourceWidth <= 0 || sourceHeight <= 0) {
              throw ArgumentError('Anime4K source dimensions must be positive');
            }

            if (drawableWidth <= 0 || drawableHeight <= 0) {
              return previous ??
                  Anime4kProcessingDimensions(
                    width: _floorEven(sourceWidth),
                    height: _floorEven(sourceHeight),
                  );
            }

            final sourceAspect = sourceWidth / sourceHeight;
            final drawableAspect = drawableWidth / drawableHeight;
            final maxWidth = _floorEven(drawableWidth);
            final maxHeight = _floorEven(drawableHeight);

            final Anime4kProcessingDimensions candidate;
            if (sourceAspect >= drawableAspect) {
              final width = maxWidth;
              final height = _floorEven((width / sourceAspect).floor());
              candidate = Anime4kProcessingDimensions(width: width, height: height);
            } else {
              final height = maxHeight;
              final width = _floorEven((height * sourceAspect).floor());
              candidate = Anime4kProcessingDimensions(width: width, height: height);
            }

            if (previous != null &&
                _sameSourceAspect(previous.aspectRatio, sourceAspect) &&
                _withinLayoutJitter(previous.width, candidate.width) &&
                _withinLayoutJitter(previous.height, candidate.height)) {
              return previous;
            }

            return candidate;
          }

          int _floorEven(int value) {
            final positive = value < 2 ? 2 : value;
            return positive.isEven ? positive : positive - 1;
          }

          bool _sameSourceAspect(double previous, double source) {
            return (previous - source).abs() / source <= 0.01;
          }

          bool _withinLayoutJitter(int previous, int candidate) {
            return (previous - candidate).abs() / previous <= 0.02;
          }
          '''
          performance = '\n'.join(line[10:] if line.startswith('          ') else line for line in performance.splitlines()) + '\n'
          write('lib/features/player/data/anime4k_performance.dart', performance)

          # 6) Remove bypass/strategy from the Dart bridge and FFI surface.
          bridge = 'lib/features/player/data/anime4k_metal_bridge.dart'
          sub(bridge, r"\n  /// Enables/disables temporary Eco pass-through.*?\n  int setBypass\(int handle, bool bypass\);\n", '', expected=1, flags=re.S)
          replace(bridge, "    String upscaleStrategy = 'fullAnime4K',\n", '', expected=1)
          replace(bridge, "        'upscaleStrategy': upscaleStrategy,\n", '', expected=1)
          sub(bridge, r"\n  bool setBypass\(\{required int handle, required bool bypass\}\) \{.*?\n  \}\n", '', expected=1, flags=re.S)
          replace(bridge, '      // Diagnostics/adaptation are optional. Bad telemetry must not interfere\n', '      // Diagnostics are optional. Bad telemetry must not interfere\n', expected=1)

          ffi = 'lib/features/player/data/anime4k_metal_ffi.dart'
          replace(ffi, 'typedef _SetBypassNative = Int32 Function(Uint64, Int32);\ntypedef _SetBypassDart = int Function(int, int);\n', '', expected=1)
          replace(ffi, '      _setBypass = _tryLookupSetBypass(library),\n', '', expected=1)
          replace(ffi, '  final _SetBypassDart? _setBypass;\n', '', expected=1)
          sub(ffi, r"\n  static _SetBypassDart\? _tryLookupSetBypass\(DynamicLibrary library\) \{.*?\n  \}\n", '', expected=1, flags=re.S)
          replace(ffi, "    String upscaleStrategy = 'fullAnime4K',\n", '', expected=1)
          replace(ffi, "      'upscaleStrategy': upscaleStrategy,\n", '', expected=1)
          sub(ffi, r"\n  @override\n  int setBypass\(int handle, bool bypass\) \{.*?\n  \}\n", '', expected=1, flags=re.S)

          # 7) Base player always requests the established full Anime4K native path.
          base = 'lib/features/player/presentation/player_controller_base.dart'
          sub(
              base,
              r"\n      final useMetalFxExperiment = settings\?\.anime4kMetalFxEnabled \?\? false;\n      final upscaleStrategy = useMetalFxExperiment\n          \? 'restoreDenoiseMetalFXSpatial'\n          : 'fullAnime4K';",
              '',
              expected=1,
          )
          replace(base, '              upscaleStrategy: upscaleStrategy,\n', '', expected=1)

          # 8) Native runtime keeps one deterministic Anime4K pipeline. Remove the
          # MetalFX strategy/scaler and the temporary processing bypass API.
          runtime = 'native/anime4k_metal/Anime4KMetalRuntime.swift'
          sub(runtime, r"\nenum Anime4KAppleUpscaleStrategy: String, Equatable \{.*?\n\}\n", '', expected=1, flags=re.S)
          replace(runtime, '    let upscaleStrategy: Anime4KAppleUpscaleStrategy\n', '', expected=1)
          replace(runtime, '        precision: Anime4KMetalPrecisionPolicy = .mixedFP16,\n        upscaleStrategy: Anime4KAppleUpscaleStrategy = .fullAnime4K\n', '        precision: Anime4KMetalPrecisionPolicy = .mixedFP16\n', expected=1)
          replace(runtime, '        self.upscaleStrategy = upscaleStrategy\n', '', expected=1)
          replace(runtime, '    case metalFXUnavailable\n    case metalFXPipeline(String)\n', '', expected=1)
          sub(runtime, r"\n        case \.metalFXUnavailable:.*?\n            return \"Anime4K MetalFX spatial scaler failed: \\(detail\)\"", '', expected=1, flags=re.S)
          replace(runtime, '    private let metalFXScaler: Anime4KMetalFXScaler\n', '', expected=1)
          replace(runtime, '        self.metalFXScaler = Anime4KMetalFXScaler(device: device)\n', '', expected=1)
          sub(
              runtime,
              r"            let shaderPaths: \[String\]\n            switch configuration\.upscaleStrategy \{.*?\n            \}\n\n            var nextGroups",
              '            let shaderPaths = configuration.shaderPaths\n\n            var nextGroups',
              expected=1,
              flags=re.S,
          )
          sub(
              runtime,
              r"\n            if snapshot\.configuration\.upscaleStrategy == \.restoreDenoiseMetalFXSpatial &&.*?\n            \}\n            try encodeFinalCopy",
              '\n            try encodeFinalCopy',
              expected=1,
              flags=re.S,
          )
          sub(
              runtime,
              r"\n    private func experimentalShaderPaths\(_ shaderPaths: \[String\]\) -> \[String\] \{.*?\n    \}\n\n    private func encode\(",
              '\n    private func encode(',
              expected=1,
              flags=re.S,
          )

          media = 'native/anime4k_metal/Anime4KMediaKitBridge.swift'
          replace(media, '    private var bypassedRuntimeKeys: Set<UInt> = []\n', '', expected=1)
          replace(media, '                bypassedRuntimeKeys.remove(key)\n', '', expected=1)
          sub(media, r"\n    /// Temporarily bypasses Anime4K frame processing.*?\n    \}\n\n    func telemetry", '\n    func telemetry', expected=1, flags=re.S)
          replace(media, '                  let configuration = configurations[key],\n                  !bypassedRuntimeKeys.contains(key) else {', '                  let configuration = configurations[key] else {', expected=1)
          replace(media, '                precision: prepared.configuration.precision,\n                upscaleStrategy: prepared.configuration.upscaleStrategy\n', '                precision: prepared.configuration.precision\n', expected=1)
          sub(media, r"\n            // Intentional Eco bypass is not a late/dropped frame\..*?\n            if bypassedRuntimeKeys\.contains\(key\) \{ return nil \}", '', expected=1, flags=re.S)
          replace(media, '            // Saturation and intentional Eco bypass are both non-blocking:\n', '            // Saturation is non-blocking:\n', expected=1)
          replace(media, '            bypassedRuntimeKeys.remove(key)\n', '', expected=1)

          capi = 'native/anime4k_metal/Anime4KMetalCAPI.swift'
          replace(capi, '    let upscaleStrategy: String?\n', '', expected=2)
          sub(
              capi,
              r",\n                  let precision = Anime4KMetalPrecisionPolicy\(rawValue: payload\.precision\),\n                  let upscaleStrategy = Anime4KAppleUpscaleStrategy\(\n                      rawValue: payload\.upscaleStrategy \?\? \"fullAnime4K\"\n                  \) else \{",
              ',\n                  let precision = Anime4KMetalPrecisionPolicy(rawValue: payload.precision) else {',
              expected=1,
          )
          replace(capi, '                precision: precision,\n                upscaleStrategy: upscaleStrategy\n', '                precision: precision\n', expected=2)
          sub(
              capi,
              r",\n                  let precision = Anime4KMetalPrecisionPolicy\(rawValue: payload\.precision\),\n                  let upscaleStrategy = Anime4KAppleUpscaleStrategy\(\n                      rawValue: payload\.upscaleStrategy \?\? \"fullAnime4K\"\n                  \),\n                  let device = MTLCreateSystemDefaultDevice\(\) else \{",
              ',\n                  let precision = Anime4KMetalPrecisionPolicy(rawValue: payload.precision),\n                  let device = MTLCreateSystemDefaultDevice() else {',
              expected=1,
          )
          sub(capi, r"\n    /// Enables/disables a temporary per-player pass-through state.*?\n    \}\n\n    static func disable", '\n    static func disable', expected=1, flags=re.S)
          sub(capi, r"\n@_cdecl\(\"animewitcher_anime4k_metal_set_bypass\"\).*?\n\}\n\n@_cdecl\(\"animewitcher_anime4k_metal_disable\"\)", '\n@_cdecl("animewitcher_anime4k_metal_disable")', expected=1, flags=re.S)
          replace(capi, '            // strongest Eco reaction rather than overstressing the device.\n', '            // strongest known pressure level.\n', expected=1)

          # 9) Retire source files and tests that exist only for the removed
          # experiments/logger. Shared bridge/C API tests are adjusted below.
          delete_paths = [
              'lib/features/player/data/anime4k_eco_governor.dart',
              'lib/features/player/data/anime4k_performance_log.dart',
              'native/anime4k_metal/Anime4KMetalFXScaler.swift',
              'test/features/player/anime4k_eco_controller_wiring_test.dart',
              'test/features/player/anime4k_eco_governor_test.dart',
              'test/features/player/anime4k_manual_telemetry_sampling_test.dart',
              'test/features/player/anime4k_metalfx_experiment_contract_test.dart',
              'test/features/player/anime4k_performance_log_contract_test.dart',
              'test/features/player/anime4k_performance_test.dart',
              'test/features/settings/presentation/anime4k_eco_settings_test.dart',
              'docs/superpowers/plans/2026-09-13-anime4k-metalfx-log-preview.md',
              'docs/superpowers/specs/2026-09-13-anime4k-metalfx-log-preview-design.md',
          ]
          for path in delete_paths:
              p = Path(path)
              if p.exists():
                  p.unlink()

          bridge_test = 'test/features/player/anime4k_metal_bridge_test.dart'
          sub(bridge_test, r"\n    test\('temporary Eco bypass.*?\n    \}\);", '', expected=1, flags=re.S)
          replace(bridge_test, '    this.bypassResult = 1,\n', '', expected=1)
          replace(bridge_test, '  final int bypassResult;\n', '', expected=1)
          replace(bridge_test, '  int? bypassHandle;\n  bool? bypassValue;\n', '', expected=1)
          sub(bridge_test, r"\n  @override\n  int setBypass\(int handle, bool bypass\) \{.*?\n  \}\n", '', expected=1, flags=re.S)
          replace(bridge_test, "    test('decodes live native dimensions with telemetry for the Eco governor', () {", "    test('decodes live native dimensions from optional telemetry', () {", expected=1)

          capi_test = 'native/anime4k_metal/Anime4KMetalCAPITests.swift'
          sub(
              capi_test,
              r"\n        precondition\(\n            Anime4KMetalDartAPI\.setBypass\(.*?\n        \)\n\n        var telemetryBytes",
              '\n        var telemetryBytes',
              expected=1,
              flags=re.S,
          )
          sub(
              capi_test,
              r"\n        precondition\(\n            Anime4KMetalDartAPI\.setBypass\(\n                handleAddress: 0,.*?\n        \)",
              '',
              expected=1,
              flags=re.S,
          )
          replace(capi_test, '            "upscaleStrategy": "fullAnime4K",\n', '', expected=1)

          # 10) Remove deleted native sources/framework/link symbols from build
          # glue and source-list contracts. This is line-based by design.
          for path in [
              '.github/workflows/anime4k-platform-build.yml',
              '.github/workflows/ios-preview-once.yml',
              'scripts/anime4k_media_kit_patch.rb',
              'scripts/anime4k_metal_capi_install.rb',
              'scripts/test_anime4k_media_kit_patch.rb',
          ]:
              p = Path(path)
              if not p.exists():
                  continue
              lines = p.read_text().splitlines()
              lines = [
                  line for line in lines
                  if 'Anime4KMetalFXScaler.swift' not in line
                  and '-framework MetalFX' not in line
                  and 'animewitcher_anime4k_metal_set_bypass' not in line
              ]
              p.write_text('\n'.join(lines) + '\n')

          # Source-level regression guards for the exact approved cleanup.
          checks = {
              settings: ['anime4kEcoEnabled', 'anime4kMetalFxEnabled'],
              dialog: ['Eco / Auto', 'MetalFX (experimental)', 'Performance log', 'anime4k_performance_log.dart'],
              'lib/features/player/presentation/player_controller.dart': ['Anime4kEco', 'anime4kPerformanceLogProvider', 'anime4kEcoEnabled', 'anime4kMetalFxEnabled'],
              ffi: ['setBypass', 'upscaleStrategy'],
              runtime: ['Anime4KMetalFXScaler', 'restoreDenoiseMetalFXSpatial', 'upscaleStrategy'],
              capi: ['setBypass', 'upscaleStrategy'],
          }
          for path, forbidden in checks.items():
              text = read(path)
              for needle in forbidden:
                  if needle in text:
                      raise SystemExit(f'{path}: retired token remains: {needle}')

          # The one-shot migration deletes itself in the same commit.
          Path('.github/workflows/anime4k-cleanup-once.yml').unlink()
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: simplify Anime4K Apple runtime'
          git push origin HEAD:feat/anime4k-ios-performance
