name: Anime4K Preview Black Fix One Shot

on:
  push:
    branches:
      - feat/anime4k-ios-performance
    paths:
      - .github/workflows/anime4k-preview-black-fix-once.yml
      - scripts/anime4k_preview_black_fix_once.py

permissions:
  contents: write

jobs:
  fix:
    name: RED GREEN black preview capture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Verify RED regression
        shell: bash
        run: |
          set +e
          flutter test test/features/player/anime4k_sample_preview_test.dart > /tmp/anime4k-preview-red.log 2>&1
          status=$?
          set -e
          cat /tmp/anime4k-preview-red.log
          if [ "$status" -eq 0 ]; then
            echo "Expected black-preview regression test to fail before production fix" >&2
            exit 1
          fi
          grep -q "preview never rasterizes an external video texture through Flutter" /tmp/anime4k-preview-red.log
      - name: Apply production fix
        run: python3 scripts/anime4k_preview_black_fix_once.py
      - name: Format changed files
        run: dart format lib/features/player/presentation/widgets/anime4k_sample_preview.dart test/features/player/anime4k_sample_preview_test.dart
      - name: Verify GREEN focused preview test
        run: flutter test test/features/player/anime4k_sample_preview_test.dart
      - name: Commit production fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/player/presentation/widgets/anime4k_sample_preview.dart test/features/player/anime4k_sample_preview_test.dart
          git diff --cached --check
          git commit -m "fix: avoid black Anime4K preview texture capture"
          git push origin HEAD:${GITHUB_REF_NAME}
