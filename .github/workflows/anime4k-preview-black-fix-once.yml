name: Anime4K Preview Black Fix One Shot

on:
  push:
    branches:
      - feat/anime4k-ios-performance
    paths:
      - .github/workflows/anime4k-preview-black-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    name: RED GREEN black preview capture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Verify RED regression
        shell: bash
        run: |
          set +e
          flutter test test/features/player/anime4k_sample_preview_test.dart > /tmp/anime4k-preview-red.log 2>&1
          status=$?
          set -e
          cat /tmp/anime4k-preview-red.log
          if [ "$status" -eq 0 ]; then
            echo "Expected black-preview regression test to fail before production fix" >&2
            exit 1
          fi
          grep -q "preview never rasterizes an external video texture through Flutter" /tmp/anime4k-preview-red.log
      - name: Apply one-shot native-window capture fix
        shell: bash
        env:
          FALLBACK_METHOD_B64: "   o="
        run: |
          python3 - <<'PY'
          import base64
          import os
          import re
          from pathlib import Path

          path = Path('lib/features/player/presentation/widgets/anime4k_sample_preview.dart')
          text = path.read_text()

          for needle in [
              "import 'dart:ui' as ui;\n",
              "import 'package:flutter/rendering.dart';\n",
              "import '../../data/anime4k_metal_bridge.dart';\n",
              "import '../../data/anime4k_metal_ffi.dart';\n",
              "import '../../data/anime4k_performance.dart';\n",
          ]:
              if needle not in text:
                  raise SystemExit(f'missing expected import: {needle!r}')
              text = text.replace(needle, '', 1)

          text = re.sub(
              r"/// Apple uses the same native Metal backend as playback, but only long enough\n/// to render and capture one processed frame\. The encoded result is cached by\n/// mode, quality, effective backend, and shader pipeline hash, so reopening the\n/// settings does not keep a second renderer alive\. Other platforms, or an\n/// unavailable Apple Metal backend, keep the existing mpv preview as fallback\.\n",
              "/// The preview renders one still through mpv's final video-output window,\n/// captures that processed result once, caches it by mode/quality/backend/hash,\n/// and disposes the renderer. This intentionally avoids rasterizing Flutter's\n/// external Texture, which can produce an all-black image on Apple devices.\n",
              text,
              count=1,
          )
          text = text.replace('  bool _capturingMetal = false;\n', '', 1)
          text = text.replace('\n  final GlobalKey _metalCaptureKey = GlobalKey();\n', '\n', 1)
          text = text.replace('      _capturingMetal = false;\n', '')

          method_start = text.index('  Future<Anime4kProcessingDimensions> _sampleDimensions')
          start_method = text.index('  Future<void> _start() async {', method_start)
          text = text[:method_start] + text[start_method:]

          pattern = re.compile(r"      if \(\(Platform\.isIOS \|\| Platform\.isMacOS\) &&\n          await _startAppleMetalOneShot\(\n            request: request,\n            file: file,\n            pipeline: pipeline,\n          \)\) \{\n        return;\n      \}\n      if \(!_isCurrentRequest\(request\)\) return;\n")
          text, count = pattern.subn('      if (!_isCurrentRequest(request)) return;\n', text, count=1)
          if count != 1:
              raise SystemExit('Apple Metal preview call block changed')

          fallback_start = text.index('  Future<void> _startMpvFallback({')
          fallback_end = text.index('  /// Copies the bundled sample somewhere mpv can open by path.', fallback_start)
          fallback = base64.b64decode(os.environ['FALLBACK_METHOD_B64']).decode()
          text = text[:fallback_start] + fallback + text[fallback_end:]

          text = text.replace('    final controller = _controller;\n', '', 1)
          live_start = text.find('                              else if (controller != null &&\n')
          if live_start < 0:
              raise SystemExit('live external-texture preview block changed')
          live_end = text.find('                              if (!_ready)', live_start)
          if live_end < 0:
              raise SystemExit('preview loading marker changed')
          text = text[:live_start] + text[live_end:]

          if 'RenderRepaintBoundary' in text or 'toImage(' in text or '_metalCaptureKey' in text:
              raise SystemExit('external Texture raster capture still present')
          if '_startAppleMetalOneShot(' in text:
              raise SystemExit('unsafe Apple texture capture path still present')
          path.write_text(text)
          PY
          dart format lib/features/player/presentation/widgets/anime4k_sample_preview.dart \
            test/features/player/anime4k_sample_preview_test.dart
      - name: Verify GREEN focused preview test
        run: flutter test test/features/player/anime4k_sample_preview_test.dart
      - name: Commit production fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Fares669@users.noreply.github.com"
          git add lib/features/player/presentation/widgets/anime4k_sample_preview.dart \
                  test/features/player/anime4k_sample_preview_test.dart
          git diff --cached --check
          git commit -m "fix: avoid black Anime4K preview texture capture"
          git push origin HEAD:${GITHUB_REF_NAME}
