name: Manga Branch Checks

on:
  push:
    branches: [feat/manga-manhwa]

permissions:
  contents: read

concurrency:
  group: manga-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manga-contract:
    name: Manga contract and backend probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies and generate sources
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Library manga RED/GREEN tests
        run: |
          flutter test test/features/library/presentation/library_manga_isolation_test.dart \
            test/features/library/presentation/library_media_selector_test.dart -r expanded

      - name: Home latest manga RED/GREEN tests
        run: |
          flutter test test/features/home/presentation/home_latest_manga_test.dart \
            test/features/home/presentation/home_provider_test.dart \
            test/features/home/presentation/home_screen_test.dart -r expanded

      - name: Download V2 manga migration RED/GREEN tests
        run: |
          flutter test test/core/services/download_v2/download_v2_models_test.dart \
            test/core/services/download_v2/download_v2_identity_test.dart \
            test/core/services/download_v2/download_v2_manga_migration_test.dart -r expanded

      - name: Full Download V2 regression
        run: flutter test test/core/services/download_v2 -r expanded

      - name: Focused Manga contract tests
        run: |
          flutter test test/core/domain/entity/manga_test.dart \
            test/core/extensions/manga_provider_contract_test.dart \
            test/core/extensions/providers/animewitcher_manga_mapping_test.dart \
            test/core/extensions/providers/animewitcher_manga_provider_test.dart \
            test/core/extensions/providers/animewitcher_animation_provider_test.dart -r expanded

      - name: Search domain RED/GREEN tests
        run: |
          flutter test test/features/search/presentation/search_domain_test.dart \
            test/features/search/presentation/search_domain_generation_test.dart \
            test/features/search/presentation/widgets/search_action_buttons_test.dart \
            test/features/search/presentation/widgets/search_header_bar_domain_test.dart -r expanded

      - name: Manga details RED/GREEN tests
        run: |
          flutter test test/features/manga/presentation/manga_details_screen_test.dart \
            test/features/manga/presentation/manga_details_no_anime_extras_test.dart -r expanded

      - name: Manga reader RED/GREEN tests
        run: |
          flutter test test/core/storage/manga_reading_repository_test.dart \
            test/features/manga/reader/manga_reader_test.dart \
            test/features/manga/reader/manga_reader_lazy_pages_test.dart -r expanded

      - name: Full search regression
        run: flutter test test/features/search -r expanded

      - name: Probe AnimeWitcher Manga backend
        run: dart run tool/manga_backend_probe.dart
