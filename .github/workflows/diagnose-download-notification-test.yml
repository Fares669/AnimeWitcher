name: Verify notification readiness fix

on:
  push:
    branches:
      - plan/download-manager-reliability

permissions:
  contents: write

jobs:
  verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Prepare
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Apply guarded production fix and contract regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service = Path('lib/core/services/download_service.dart')
          s = service.read_text()
          old = """  Future<void> applyNotificationSettings(\n    DownloadNotificationPrefs prefs,\n  ) async {\n    await _awaitCommandReadiness('applyNotificationSettings');\n    await _ref.read(storageServiceProvider).setDownloadNotificationPrefs(prefs);\n    _configureDownloadNotifications(prefs);\n  }\n"""
          new = """  Future<void> applyNotificationSettings(\n    DownloadNotificationPrefs prefs,\n  ) async {\n    // Notification preferences are configuration, not download lifecycle\n    // ownership. Persist them even while startup recovery is still settling;\n    // _initialize() reads the same persisted value before recovery begins.\n    await _ref.read(storageServiceProvider).setDownloadNotificationPrefs(prefs);\n    _configureDownloadNotifications(prefs);\n  }\n"""
          if s.count(old) != 1:
              raise SystemExit(f'notification method anchor count={s.count(old)}')
          service.write_text(s.replace(old, new, 1))

          guard = Path('test/core/services/download_initialization_barrier_guard_test.dart')
          g = guard.read_text()
          old_entry = """      (\n        'applyNotificationSettings',\n        'Future<void> applyNotificationSettings(',\n        'void _configureDownloadNotifications(',\n      ),\n"""
          if g.count(old_entry) != 1:
              raise SystemExit(f'notification guard entry count={g.count(old_entry)}')
          g = g.replace(old_entry, '', 1)
          marker = """  test(\n    'foreground reconciliation joins initialization instead of returning early',\n"""
          regression = """  test('notification preferences do not wait for download recovery', () {\n    final source = File('lib/core/services/download_service.dart')\n        .readAsStringSync();\n    final body = methodBody(\n      source,\n      'Future<void> applyNotificationSettings(',\n      'void _configureDownloadNotifications(',\n    );\n\n    expect(\n      body,\n      isNot(contains(\"_awaitCommandReadiness('applyNotificationSettings')\")),\n      reason: 'notification configuration must not be blocked by job recovery',\n    );\n    final persist = body.indexOf('.setDownloadNotificationPrefs(prefs)');\n    final configure = body.indexOf('_configureDownloadNotifications(prefs)');\n    expect(persist, greaterThanOrEqualTo(0));\n    expect(configure, greaterThan(persist));\n  });\n\n"""
          if g.count(marker) != 1:
              raise SystemExit(f'guard insertion marker count={g.count(marker)}')
          guard.write_text(g.replace(marker, regression + marker, 1))
          PY
          dart format lib/core/services/download_service.dart test/core/services/download_initialization_barrier_guard_test.dart
          git diff --check
      - name: Focused Settings regression
        run: flutter test test/features/settings/presentation/download_concurrency_settings_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: Readiness contract regression
        run: flutter test test/core/services/download_initialization_barrier_guard_test.dart test/core/services/download_service_readiness_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: DM-03 focused coverage
        run: |
          flutter test \
            test/core/services/download_command_outcome_test.dart \
            test/core/services/download_control_outcome_guard_test.dart \
            test/core/services/download_start_outcome_guard_test.dart \
            test/core/services/download_initialization_barrier_guard_test.dart \
            test/core/services/download_service_readiness_test.dart \
            test/core/services/download_range_transfer_test.dart \
            test/core/services/download_source_refresh_integrity_test.dart \
            test/core/services/persistent_parallel_download_test.dart \
            test/core/services/persistent_parallel_download_range_identity_test.dart \
            test/core/utils/download_resume_test.dart \
            --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: Full test suite
        run: flutter test --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Commit validated source fix
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/plan/download-manager-reliability | cut -f1)"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "Branch moved during verification: expected $GITHUB_SHA, got $remote_head" >&2
            exit 75
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/core/services/download_service.dart \
            test/core/services/download_initialization_barrier_guard_test.dart
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No validated source changes to commit.' >&2
            exit 1
          fi
          git commit -m 'fix(downloads): decouple notification settings readiness'
          git push origin HEAD:plan/download-manager-reliability
