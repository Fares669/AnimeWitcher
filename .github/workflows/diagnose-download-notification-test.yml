name: Verify notification readiness hypothesis

on:
  push:
    branches:
      - plan/download-manager-reliability

permissions:
  contents: read

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Prepare
        run: |
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Apply production-hypothesis patch in workspace only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/core/services/download_service.dart')
          s = p.read_text()
          old = """  Future<void> applyNotificationSettings(\n    DownloadNotificationPrefs prefs,\n  ) async {\n    await _awaitCommandReadiness('applyNotificationSettings');\n    await _ref.read(storageServiceProvider).setDownloadNotificationPrefs(prefs);\n    _configureDownloadNotifications(prefs);\n  }\n"""
          new = """  Future<void> applyNotificationSettings(\n    DownloadNotificationPrefs prefs,\n  ) async {\n    await _ref.read(storageServiceProvider).setDownloadNotificationPrefs(prefs);\n    _configureDownloadNotifications(prefs);\n  }\n"""
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new))
          PY
          dart format lib/core/services/download_service.dart
      - name: Focused Settings regression
        run: flutter test test/features/settings/presentation/download_concurrency_settings_test.dart --dart-define=ANIMEWITCHER_FIREBASE_API_KEY=test-api-key
      - name: Analyze hypothesis
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
