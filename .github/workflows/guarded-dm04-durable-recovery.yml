name: Guarded DM-04 durable recovery

on:
  push:
    branches: [plan/download-manager-reliability]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guarded-dm04-durable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  implement:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[dm04-durable-applied]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Apply durable recovery patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          # 1) Union inventory: persisted DB > live runtime > durable snapshots.
          path = Path('lib/core/services/download_job_state.dart')
          text = path.read_text()
          old = '''class DownloadRecoveryInventory {
            const DownloadRecoveryInventory({
              required this.records,
              required this.nativeOnlyTaskIds,
            });

            final List<TaskRecord> records;
            final Set<String> nativeOnlyTaskIds;
          }

          /// Build one deterministic startup inventory from the persisted executor
          /// projection plus tasks the runtime still owns. Persisted records win when
          /// both sources know the same execution identity. Native-only logical tasks are
          /// synthesized as running projections so recovery can attach to the existing
          /// writer instead of starting a second transfer. Multipart children remain
          /// implementation details and never become logical episode rows.
          DownloadRecoveryInventory buildDownloadRecoveryInventory({
            required Iterable<TaskRecord> persistedRecords,
            required Iterable<Task> runtimeTasks,
          }) {
            final records = <TaskRecord>[];
            final knownIds = <String>{};

            for (final record in persistedRecords) {
              if (!isLogicalEpisodeDownloadTask(record.task)) continue;
              final taskId = record.task.taskId;
              if (!knownIds.add(taskId)) continue;
              records.add(record);
            }

            final missingRuntimeTasks = <DownloadTask>[];
            for (final task in runtimeTasks) {
              if (!isLogicalEpisodeDownloadTask(task)) continue;
              if (!knownIds.add(task.taskId)) continue;
              missingRuntimeTasks.add(task as DownloadTask);
            }
            missingRuntimeTasks.sort((a, b) => a.taskId.compareTo(b.taskId));

            final nativeOnlyTaskIds = <String>{};
            for (final task in missingRuntimeTasks) {
              nativeOnlyTaskIds.add(task.taskId);
              records.add(TaskRecord(task, TaskStatus.running, 0, -1));
            }

            return DownloadRecoveryInventory(
              records: List<TaskRecord>.unmodifiable(records),
              nativeOnlyTaskIds: Set<String>.unmodifiable(nativeOnlyTaskIds),
            );
          }
          '''
          # Normalize indentation from source before exact replacement.
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines()) + '\n'
          new = '''class DownloadRecoveryInventory {
  const DownloadRecoveryInventory({
    required this.records,
    required this.nativeOnlyTaskIds,
    required this.durableOnlyTaskIds,
  });

  final List<TaskRecord> records;
  final Set<String> nativeOnlyTaskIds;
  final Set<String> durableOnlyTaskIds;
}

/// Build one deterministic startup inventory from every source that can carry
/// a complete logical task descriptor. Source precedence is deliberate:
/// persisted executor projection > live runtime ownership > durable snapshot.
/// A lower-priority replica can fill a missing row but can never replace a
/// stronger source for the same execution identity. Multipart children remain
/// implementation details and never become logical episode rows.
DownloadRecoveryInventory buildDownloadRecoveryInventory({
  required Iterable<TaskRecord> persistedRecords,
  required Iterable<Task> runtimeTasks,
  Iterable<TaskRecord> durableRecords = const <TaskRecord>[],
  Map<String, int> orderByTaskId = const <String, int>{},
}) {
  final records = <TaskRecord>[];
  final knownIds = <String>{};

  for (final record in persistedRecords) {
    if (!isLogicalEpisodeDownloadTask(record.task)) continue;
    if (!knownIds.add(record.task.taskId)) continue;
    records.add(record);
  }

  final missingRuntimeTasks = <DownloadTask>[];
  for (final task in runtimeTasks) {
    if (!isLogicalEpisodeDownloadTask(task)) continue;
    if (!knownIds.add(task.taskId)) continue;
    missingRuntimeTasks.add(task as DownloadTask);
  }
  missingRuntimeTasks.sort((a, b) => a.taskId.compareTo(b.taskId));

  final nativeOnlyTaskIds = <String>{};
  for (final task in missingRuntimeTasks) {
    nativeOnlyTaskIds.add(task.taskId);
    records.add(TaskRecord(task, TaskStatus.running, 0, -1));
  }

  final durableOnlyTaskIds = <String>{};
  final missingDurableRecords = <TaskRecord>[];
  for (final record in durableRecords) {
    if (!isLogicalEpisodeDownloadTask(record.task)) continue;
    if (!knownIds.add(record.task.taskId)) continue;
    durableOnlyTaskIds.add(record.task.taskId);
    missingDurableRecords.add(record);
  }
  missingDurableRecords.sort(
    (a, b) => a.task.taskId.compareTo(b.task.taskId),
  );
  records.addAll(missingDurableRecords);

  // Preserve executor order when no durable FIFO evidence exists. Once at
  // least one timestamp is available, order all logical rows deterministically
  // and put unknown-age legacy rows after known FIFO entries.
  if (orderByTaskId.isNotEmpty) {
    records.sort((a, b) {
      final aOrder = orderByTaskId[a.task.taskId];
      final bOrder = orderByTaskId[b.task.taskId];
      if (aOrder != null || bOrder != null) {
        if (aOrder == null) return 1;
        if (bOrder == null) return -1;
        final byOrder = aOrder.compareTo(bOrder);
        if (byOrder != 0) return byOrder;
      }
      return a.task.taskId.compareTo(b.task.taskId);
    });
  }

  return DownloadRecoveryInventory(
    records: List<TaskRecord>.unmodifiable(records),
    nativeOnlyTaskIds: Set<String>.unmodifiable(nativeOnlyTaskIds),
    durableOnlyTaskIds: Set<String>.unmodifiable(durableOnlyTaskIds),
  );
}
'''
          text = replace_once(text, old, new, 'recovery inventory')
          path.write_text(text)

          # 2) JobStore owns a backwards-compatible full task snapshot.
          path = Path('lib/core/services/download_job_store.dart')
          text = path.read_text()
          text = replace_once(
              text,
              "import 'package:hive_flutter/hive_flutter.dart';\n",
              "import 'package:background_downloader/background_downloader.dart';\nimport 'package:hive_flutter/hive_flutter.dart';\n",
              'job store import',
          )
          text = replace_once(text, 'const int kDownloadJobSchemaVersion = 3;', 'const int kDownloadJobSchemaVersion = 4;', 'schema')
          text = replace_once(
              text,
              '''    required this.updatedAtMillis,\n    this.fingerprint,\n''',
              '''    required this.updatedAtMillis,\n    this.taskSnapshot,\n    this.fingerprint,\n''',
              'record constructor snapshot',
          )
          text = replace_once(
              text,
              '''  final int updatedAtMillis;\n  final DownloadResourceFingerprint? fingerprint;\n''',
              '''  final int updatedAtMillis;\n  final Map<String, dynamic>? taskSnapshot;\n  final DownloadResourceFingerprint? fingerprint;\n''',
              'record field snapshot',
          )
          text = replace_once(
              text,
              '''  DownloadAttemptToken get attemptToken =>\n      DownloadAttemptToken(taskId: taskId, generation: generation);\n\n''',
              '''  DownloadAttemptToken get attemptToken =>\n      DownloadAttemptToken(taskId: taskId, generation: generation);\n\n  DownloadTask? restoreTaskSnapshot() {\n    final raw = taskSnapshot;\n    if (raw == null) return null;\n    try {\n      final restored = Task.createFromJson(Map<String, dynamic>.from(raw));\n      return restored is DownloadTask ? restored : null;\n    } catch (_) {\n      return null;\n    }\n  }\n\n''',
              'restore snapshot method',
          )
          text = replace_once(
              text,
              '''    int? updatedAtMillis,\n    DownloadResourceFingerprint? fingerprint,\n''',
              '''    int? updatedAtMillis,\n    Map<String, dynamic>? taskSnapshot,\n    bool clearTaskSnapshot = false,\n    DownloadResourceFingerprint? fingerprint,\n''',
              'copyWith snapshot args',
          )
          text = replace_once(
              text,
              '''    updatedAtMillis: updatedAtMillis ?? this.updatedAtMillis,\n    fingerprint: clearFingerprint ? null : (fingerprint ?? this.fingerprint),\n''',
              '''    updatedAtMillis: updatedAtMillis ?? this.updatedAtMillis,\n    taskSnapshot: clearTaskSnapshot\n        ? null\n        : (taskSnapshot ?? this.taskSnapshot),\n    fingerprint: clearFingerprint ? null : (fingerprint ?? this.fingerprint),\n''',
              'copyWith snapshot value',
          )
          text = replace_once(
              text,
              '''    'updatedAtMillis': updatedAtMillis,\n    if (fingerprint != null) 'fingerprint': fingerprint!.toJson(),\n''',
              '''    'updatedAtMillis': updatedAtMillis,\n    if (taskSnapshot != null)\n      'taskSnapshot': Map<String, dynamic>.from(taskSnapshot!),\n    if (fingerprint != null) 'fingerprint': fingerprint!.toJson(),\n''',
              'toJson snapshot',
          )
          text = replace_once(
              text,
              '''      updatedAtMillis: _intValue(map['updatedAtMillis']),\n      fingerprint: DownloadResourceFingerprint.fromJson(map['fingerprint']),\n''',
              '''      updatedAtMillis: _intValue(map['updatedAtMillis']),\n      taskSnapshot: map['taskSnapshot'] is Map\n          ? Map<String, dynamic>.from(map['taskSnapshot'] as Map)\n          : null,\n      fingerprint: DownloadResourceFingerprint.fromJson(map['fingerprint']),\n''',
              'fromJson snapshot',
          )
          # Merge a previously durable descriptor even if a status-only direct
          # put was constructed without it.
          text = replace_once(
              text,
              '''      expectedBytes: next.expectedBytes > 0\n          ? next.expectedBytes\n          : current?.expectedBytes,\n      fingerprint: fingerprint,\n''',
              '''      expectedBytes: next.expectedBytes > 0\n          ? next.expectedBytes\n          : current?.expectedBytes,\n      taskSnapshot: next.taskSnapshot ?? current?.taskSnapshot,\n      fingerprint: fingerprint,\n''',
              'put snapshot merge',
          )
          # checkpoint accepts/preserves the descriptor.
          text = replace_once(
              text,
              '''    bool? queueWaiting,\n    DownloadResourceFingerprint? fingerprint,\n    int? updatedAtMillis,\n''',
              '''    bool? queueWaiting,\n    Map<String, dynamic>? taskSnapshot,\n    DownloadResourceFingerprint? fingerprint,\n    int? updatedAtMillis,\n''',
              'checkpoint snapshot arg',
          )
          # This pattern occurs in the two checkpoint construction branches.
          text = text.replace(
              '''            updatedAtMillis: now,\n            fingerprint: fingerprint,\n''',
              '''            updatedAtMillis: now,\n            taskSnapshot: taskSnapshot,\n            fingerprint: fingerprint,\n''',
              1,
          )
          text = text.replace(
              '''            updatedAtMillis: now,\n            fingerprint: fingerprint,\n          );\n''',
              '''            updatedAtMillis: now,\n            taskSnapshot: taskSnapshot,\n            fingerprint: fingerprint,\n          );\n''',
              1,
          )
          path.write_text(text)

          # 3) Metadata keeps the same descriptor as an independent recovery replica.
          path = Path('lib/core/storage/storage_service.dart')
          text = path.read_text()
          sig = '''    String? trackingUrl,\n    String? filePath,\n    bool? queueWaiting,\n'''
          if text.count(sig) != 2:
              raise SystemExit(f'metadata signatures: expected 2, found {text.count(sig)}')
          text = text.replace(
              sig,
              '''    String? trackingUrl,\n    String? filePath,\n    Map<String, dynamic>? taskSnapshot,\n    bool? queueWaiting,\n''',
              2,
          )
          text = replace_once(
              text,
              "      if (filePath != null && filePath.isNotEmpty) 'filePath': filePath,\n",
              "      if (filePath != null && filePath.isNotEmpty) 'filePath': filePath,\n      if (taskSnapshot != null)\n        'taskSnapshot': Map<String, dynamic>.from(taskSnapshot),\n",
              'metadata save snapshot',
          )
          text = replace_once(
              text,
              '''    if (filePath != null && filePath.isNotEmpty) {\n      map['filePath'] = filePath;\n    }\n''',
              '''    if (filePath != null && filePath.isNotEmpty) {\n      map['filePath'] = filePath;\n    }\n    if (taskSnapshot != null) {\n      map['taskSnapshot'] = Map<String, dynamic>.from(taskSnapshot);\n    }\n''',
              'metadata patch snapshot',
          )
          marker = '''  Future<Map<String, dynamic>?> getDownloadMetadata(String taskId) async {\n    final box = await Hive.openBox<dynamic>(kDownloadMetadataBox);\n    final data = box.get(taskId);\n    if (data == null) return null;\n    return Map<String, dynamic>.from(data as Map);\n  }\n\n'''
          replacement = marker + '''  Future<Map<String, Map<String, dynamic>>> getAllDownloadMetadata() async {\n    final box = await Hive.openBox<dynamic>(kDownloadMetadataBox);\n    final result = <String, Map<String, dynamic>>{};\n    for (final key in box.keys) {\n      if (key is! String) continue;\n      final raw = box.get(key);\n      if (raw is! Map) continue;\n      result[key] = Map<String, dynamic>.from(raw);\n    }\n    return result;\n  }\n\n'''
          text = replace_once(text, marker, replacement, 'metadata enumeration')
          path.write_text(text)

          # 4) DownloadService joins JobStore/metadata snapshots into startup inventory.
          path = Path('lib/core/services/download_service.dart')
          text = path.read_text()
          text = replace_once(
              text,
              '''        queueWaiting: queueWaiting,\n        fingerprint: DownloadResourceFingerprint(\n''',
              '''        queueWaiting: queueWaiting,\n        taskSnapshot: task.toJson(),\n        fingerprint: DownloadResourceFingerprint(\n''',
              'checkpoint task snapshot',
          )
          old_prelude = '''  Future<void> _recoverPersistedDownloads() async {\n    final persistedRecords = await FileDownloader().database.allRecords();\n    final runtimeTasks = await _liveTransferTasks();\n    final inventory = buildDownloadRecoveryInventory(\n      persistedRecords: persistedRecords,\n      runtimeTasks: runtimeTasks,\n    );\n    final records = inventory.records;\n    diagnosticLog.record('recovery.begin', {\n      'count': records.length,\n      'nativeOnly': inventory.nativeOnlyTaskIds.length,\n    });\n'''
          new_prelude = '''  Future<void> _recoverPersistedDownloads() async {\n    final storage = _ref.read(storageServiceProvider);\n    final persistedRecords = await FileDownloader().database.allRecords();\n    final runtimeTasks = await _liveTransferTasks();\n    final jobs = await _jobStore.all();\n    final metadataById = await storage.getAllDownloadMetadata();\n\n    final durableRecords = <TaskRecord>[];\n    final orderByTaskId = <String, int>{};\n    final knownExecutorIds = <String>{\n      for (final record in persistedRecords) record.task.taskId,\n      for (final task in runtimeTasks) task.taskId,\n    };\n\n    for (final entry in metadataById.entries) {\n      final timestamp = entry.value['timestamp'];\n      if (timestamp is num) orderByTaskId[entry.key] = timestamp.toInt();\n    }\n    for (final job in jobs) {\n      orderByTaskId.putIfAbsent(job.taskId, () => job.updatedAtMillis);\n      if (knownExecutorIds.contains(job.taskId) ||\n          job.state == DownloadJobState.completed ||\n          job.state == DownloadJobState.canceled ||\n          job.state == DownloadJobState.orphaned) {\n        continue;\n      }\n      final metadata = metadataById[job.taskId];\n      final task = job.restoreTaskSnapshot() ??\n          _downloadTaskFromMetadataSnapshot(metadata);\n      if (task == null) {\n        await _jobStore.checkpoint(\n          taskId: job.taskId,\n          trackingUrl: job.trackingUrl,\n          state: DownloadJobState.orphaned,\n          durableBytes: job.durableBytes,\n          durableByteProvenance: job.durableByteProvenance,\n          expectedBytes: job.expectedBytes,\n          userPaused: job.userPaused,\n          queueWaiting: false,\n          fingerprint: job.fingerprint,\n        );\n        diagnosticLog.record('recovery.orphanedMissingDescriptor', {\n          'taskId': job.taskId,\n          'source': 'jobStore',\n        });\n        continue;\n      }\n      final progress = job.expectedBytes > 0\n          ? (job.durableBytes / job.expectedBytes).clamp(0.0, 1.0).toDouble()\n          : downloadMetadataProgress(metadata);\n      durableRecords.add(\n        TaskRecord(task, TaskStatus.paused, progress, job.expectedBytes),\n      );\n    }\n\n    // Metadata can survive even if both executor DB and JobStore were lost.\n    // New-format rows carry a complete task snapshot and are recoverable; old\n    // rows are retained as explicit orphan logical state instead of guessing\n    // URL/headers/path and accidentally starting the wrong writer.\n    for (final entry in metadataById.entries) {\n      final taskId = entry.key;\n      if (knownExecutorIds.contains(taskId) ||\n          jobs.any((job) => job.taskId == taskId) ||\n          durableRecords.any((record) => record.task.taskId == taskId)) {\n        continue;\n      }\n      final metadata = entry.value;\n      final task = _downloadTaskFromMetadataSnapshot(metadata);\n      final trackingUrl = (metadata['trackingUrl'] as String?)?.trim() ?? '';\n      if (task == null) {\n        if (trackingUrl.isNotEmpty) {\n          await _jobStore.checkpoint(\n            taskId: taskId,\n            trackingUrl: trackingUrl,\n            state: DownloadJobState.orphaned,\n            expectedBytes: downloadMetadataExpectedBytes(metadata),\n            userPaused: isUserPausedMetadata(metadata),\n            queueWaiting: false,\n          );\n          diagnosticLog.record('recovery.orphanedMissingDescriptor', {\n            'taskId': taskId,\n            'source': 'metadata',\n          });\n        }\n        continue;\n      }\n      final expected = downloadMetadataExpectedBytes(metadata);\n      durableRecords.add(\n        TaskRecord(\n          task,\n          TaskStatus.paused,\n          downloadMetadataProgress(metadata),\n          expected,\n        ),\n      );\n    }\n\n    final inventory = buildDownloadRecoveryInventory(\n      persistedRecords: persistedRecords,\n      runtimeTasks: runtimeTasks,\n      durableRecords: durableRecords,\n      orderByTaskId: orderByTaskId,\n    );\n    final records = inventory.records;\n    diagnosticLog.record('recovery.begin', {\n      'count': records.length,\n      'nativeOnly': inventory.nativeOnlyTaskIds.length,\n      'durableOnly': inventory.durableOnlyTaskIds.length,\n    });\n'''
          text = replace_once(text, old_prelude, new_prelude, 'service recovery prelude')
          # storage was moved before inventory.
          text = replace_once(
              text,
              '''    final nativeIds = <String>{\n      for (final task in runtimeTasks)\n        if (isLogicalEpisodeDownloadTask(task)) task.taskId,\n    };\n    final storage = _ref.read(storageServiceProvider);\n''',
              '''    final nativeIds = <String>{\n      for (final task in runtimeTasks)\n        if (isLogicalEpisodeDownloadTask(task)) task.taskId,\n    };\n''',
              'remove duplicate storage local',
          )
          # Preserve task descriptor in the migrated durable record.
          text = replace_once(
              text,
              '''        updatedAtMillis: DateTime.now().millisecondsSinceEpoch,\n        fingerprint:\n            oldJob?.fingerprint ??\n''',
              '''        updatedAtMillis: DateTime.now().millisecondsSinceEpoch,\n        taskSnapshot: oldJob?.taskSnapshot ?? task.toJson(),\n        fingerprint:\n            oldJob?.fingerprint ??\n''',
              'migrated snapshot',
          )
          # Durable-only rows are safe compatibility projections but not owners.
          anchor = '''      if (inventory.nativeOnlyTaskIds.contains(task.taskId) &&\n          recoveryPlan.action != DownloadRecoveryAction.ignore) {\n'''
          if text.count(anchor) != 1:
              raise SystemExit('native-only anchor missing')
          durable_block = '''      if (inventory.durableOnlyTaskIds.contains(task.taskId) &&\n          recoveryPlan.action != DownloadRecoveryAction.ignore) {\n        await FileDownloader().database.updateRecord(\n          TaskRecord(task, TaskStatus.paused, progress, expectedBytes),\n        );\n        diagnosticLog.record('recovery.repairedDurableProjection', {\n          'taskId': task.taskId,\n          'progress': progress,\n          'expectedBytes': expectedBytes,\n        });\n      }\n\n'''
          text = text.replace(anchor, durable_block + anchor, 1)
          # Fresh start JobStore descriptor.
          text = replace_once(
              text,
              '''            updatedAtMillis: DateTime.now().millisecondsSinceEpoch,\n            fingerprint: DownloadResourceFingerprint(\n              expectedBytes: expectedBytes,\n              finalUrl: url,\n''',
              '''            updatedAtMillis: DateTime.now().millisecondsSinceEpoch,\n            taskSnapshot: transferTask.toJson(),\n            fingerprint: DownloadResourceFingerprint(\n              expectedBytes: expectedBytes,\n              finalUrl: url,\n''',
              'fresh job snapshot',
          )
          # Metadata descriptor on fresh start.
          text = replace_once(
              text,
              '''          trackingUrl: trackingUrl ?? url,\n          filePath: path,\n          queueWaiting: !startNow,\n''',
              '''          trackingUrl: trackingUrl ?? url,\n          filePath: path,\n          taskSnapshot: transferTask.toJson(),\n          queueWaiting: !startNow,\n''',
              'fresh metadata snapshot',
          )
          # Seeded range job descriptor. Target only block with state interrupted.
          seed_pattern = re.compile(
              r"(final seeded = DownloadJobRecord\(\n\s+taskId: task\.taskId,.*?updatedAtMillis: DateTime\.now\(\)\.millisecondsSinceEpoch,\n)(\s+fingerprint:)",
              re.S,
          )
          text, count = seed_pattern.subn(r"\1        taskSnapshot: task.toJson(),\n\2", text, count=1)
          if count != 1:
              raise SystemExit(f'range seed snapshot: expected 1, found {count}')

          # Helper for metadata snapshot parsing.
          helper_anchor = '''  Future<void> _restoreAuthoritativeJobIntent() async {\n'''
          helper = '''  DownloadTask? _downloadTaskFromMetadataSnapshot(\n    Map<String, dynamic>? metadata,\n  ) {\n    final raw = metadata?['taskSnapshot'];\n    if (raw is! Map) return null;\n    try {\n      final restored = Task.createFromJson(Map<String, dynamic>.from(raw));\n      return restored is DownloadTask && isLogicalEpisodeDownloadTask(restored)\n          ? restored\n          : null;\n    } catch (_) {\n      return null;\n    }\n  }\n\n'''
          text = replace_once(text, helper_anchor, helper + helper_anchor, 'metadata snapshot helper')
          path.write_text(text)

          # 5) Focused verifier now exercises both inventory and snapshot contract.
          path = Path('.github/workflows/dm04-verifier.yml')
          text = path.read_text()
          text = replace_once(
              text,
              '      - name: Run DM-04 recovery inventory regression\n        run: flutter test test/core/services/download_recovery_inventory_test.dart\n',
              '      - name: Run DM-04 durable recovery regressions\n        run: flutter test test/core/services/download_recovery_inventory_test.dart test/core/services/download_recovery_snapshot_test.dart\n',
              'focused verifier tests',
          )
          path.write_text(text)
          PY

      - name: Format and generate
        run: |
          dart format lib/core/services/download_job_state.dart lib/core/services/download_job_store.dart lib/core/storage/storage_service.dart lib/core/services/download_service.dart test/core/services/download_recovery_inventory_test.dart test/core/services/download_recovery_snapshot_test.dart
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
      - name: Targeted DM-04 tests
        run: |
          flutter test test/core/services/download_recovery_inventory_test.dart test/core/services/download_recovery_snapshot_test.dart
          flutter test test/core/services/download_recovery_fault_injection_test.dart test/core/services/download_startup_reconciliation_matrix_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Verify diff
        run: git diff --check
      - name: Commit and push
        run: |
          git config user.name "Fares669"
          git config user.email "108722956+Fares669@users.noreply.github.com"
          git add lib/core/services/download_job_state.dart lib/core/services/download_job_store.dart lib/core/storage/storage_service.dart lib/core/services/download_service.dart .github/workflows/dm04-verifier.yml
          if git diff --cached --quiet; then
            echo "No implementation diff to commit"
            exit 1
          fi
          git commit -m "fix(downloads): recover durable-only startup state [dm04-durable-applied]"
          git push origin HEAD:plan/download-manager-reliability
