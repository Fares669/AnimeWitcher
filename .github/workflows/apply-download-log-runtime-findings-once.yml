name: Apply download log runtime findings

on:
  push:
    branches: [fix/download-log-runtime-findings]

permissions:
  contents: write

concurrency:
  group: apply-download-log-runtime-findings
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply runtime fixes found in diagnostic logs
        run: python3 scripts/apply_download_log_runtime_findings.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Format and run focused regression test
        run: |
          dart format lib/core/services/persistent_parallel_download.dart test/core/services/download_progress_cadence_test.dart
          flutter pub get
          flutter test test/core/services/download_progress_cadence_test.dart
          git diff --check

      - name: Commit fixes and remove one-off helpers
        run: |
          rm .github/workflows/apply-download-log-runtime-findings-once.yml
          rm scripts/apply_download_log_runtime_findings.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix multipart progress backpressure and iOS task cadence"
          git push
