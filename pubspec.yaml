name: animewitcher
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to use `flutter pub publish`.

version: 1.5.0+1

environment:
  # background_downloader 9.6+ requires Dart 3.13 and provides the Transfers
  # API used by AnimeWitcher's native single-file transport.
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.1.0
  hooks_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  collection: ^1.18.0
  go_router: ^17.0.1
  dio: ^5.9.0
  google_fonts: ^8.0.2
  cached_network_image: ^3.4.1
  package_info_plus: any
  shared_preferences: ^2.5.4
  path_provider: ^2.1.5
  disk_usage: ^1.0.0
  wakelock_plus: ^1.4.0
  # background_downloader 9.6 currently depends on connectivity_plus 6.x.
  connectivity_plus: ^6.1.5
  hive_flutter: ^1.1.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  screen_brightness: ^2.1.7
  flutter_volume_controller: ^2.0.1
  dynamic_color: ^1.8.1
  window_manager: ^0.5.1
  device_info_plus: any
  crypto: ^3.0.7
  file_picker: ^12.0.0-beta.7
  image: ^4.8.0
  archive: ^4.0.7
  permission_handler: ^13.0.0
  url_launcher: ^6.3.2
  version: ^3.0.2
  open_file: ^4.0.0
  flutter_displaymode: ^0.7.0
  intl: ^0.20.2
  flutter_svg: ^2.2.3
  dpad: ^2.0.2
  shimmer: ^3.0.0
  video_view:
    path: packages/video_view
  flutter_cache_manager: ^3.4.1
  path: ^1.9.1
  http: ^1.6.0
  html_unescape: ^2.0.0
  background_downloader: ^9.6.0
  flutter_hooks: ^0.21.3+1
  talker_flutter: ^5.1.16
  visibility_detector: ^0.4.0+2
  flutter_secure_storage: ^10.3.1
  google_sign_in: ^7.2.0
  lucide_icons_flutter: ^3.1.19

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0
  riverpod_generator: ^4.0.0
  build_runner: ^2.4.9
  go_router_builder: ^4.2.1

flutter:
  config:
    # Keep iOS plugin dependencies on CocoaPods. The current plugin set still
    # contains packages without SwiftPM support, and the hybrid Xcode package
    # graph can crash while resolving dependencies on CI.
    enable-swift-package-manager: false

  uses-material-design: true
  generate: true
  assets:
    - assets/images/
