name: animewitcher
description: "Anime streaming and management application"
publish_to: "none"

version: 1.5.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  riverpod: ^3.1.0
  flutter_riverpod: ^3.1.0
  hooks_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  dio: ^5.9.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  go_router: ^17.0.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  flutter_staggered_grid_view: ^0.7.0
  cached_network_image: ^3.4.1
  palette_generator: ^0.3.3+7
  flutter_animate: ^4.5.2
  visibility_detector: ^0.4.0+2
  flutter_volume_controller: ^1.3.4
  screen_brightness: ^2.1.7
  share_plus: ^12.0.1
  shared_preferences: ^2.5.4
  path_provider: ^2.1.5
  uuid: ^4.5.2
  package_info_plus: ^9.0.0
  connectivity_plus: ^7.0.0
  device_info_plus: ^12.3.0
  disk_usage: ^4.0.0
  wakelock_plus: ^1.4.0
  permission_handler: ^13.0.0
  ffi: ^2.2.0
  file_picker: ^12.0.0-beta.7
  image: ^4.8.0
  archive: ^4.0.7
  permission_handler: ^13.0.0
  url_launcher: ^6.3.2
  version: ^3.0.2
  open_file: ^4.0.0
  flutter_displaymode: ^0.7.0
  intl: ^0.20.2
  flutter_svg: ^2.2.3
  dpad: ^2.0.2
  shimmer: ^3.0.0
  video_view:
    path: packages/video_view
  flutter_cache_manager: ^3.4.1
  path: ^1.9.1
  http: ^1.6.0
  html_unescape: ^2.0.0
  background_downloader: ^9.6.2
  flutter_hooks: ^0.21.3+1
  talker_flutter: ^5.1.16
  visibility_detector: ^0.4.0+2
  flutter_secure_storage: ^10.3.1
  google_sign_in: ^7.2.0
  lucide_icons_flutter: ^3.1.19

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0
  riverpod_generator: ^4.0.0
  build_runner: ^2.4.9
  go_router_builder: ^4.2.1

flutter:
  config:
    # Keep iOS plugin dependencies on CocoaPods. The current plugin set still
    # contains packages without SwiftPM support, and the hybrid Xcode package
    # graph can crash while resolving dependencies on CI.
    enable-swift-package-manager: false

  uses-material-design: true
  generate: true
