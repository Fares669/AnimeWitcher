name: animewitcher
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to use `flutter pub publish`.

version: 1.6.6+7

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.1'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.5.0
  hooks_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8
  collection: ^1.19.1
  go_router: ^18.1.4
  dio: ^5.11.1
  google_fonts: ^9.0.0
  cached_network_image: ^4.0.7
  octo_image: ^2.1.5
  file: ^7.0.1
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  wakelock_plus: ^1.8.2
  connectivity_plus: ^7.3.2
  hive_flutter: ^1.1.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  screen_brightness: ^2.1.11
  flutter_volume_controller: ^2.0.2
  window_manager: ^0.7.0
  device_info_plus: ^13.3.0
  crypto: ^3.0.8
  ffi: ^2.2.0
  code_assets: ^2.2.0
  hooks: ^2.2.0
  native_toolchain_c: ^0.19.6
  flutter_avif_ios: ^3.1.0
  flutter_avif_platform_interface: ^3.1.0
  file_picker: ^13.4.1
  image: ^4.13.1
  archive: ^4.7.1
  permission_handler: ^13.0.2
  url_launcher: ^6.3.3
  version: ^3.0.2
  open_file: ^4.0.0
  flutter_displaymode: ^0.7.0
  intl: ^0.20.3
  flutter_svg: ^2.5.0
  dpad: ^3.3.0
  shimmer: ^4.0.0
  super_sliver_list: ^0.4.1
  video_view:
    path: packages/video_view
  flutter_cache_manager: ^3.5.0
  path: ^1.9.1
  http: ^1.6.0
  html: ^0.15.7
  html_unescape: ^2.0.0
  # Native completion hooks are validated against this exact upstream version.
  background_downloader: 9.6.6
  flutter_hooks: ^0.21.4
  talker_flutter: ^5.2.0
  visibility_detector: ^0.4.0+2
  flutter_secure_storage: ^11.2.0
  lucide_icons_flutter: ^4.0.3
  webview_flutter: ^4.14.1
  webview_cookie_manager_flutter: ^3.1.0

# Keep transitive media_kit_video users on the same patched native runtime.
dependency_overrides:
  media_kit:
    path: packages/media_kit
  media_kit_libs_android_video:
    path: packages/media_kit_libs_android_video

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.3
  flutter_lints: ^6.0.0
  riverpod_lint: ^3.2.0
  riverpod_generator: ^4.0.10
  build_runner: ^2.17.1
  go_router_builder: ^4.5.3

flutter:
  config:
    # Keep iOS plugin dependencies on CocoaPods. The current plugin set still
    # contains packages without SwiftPM support, and the hybrid Xcode package
    # graph can crash while resolving dependencies on CI.
    enable-swift-package-manager: false

  uses-material-design: true
  generate: true
  assets:
    - assets/images/

  shaders:
    - shaders/progressive_header_blur.frag

  # The app's typeface, every weight it draws (licence: OFL.txt beside them).
  fonts:
    - family: Readex Pro
      fonts:
        - asset: assets/fonts/readex_pro/ReadexPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/readex_pro/ReadexPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/readex_pro/ReadexPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/readex_pro/ReadexPro-Bold.ttf
          weight: 700
