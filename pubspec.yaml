name: animewitcher
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to use `flutter pub publish`.

version: 1.6.3+5

environment:
  # background_downloader 9.6+ requires Dart 3.13 and provides the Transfers
  # API used by AnimeWitcher's native single-file transport.
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  hooks_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  collection: ^1.19.1
  go_router: ^18.1.0
  dio: ^5.11.1
  google_fonts: ^9.0.0
  cached_network_image: ^4.0.4
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  wakelock_plus: ^1.8.1
  # background_downloader 9.6.4 supports connectivity_plus >=6.1.3 <8.0.0.
  connectivity_plus: ^7.3.2
  hive_flutter: ^1.1.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  screen_brightness: ^2.1.11
  flutter_volume_controller: ^2.0.2
  dynamic_color: ^2.1.0
  window_manager: ^0.5.2
  device_info_plus: ^13.3.0
  crypto: ^3.0.7
  ffi: ^2.2.0
  code_assets: ^2.1.0
  hooks: ^2.2.0
  native_toolchain_c: ^0.19.5
  flutter_avif_ios: ^3.1.0
  flutter_avif_platform_interface: ^3.1.0
  file_picker: ^13.1.0
  image: ^4.12.0
  archive: ^4.5.2
  permission_handler: ^13.0.2
  url_launcher: ^6.3.3
  version: ^3.0.2
  open_file: ^4.0.0
  flutter_displaymode: ^0.7.0
  intl: ^0.20.3
  flutter_svg: ^2.3.0
  dpad: ^3.1.1
  shimmer: ^4.0.0
  super_sliver_list: ^0.4.1
  video_view:
    path: packages/video_view
  flutter_cache_manager: ^3.4.5
  path: ^1.9.1
  http: ^1.6.0
  html_unescape: ^2.0.0
  # Native completion hooks are validated against this exact upstream version.
  background_downloader: 9.6.4
  flutter_hooks: ^0.21.3+1
  talker_flutter: ^5.1.20
  visibility_detector: ^0.4.0+2
  flutter_secure_storage: ^11.2.0
  lucide_icons_flutter: ^4.0.0

# Keep transitive media_kit_video users on the same patched native runtime.
dependency_overrides:
  media_kit:
    path: packages/media_kit

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.3
  flutter_lints: ^6.0.0
  riverpod_lint: ^3.1.9
  riverpod_generator: ^4.0.9
  # 2.17.0 is retracted; 2.17.1 requires build 5, unsupported by our builders.
  build_runner: ^2.16.2
  go_router_builder: ^4.5.0

flutter:
  config:
    # Keep iOS plugin dependencies on CocoaPods. The current plugin set still
    # contains packages without SwiftPM support, and the hybrid Xcode package
    # graph can crash while resolving dependencies on CI.
    enable-swift-package-manager: false

  uses-material-design: true
  generate: true
  assets:
    - assets/images/

  shaders:
    - shaders/progressive_header_blur.frag

  # The app's typeface, every weight it draws (licence: OFL.txt beside them).
  fonts:
    - family: Readex Pro
      fonts:
        - asset: assets/fonts/readex_pro/ReadexPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/readex_pro/ReadexPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/readex_pro/ReadexPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/readex_pro/ReadexPro-Bold.ttf
          weight: 700
