import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.security.MessageDigest

plugins {
    id 'com.android.library'
}

group = 'com.alexmercerind.media_kit_libs_android_video'
version = '1.0'

android {
    namespace = 'com.alexmercerind.media_kit_libs_android_video'
    compileSdk = 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdk = 16
    }
}

def bundleVersion = 'v1.1.11'
def checksums = [
    'arm64-v8a'  : '2a906875af68be8c98c4a83c236bc24053f46e0accf62b115993ef1d740e98cc',
    'armeabi-v7a': 'a9926cb4f8f42032769d411390b812f08a10a8048c67518e1e325803468da047',
    'x86'        : '5eaf7658a72f44ca4983b269c276fdb2c7ccb5cc0278c288a296d7729ada8e64',
    'x86_64'     : 'afe9aed06498a04b9b9655b0ad812dd29f864dcb6f735ab7df3900082bcb713d',
]
def output = layout.buildDirectory.dir("libmpv/$bundleVersion")
def archives = checksums.keySet().collect { abi -> output.map { it.file("default-${abi}.jar") } }

def downloadLibmpv = tasks.register('downloadLibmpv') {
    inputs.property('sha256', checksums)
    outputs.files(archives)

    doLast {
        def folder = output.get().asFile.toPath()
        Files.createDirectories(folder)
        def sha256 = { path ->
            MessageDigest.getInstance('SHA-256').digest(Files.readAllBytes(path)).encodeHex().toString()
        }
        checksums.each { abi, expectedSha256 ->
            def name = "default-${abi}.jar"
            def destination = folder.resolve(name)
            if (Files.exists(destination) && sha256(destination) == expectedSha256) return

            def temporary = Files.createTempFile(folder, name, '.tmp')
            try {
                def connection = URI.create(
                    "https://github.com/media-kit/libmpv-android-video-build/releases/download/$bundleVersion/$name"
                ).toURL().openConnection()
                connection.connectTimeout = 15000
                connection.readTimeout = 30000
                connection.inputStream.withCloseable { input ->
                    Files.copy(input, temporary, StandardCopyOption.REPLACE_EXISTING)
                }
                if (sha256(temporary) != expectedSha256) {
                    throw new GradleException("SHA-256 mismatch for libmpv $bundleVersion $name")
                }
                Files.move(temporary, destination, StandardCopyOption.ATOMIC_MOVE, StandardCopyOption.REPLACE_EXISTING)
            } finally {
                Files.deleteIfExists(temporary)
            }
        }
    }
}

dependencies {
    implementation files(archives).builtBy(downloadLibmpv)
}
